<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="theme-color" content="#011D2E">
<title>Polaris — Financeiro</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html{overflow-x:hidden;width:100%}
body{overflow-x:hidden;width:100%;max-width:100vw;position:relative}
img,video,table{max-width:100%}
:root{--navy:#011D2E;--green:#3B8B3B;--green-l:#58B868;--gold:#F5A623;--red:#e07070;
--bg:#0a1622;--card:#0f2233;--card2:#13293c;--border:#1d3850;--txt:#eaf2f8;--muted:#8fa6b8}
html[data-theme="light"]{--gold:#B8790A;--green-l:#3B8B3B;--red:#c44;--bg:#F0F2ED;--card:#FFF;--card2:#F4F6F3;
--border:#DCE4EA;--txt:#022C44;--muted:#5F7787}
body{font-family:'Manrope',system-ui,sans-serif;background:
radial-gradient(1100px 560px at 82% -12%, rgba(12,60,90,.32) 0%, transparent 62%),var(--bg);
color:var(--txt);min-height:100vh;transition:background .3s;-webkit-font-smoothing:antialiased}

.topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;
background:rgba(1,29,46,.88);backdrop-filter:blur(10px);
position:sticky;top:0;z-index:40;border-bottom:1px solid var(--border)}
html[data-theme="light"] .topbar{background:rgba(255,255,255,.9)}
.topbar img{height:26px}
.tabs{display:flex;gap:4px;background:var(--card2);border-radius:12px;padding:3px}
.tab{background:none;border:none;color:var(--muted);border-radius:9px;padding:8px 14px;
font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;
display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:.18s}
.tab:hover{color:var(--txt)}
.tab.on{background:var(--card);color:var(--gold);box-shadow:0 1px 6px rgba(0,0,0,.18)}
.tbrow{display:flex;align-items:center;gap:10px;width:100%;flex-wrap:wrap}
.tbacts{margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:0}
.ver{font-size:9.5px;color:var(--muted);opacity:.55;font-weight:700;white-space:nowrap}
@media(max-width:640px){.ver{display:none}}
.who{font-size:11px;color:var(--muted);font-weight:600;max-width:150px;
overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-out{background:none;border:1px solid var(--border);color:var(--muted);border-radius:9px;
padding:6px 10px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-out:hover{border-color:var(--gold);color:var(--gold)}
.wrap{max-width:1240px;margin:0 auto;padding:18px 16px 60px}

.subtabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;
-webkit-overflow-scrolling:touch}
.subtabs::-webkit-scrollbar{display:none}
.stb{background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:11px;
padding:9px 14px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.stb.on{border-color:var(--gold);color:var(--gold);background:var(--card2)}

.periodo{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);
border-radius:13px;padding:10px 12px;margin-bottom:14px;flex-wrap:wrap}
.periodo .nav{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;
width:32px;height:32px;font-size:15px;cursor:pointer;font-family:inherit;flex-shrink:0}
.periodo .lbl{flex:1;text-align:center;font-size:14px;font-weight:800;min-width:130px}
.periodo .lbl small{display:block;font-size:10.5px;color:var(--muted);font-weight:700;margin-top:2px}
.periodo select{background:var(--card2);border:1px solid var(--border);color:var(--txt);border-radius:9px;
padding:8px 10px;font-family:inherit;font-size:12.5px;font-weight:700;outline:none}

.cards{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px}
.kc{flex:1 1 150px;background:var(--card);border:1px solid var(--border);border-radius:13px;padding:13px}
.kc .l{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.7px}
.kc .n{font-size:21px;font-weight:800;margin-top:5px;line-height:1.1}
.kc .p{font-size:11px;color:var(--muted);font-weight:700;margin-top:3px}
.kc.pos .n{color:var(--green-l)}
.kc.neg .n{color:var(--red)}
.kc.gold .n{color:var(--gold)}
.kc.destaque{border-color:var(--gold)}

.dre{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.dre table{width:100%;border-collapse:collapse;font-size:13px}
.dre th{text-align:left;font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;
padding:10px 12px;border-bottom:1px solid var(--border);font-weight:800;background:var(--card2)}
.dre td{padding:9px 12px;border-bottom:1px solid var(--border);font-weight:600}
.dre tr:last-child td{border-bottom:none}
.dre .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dre .g1{background:var(--card2);font-weight:800;font-size:13px}
.dre .g2{font-weight:800;font-size:12.5px}
.dre .g2 td:first-child{padding-left:26px}
.dre .g3 td:first-child{padding-left:42px;color:var(--muted);font-size:12px}
.dre .calc{background:linear-gradient(90deg,rgba(245,166,35,.09),transparent);font-weight:800}
.dre .calc td{border-top:1px solid var(--gold);border-bottom:1px solid var(--gold)}
.dre .zero td{opacity:.4}
.dre .pct{font-size:11px;color:var(--muted);font-weight:700;text-align:right;white-space:nowrap}

.olist{display:grid;gap:9px}
@media(min-width:920px){.olist{grid-template-columns:1fr 1fr}}
.ob{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;
text-align:left;font-family:inherit;color:var(--txt);width:100%;cursor:pointer;transition:.18s}
.ob:hover{border-color:var(--gold);transform:translateY(-2px)}
.ob.bom{border-left:3px solid var(--green-l)}
.ob.medio{border-left:3px solid var(--gold)}
.ob.ruim{border-left:3px solid var(--red)}
.ob .top{display:flex;align-items:flex-start;gap:9px}
.ob .nm{flex:1;font-size:14.5px;font-weight:800;line-height:1.25}
.ob .mg{flex-shrink:0;text-align:right}
.ob .mg .v{font-size:17px;font-weight:800;line-height:1}
.ob .mg .k{font-size:9.5px;color:var(--muted);font-weight:800;text-transform:uppercase;margin-top:3px}
.ob .meta{font-size:11.5px;color:var(--muted);margin-top:7px;display:flex;flex-wrap:wrap;gap:4px 11px;font-weight:600}
.ob .barra{display:flex;height:6px;border-radius:4px;overflow:hidden;margin-top:10px;background:var(--card2)}
.ob .barra i{display:block;height:100%}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;
letter-spacing:.5px;text-transform:uppercase;border-radius:20px;padding:3px 8px;
background:var(--card2);border:1px solid var(--border);color:var(--muted)}
.tag.gold{border-color:var(--gold);color:var(--gold)}
.tag.green{border-color:var(--green-l);color:var(--green-l)}
.tag.red{border-color:var(--red);color:var(--red)}

.gtab{width:100%;font-size:12.5px;border-collapse:collapse;background:var(--card);
border:1px solid var(--border);border-radius:13px;overflow:hidden}
.gtab th{text-align:left;font-size:9.5px;color:var(--muted);text-transform:uppercase;
letter-spacing:.5px;padding:10px;border-bottom:1px solid var(--border);font-weight:800;background:var(--card2)}
.gtab td{padding:9px 10px;border-bottom:1px solid var(--border);font-weight:600}
.gtab tr:last-child td{border-bottom:none}
.gtab .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

.reg{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:15px;margin-bottom:12px}
.reg h3{font-size:11px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;
color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.reg h3::after{content:'';flex:1;height:1px;background:var(--border)}
.lin{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.cp{flex:1;min-width:120px}
.cp.w2{flex:2;min-width:180px}
label{display:block;font-size:10px;color:var(--muted);font-weight:800;
text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--border);
color:var(--txt);border-radius:9px;padding:10px;font-family:inherit;font-size:14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
.salvar{width:100%;background:var(--green);border:none;color:#fff;border-radius:10px;
padding:13px;font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer;margin-top:4px}
.salvar:active{transform:scale(.99)}
.salvar:disabled{opacity:.5;cursor:not-allowed}
.dica{font-size:11.5px;color:var(--muted);margin-top:9px;line-height:1.5;font-weight:600}
.aviso{background:var(--card2);border:1px solid var(--gold);border-radius:11px;padding:12px;
font-size:12px;line-height:1.55;font-weight:600;margin-bottom:14px}
.aviso b{color:var(--gold)}

.vazio{color:var(--muted);text-align:center;padding:30px 16px;font-size:13px;
background:var(--card);border:1px dashed var(--border);border-radius:13px;line-height:1.65;font-weight:600}
.vazio .i{display:block;font-size:30px;margin-bottom:9px;opacity:.7}
.center{text-align:center;padding:60px 20px;color:var(--muted)}
.spin{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--gold);
border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);
background:var(--card);border:1px solid var(--gold);color:var(--txt);border-radius:12px;
padding:13px 18px;font-size:13px;font-weight:700;z-index:90;transition:.28s;opacity:0;
max-width:90vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.pane{display:none}
.pane.on{display:block}
/* ---- Cascata simples ---- */
.casc{display:grid;gap:8px;margin-bottom:14px}
.big{background:var(--card);border:1px solid var(--gold);border-radius:16px;padding:18px;text-align:center}
.big .l{font-size:10.5px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.9px}
.big .n{font-size:32px;font-weight:800;margin-top:6px;line-height:1;color:var(--gold)}
.big .s{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:5px}
.step{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:13px 14px;
display:flex;align-items:center;gap:12px;text-align:left;width:100%;font-family:inherit;color:var(--txt);cursor:pointer}
.step:hover{border-color:var(--gold)}
.step .dot{width:11px;height:11px;border-radius:4px;flex-shrink:0}
.step .cn{flex:1;min-width:0}
.step .cn b{display:block;font-size:14px;font-weight:800;line-height:1.25}
.step .cn span{font-size:11px;color:var(--muted);font-weight:700}
.step .vl{text-align:right;flex-shrink:0}
.step .vl .v{font-size:15.5px;font-weight:800;line-height:1}
.step .vl .p{font-size:12px;color:var(--muted);font-weight:800;margin-top:2px}
.final{border-width:2px;padding:17px}
.final .cn b{font-size:16px}
.final .vl .v{font-size:23px}
.barra100{display:flex;height:12px;border-radius:7px;overflow:hidden;background:var(--card2);margin-bottom:14px}
.barra100 i{display:block;height:100%}
.seta{text-align:center;color:var(--muted);font-size:15px;line-height:1;opacity:.5}
.det{background:var(--card2);border:1px solid var(--border);border-radius:11px;padding:11px 13px;margin-top:-3px}
.det .r{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;padding:5px 0;gap:10px}
.det .r span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.linkmais{background:none;border:none;color:var(--muted);font-family:inherit;font-size:12px;
font-weight:800;cursor:pointer;text-decoration:underline;padding:8px 0;width:100%}
.linkmais:hover{color:var(--gold)}

/* ---- Atalhos de lançamento ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.atl{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 8px;
text-align:center;font-family:inherit;color:var(--txt);cursor:pointer;transition:.15s}
.atl:hover,.atl.on{border-color:var(--gold);background:var(--card2)}
.atl .ic{font-size:24px;line-height:1;display:block;margin-bottom:7px}
.atl .tx{font-size:11px;font-weight:800;line-height:1.25}
.chk{display:flex;align-items:center;gap:10px;padding:11px;border-bottom:1px solid var(--border)}
.chk:last-child{border-bottom:none}
.chk .st{width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;
font-size:12px;font-weight:800;flex-shrink:0}
.chk .st.ok{background:rgba(88,184,104,.16);color:var(--green-l)}
.chk .st.no{background:rgba(245,166,35,.16);color:var(--gold)}
.chk .cn{flex:1;min-width:0}
.chk .cn b{display:block;font-size:13px;font-weight:800}
.chk .cn span{font-size:11px;color:var(--muted);font-weight:700}
/* ---- Fila e drawer ---- */
.fila{background:var(--card);border:1px solid var(--gold);border-radius:14px;padding:14px;margin-bottom:14px}
.fbusca{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--txt);
border-radius:11px;padding:11px 13px;font-family:inherit;font-size:14px;margin:4px 0 9px}
.fbusca::placeholder{color:var(--muted)}
.ffiltros{display:flex;gap:6px;margin-bottom:9px;flex-wrap:wrap}
.ffiltros button{background:var(--card2);border:1px solid var(--border);color:var(--muted);
border-radius:20px;padding:6px 13px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
.ffiltros button.on{border-color:var(--gold);color:var(--txt);background:rgba(245,166,35,.10)}
.ffiltros button b{color:var(--txt);margin-left:3px}
.ftrilha{display:inline-block;font-size:10px;font-weight:800;color:var(--gold);
background:rgba(245,166,35,.12);border:1px solid rgba(245,166,35,.3);border-radius:5px;
padding:1px 6px;margin-left:6px;vertical-align:middle}
.fila h3{font-size:11px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;
color:var(--gold);margin-bottom:10px}
.fitem{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--border);
border-radius:11px;padding:11px;margin-bottom:7px;text-align:left;width:100%;font-family:inherit;color:var(--txt)}
.fitem.atrasado{border-left:3px solid var(--red)}
.fitem.parcial{border-left:3px solid var(--gold)}
.fitem.aberto{border-left:3px solid var(--muted)}
.fitem .cn{flex:1;min-width:0}
.fitem .cn b{display:block;font-size:13.5px;line-height:1.3}
.fitem .cn span{font-size:11px;color:var(--muted);font-weight:600}
.fitem .acts{display:flex;gap:5px;flex-shrink:0}
.bmini{background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:8px;
padding:7px 11px;font-family:inherit;font-size:11.5px;font-weight:800;cursor:pointer;white-space:nowrap}
.bmini.go{border-color:var(--green);color:var(--green-l)}
.bmini:hover{border-color:var(--gold);color:var(--gold)}
.ov{position:fixed;inset:0;background:rgba(0,10,20,.72);backdrop-filter:blur(4px);
z-index:60;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.dw{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:760px;
max-height:94vh;overflow-y:auto;border:1px solid var(--border);border-bottom:none}
@media(min-width:700px){.ov{align-items:center}.dw{border-radius:20px;border-bottom:1px solid var(--border)}}
.dwhead{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--border);
padding:17px 20px;z-index:2}
.dwhead b{font-size:18px;font-weight:800;display:block;padding-right:36px}
.dwhead span{font-size:12px;color:var(--muted);font-weight:600}
.fechar{position:absolute;top:15px;right:16px;background:var(--card2);border:1px solid var(--border);
color:var(--muted);width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:15px;font-family:inherit}
.dwbody{padding:16px 20px 30px}
.resumoCalc{background:var(--card2);border:1px solid var(--border);border-radius:11px;padding:12px;margin:10px 0}
.resumoCalc .r{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;padding:4px 0}
.resumoCalc .r.tot{border-top:1px solid var(--border);margin-top:5px;padding-top:8px;font-size:14px;font-weight:800}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="topbar">
  <div class="tbrow">
    <img id="logo" src="https://obras.polarisenergiasolar.com/logo.png" onerror="this.style.display='none'">
    <div class="tabs">
      <a class="tab" href="inicio.html">🏠 Início</a>
      <a class="tab" id="tabObras" href="painel.html">🏗️ Obras</a>
      <a class="tab" id="tabPV" href="posvenda.html">💚 Pós-venda</a>
      <button class="tab on">💰 Financeiro</button>
    </div>
    <div class="tbacts">
      <span class="who" id="who"></span>
      <button class="btn-out" id="bTema">🌙</button>
      <button class="btn-out" onclick="sair()" title="Sair">↪</button>
      <span class="ver" id="ver"></span>
    </div>
  </div>
</div>

<div class="wrap" id="app">
  <div class="center"><div class="spin"></div>Carregando financeiro...</div>
</div>
<div class="ov" id="ov"><div class="dw" id="dw"></div></div>
<div class="toast" id="toast"></div>

<script>
const SB_URL='https://dakubhcgohiwzyqiegqf.supabase.co';
const SB_KEY='sb_publishable_hue0wC6DINtAaxTPlSIOIg_X1Tr0vJx';
const sb=supabase.createClient(SB_URL,SB_KEY);
const LOGO_D='https://obras.polarisenergiasolar.com/logo.png';
const LOGO_L='https://obras.polarisenergiasolar.com/logo-claro.png';

let ABA='dre', INI=null, FIM=null, RATEIO='obra';
let DRE=null, OBRAS=null, FLUXO=null, DESEMP=null, CONTAS=[], PARAMS=[], ORIGENS=[];
let FILA=null, EDIT=null, FILA_TODAS=false, RESUMO=null, ABRIR=null, ATALHO=null, VERCONTAS=false;
let FILA_F='todas', FILA_Q='';
// redesenha só a fila, para o campo de busca não perder o foco a cada tecla
function redesenhaFila(){
  const el=document.querySelector('.fila');
  if(!el){ render(); return; }
  const inp=el.querySelector('#filaQ');
  const pos=inp?inp.selectionStart:null;
  const tmp=document.createElement('div');
  tmp.innerHTML=blocoFila();
  const sub=tmp.firstElementChild;
  if(!sub){ render(); return; }
  el.replaceWith(sub);
  const novo=document.getElementById('filaQ');
  if(novo){ novo.focus(); if(pos!=null) novo.setSelectionRange(pos,pos); }
}
let FNAT='', DRILL=null, EQUIPE=[], PARC=[];
let CALC={mod:8,estr:'Cerâmico',km:0,res:null}, ESTRUTURAS=[], KITS=[];
let DESV=null, VERDESV=false, PROV_DESDE=null;
function fnat(v,l){return '<button class="stb'+(FNAT===v?' on':'')+'" onclick="FNAT=\''+v+'\';render()">'+l+'</button>';}

document.getElementById('ver').textContent='v'+new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});

function tema(t){document.documentElement.setAttribute('data-theme',t);
  document.getElementById('bTema').textContent=t==='dark'?'🌙':'☀️';
  const l=document.getElementById('logo'); if(l) l.src=(t==='light')?LOGO_L:LOGO_D;
  try{localStorage.setItem('polaris-tema',t)}catch(e){}}
document.getElementById('bTema').onclick=function(){
  tema(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');};
try{tema(localStorage.getItem('polaris-tema')||'dark')}catch(e){tema('dark')}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(window._t);window._t=setTimeout(function(){t.classList.remove('on')},3200);}
function n(v){return Number(v||0);}
function moeda(v){return n(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL',
  minimumFractionDigits:0,maximumFractionDigits:0});}
function moeda2(v){return n(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function pct(v){return (n(v)*100).toFixed(1).replace('.',',')+'%';}
function dataBR(d){if(!d)return'—';const p=String(d).split('T')[0].split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
async function sair(){await sb.auth.signOut();location.href='login.html';}

function setMes(d){
  const a=new Date(d.getFullYear(),d.getMonth(),1);
  const b=new Date(d.getFullYear(),d.getMonth()+1,0);
  INI=iso(a); FIM=iso(b);
}
function mesLabel(){
  const p=INI.split('-'); const d=new Date(Number(p[0]),Number(p[1])-1,1);
  const s=d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function navMes(delta){
  const p=INI.split('-');
  setMes(new Date(Number(p[0]),Number(p[1])-1+delta,1));
  carregar();
}

async function boot(){
  const t1=document.getElementById('tabObras'); if(t1) t1.href='painel.html?v='+Date.now();
  const t2=document.getElementById('tabPV'); if(t2) t2.href='posvenda.html?v='+Date.now();
  const s=await sb.auth.getSession();
  if(!s.data.session){location.href='login.html';return;}
  document.getElementById('who').textContent=s.data.session.user.email;
  setMes(new Date());
  const c=await sb.from('dre_plano_contas').select('*').eq('ativo',true).order('ordem');
  if(c.error||!c.data){
    document.getElementById('app').innerHTML='<div class="center"><span style="font-size:32px">🔒</span>'+
      '<br><br><b>Sem acesso ao financeiro.</b><br>Peça ao administrador para liberar o nível financeiro.</div>';
    return;
  }
  CONTAS=c.data;
  const pr=await sb.from('parametros_financeiros').select('*').order('vigencia_inicio',{ascending:false});
  PARAMS=pr.data||[];
  const og=await sb.from('origens_lead').select('*').eq('ativo',true).order('ordem');
  ORIGENS=og.data||[];
  const cfg=await sb.from('config').select('valor').eq('chave','provisao_posvenda_desde').maybeSingle();
  PROV_DESDE=(cfg.data&&cfg.data.valor)||null;
  const te=await sb.from('tabela_estrutura').select('*').order('ordem');
  ESTRUTURAS=te.data||[];
  const tk=await sb.from('tabela_kits').select('*').order('qtd_modulos');
  KITS=tk.data||[];
  const eq=await sb.from('equipe').select('id,nome,papel,vende,ativo');
  EQUIPE=(eq.data||[]).filter(function(p){return (p.papel==='Vendedor'||p.vende) && p.ativo!==false;});
  if(PARAMS.length&&PARAMS[0].rateio_base) RATEIO=PARAMS[0].rateio_base;
  await carregar();
}

async function carregar(){
  const r=await Promise.all([
    sb.rpc('get_dre_mensal',{p_ini:INI,p_fim:FIM}),
    sb.rpc('get_dre_obras',{p_ini:INI,p_fim:FIM}),
    sb.rpc('get_fluxo_caixa',{p_ini:INI,p_fim:FIM}),
    sb.rpc('get_financeiro_desempenho',{p_ini:INI,p_fim:FIM}),
    sb.rpc('get_fila_financeiro'),
    sb.rpc('get_resumo_financeiro',{p_ini:INI,p_fim:FIM}),
    sb.rpc('get_desvios',{p_ini:INI,p_fim:FIM})
  ]);
  if(r[0].error||!r[0].data){
    document.getElementById('app').innerHTML='<div class="center"><span style="font-size:32px">🔒</span>'+
      '<br><br><b>Sem permissão financeira.</b><br>Seu usuário precisa ser admin ou nível financeiro.</div>';
    return;
  }
  DRE=r[0].data; OBRAS=r[1].data; FLUXO=r[2].data; DESEMP=r[3].data; FILA=r[4].data; RESUMO=r[5].data; DESV=r[6].data;
  render();
}

function render(){
  let h='<div class="subtabs">';
  const abas=[['dre','📊 Resumo do mês'],['obras','🏗️ Obra a obra'],['fluxo','💵 Fluxo de caixa'],
              ['desemp','📈 Desempenho'],['calc','🧮 Calculadora'],['lancar','✏️ Lançar'],
              ['param','⚙️ Parâmetros']];
  for(let i=0;i<abas.length;i++){
    h+='<button class="stb'+(ABA===abas[i][0]?' on':'')+'" onclick="irAba(\''+abas[i][0]+'\')">'+abas[i][1]+'</button>';
  }
  h+='</div>';
  if(ABA!=='param'&&ABA!=='lancar'&&ABA!=='calc') h+=blocoPeriodo();
  h+='<div class="pane on">';
  if(ABA==='dre') h+=viewDRE();
  else if(ABA==='obras') h+=viewObras();
  else if(ABA==='fluxo') h+=viewFluxo();
  else if(ABA==='desemp') h+=viewDesemp();
  else if(ABA==='calc') h+=viewCalc();
  else if(ABA==='lancar') h+=viewLancar();
  else h+=viewParam();
  h+='</div>';
  document.getElementById('app').innerHTML=h;
}
function irAba(a){ABA=a;render();window.scrollTo(0,0);}

function blocoPeriodo(){
  return '<div class="periodo">'+
    '<button class="nav" onclick="navMes(-1)">‹</button>'+
    '<div class="lbl">'+esc(mesLabel())+'<small>'+dataBR(INI)+' a '+dataBR(FIM)+'</small></div>'+
    '<button class="nav" onclick="navMes(1)">›</button></div>';
}

/* ---------- RESUMO DO MÊS ---------- */
function viewDRE(){
  const C=(RESUMO&&RESUMO.cascata)||{};
  const rec=n(C.receita);
  if(rec===0 && n(C.estrutura)===0 && n(C.obra)===0){
    return '<div class="vazio"><span class="i">📊</span><b>Nada lançado em '+esc(mesLabel())+'.</b><br>'+
      'Use a aba <b>Lançar</b> para registrar as despesas, ou lance uma obra em <b>Obra a obra</b>.</div>';
  }

  let h='<div class="big"><div class="l">Faturamento do mês</div>'+
    '<div class="n">'+moeda(C.receita)+'</div>'+
    '<div class="s">'+esc(mesLabel())+'</div></div>';

  if(rec>0){
    const p=[[n(C.pct_obra),'#3d6b8f'],[n(C.pct_impostos),'#7a5aa0'],
             [n(C.pct_comissao),'#c98a3a'],[n(C.pct_estrutura),'#b05555']];
    let bar='<div class="barra100">';
    let usado=0;
    for(let i=0;i<p.length;i++){const w=Math.max(0,p[i][0]*100);usado+=w;
      bar+='<i style="width:'+w+'%;background:'+p[i][1]+'"></i>';}
    const sobra=Math.max(0,100-usado);
    bar+='<i style="width:'+sobra+'%;background:var(--green-l)"></i></div>';
    h+=bar;
  }

  h+='<div class="casc">';
  h+=passo('obra','#3d6b8f','Equipamento e obra','kit, estrutura, cabo, instalação',C.obra,C.pct_obra);
  h+=passo('imp','#7a5aa0','Impostos','Simples, ISS, COFINS',C.impostos,C.pct_impostos);
  h+=passo('com','#c98a3a','Comissões','dos vendedores',C.comissao,C.pct_comissao);
  h+=passo('est','#b05555','Estrutura da empresa','aluguel, salários, marketing, contador',C.estrutura,C.pct_estrutura);
  if(n(C.financeiro)!==0)
    h+=passo('fin','#8fa6b8','Juros e tarifas','',C.financeiro,rec>0?n(C.financeiro)/rec:0);
  h+='</div>';

  const sob=n(C.sobrou);
  const cor = sob>=0?'var(--green-l)':'var(--red)';
  h+='<div class="step final" style="border-color:'+cor+'" onclick="return false">'+
    '<div class="dot" style="background:'+cor+'"></div>'+
    '<div class="cn"><b>'+(sob>=0?'Sobrou':'Faltou')+'</b>'+
    '<span>'+(sob>=0?'é o lucro da operação':'a operação deu prejuízo no mês')+'</span></div>'+
    '<div class="vl"><div class="v" style="color:'+cor+'">'+moeda(C.sobrou)+'</div>'+
    '<div class="p">'+(rec>0?pct(C.pct_sobrou):'—')+'</div></div></div>';

  if(n(C.fora_do_dre)>0){
    h+='<div class="aviso" style="margin-top:12px">💡 <b>'+moeda(C.fora_do_dre)+'</b> saíram do caixa este mês '+
       'em retirada de sócio e amortização de empréstimo. Não entram na conta acima porque não são custo da '+
       'operação — são destino do lucro. Aparecem no <b>Fluxo de caixa</b>.</div>';
  }

  h+=blocoDesvio();
  h+='<button class="linkmais" onclick="VERCONTAS=!VERCONTAS;render()">'+
     (VERCONTAS?'Esconder o detalhe contábil':'Ver o detalhe contábil (para o contador)')+'</button>';
  if(VERCONTAS) h+=arvoreContabil();
  return h;
}

function blocoDesvio(){
  if(!DESV || !n(DESV.obras)) return '';
  const d=n(DESV.desvio_pct), ant=DESV.desvio_pct_anterior;
  const acima = d>0;
  const cor = Math.abs(d)<0.02 ? 'var(--muted)' : (acima?'var(--red)':'var(--green-l)');
  let tend='';
  if(ant!=null && n(DESV.obras_anterior)>0){
    const dif=d-n(ant);
    tend = Math.abs(dif)<0.01 ? 'igual ao período anterior'
         : (dif>0 ? '↑ piorou '+pct(Math.abs(dif))+' vs. anterior'
                  : '↓ melhorou '+pct(Math.abs(dif))+' vs. anterior');
  }
  let titulo;
  if(Math.abs(d)<0.02) titulo='As obras do mês fecharam dentro do orçado';
  else if(acima) titulo='As obras do mês custaram '+pct(d)+' acima do orçado';
  else titulo='As obras do mês custaram '+pct(Math.abs(d))+' abaixo do orçado';

  let h='<div class="step" style="border-color:'+cor+';cursor:pointer;margin-bottom:9px" '+
    'onclick="VERDESV=!VERDESV;render()">'+
    '<div class="dot" style="background:'+cor+'"></div>'+
    '<div class="cn"><b>'+esc(titulo)+'</b><span>'+n(DESV.obras)+' obra(s) comparadas'+
    (tend?' · '+esc(tend):'')+' · toque para ver</span></div>'+
    '<div class="vl"><div class="v" style="color:'+cor+'">'+(acima?'+':'')+moeda(DESV.desvio_total)+'</div>'+
    '<div class="p">'+(VERDESV?'▲':'▼')+'</div></div></div>';
  if(!VERDESV) return h;

  const L=DESV.linhas||[];
  h+='<div class="det" style="margin-bottom:12px"><table class="gtab" style="border:none">'+
     '<thead><tr><th>Item</th><th class="num">Orçado</th><th class="num">Real</th>'+
     '<th class="num">Desvio</th></tr></thead><tbody>';
  for(let i=0;i<L.length;i++){
    const x=L[i], dv=n(x.desvio);
    const c2 = Math.abs(n(x.desvio_pct))<0.02?'var(--muted)':(dv>0?'var(--red)':'var(--green-l)');
    h+='<tr><td>'+esc(x.item)+'</td><td class="num">'+moeda(x.previsto)+'</td>'+
      '<td class="num">'+moeda(x.realizado)+'</td>'+
      '<td class="num" style="color:'+c2+';font-weight:800">'+(dv>0?'+':'')+pct(x.desvio_pct)+'</td></tr>';
  }
  h+='</tbody></table>';
  const P=DESV.piores||[];
  if(P.length){
    h+='<div style="margin-top:10px;font-size:11px;font-weight:800;color:var(--muted);'+
       'text-transform:uppercase;letter-spacing:.6px">Obras que mais fugiram</div>';
    for(let i=0;i<P.length;i++){
      h+='<div class="chk" style="border-color:var(--border)"><div class="st no">'+n(P[i].modulos)+'</div>'+
        '<div class="cn"><b>'+esc(P[i].cliente)+'</b><span>orçado '+moeda(P[i].prev)+
        ' · real '+moeda(P[i].rea)+'</span></div>'+
        '<div style="text-align:right"><b style="color:var(--red)">+'+moeda(P[i].desvio)+'</b><br>'+
        '<span style="font-size:11px;color:var(--muted);font-weight:800">'+pct(P[i].pct)+'</span></div>'+
        '<button class="bmini" onclick="event.stopPropagation();abrirFin(\''+P[i].id+'\')">›</button></div>';
    }
  }
  if(n(DESV.sem_telhado)>0)
    h+='<div class="dica">⚠️ '+n(DESV.sem_telhado)+' obra(s) sem tipo de telhado — '+
       'o orçado dessas usou fibrocimento como padrão.</div>';
  return h+'</div>';
}
function passo(k,cor,titulo,sub,valor,pc){
  const aberto = ABRIR===k;
  let h='<button class="step" onclick="ABRIR=(ABRIR===\''+k+'\'?null:\''+k+'\');render()">'+
    '<div class="dot" style="background:'+cor+'"></div>'+
    '<div class="cn"><b>'+esc(titulo)+'</b>'+(sub?'<span>'+esc(sub)+'</span>':'')+'</div>'+
    '<div class="vl"><div class="v">−'+moeda(valor)+'</div>'+
    '<div class="p">'+pct(pc)+'</div></div></button>';
  if(aberto) h+=detalhe(k);
  return h;
}
function detalhe(k){
  let lista=[];
  if(k==='est') lista=(RESUMO&&RESUMO.detalhe_estrutura)||[];
  else if(k==='obra') lista=(RESUMO&&RESUMO.detalhe_obra)||[];
  if(!lista.length) return '<div class="det"><div class="r"><span>Sem detalhamento</span></div></div>';
  let h='<div class="det">';
  for(let i=0;i<lista.length;i++){
    h+='<div class="r"><span>'+(lista[i].icone?lista[i].icone+' ':'')+esc(lista[i].nome)+'</span>'+
       '<span>'+moeda2(lista[i].total)+'</span></div>';
  }
  return h+'</div>';
}
function arvoreContabil(){
  const R=(DRE&&DRE.resumo)||{}, L=(DRE&&DRE.linhas)||[];
  const rl=n(R.receita_liquida);
  function pc(v){return rl>0?'<span class="pct">'+pct(n(v)/rl)+'</span>':'<span class="pct">—</span>';}
  let h='<div class="dre" style="margin-top:8px"><table><thead><tr><th>Conta</th>'+
    '<th class="num">Valor</th><th class="num">% Rec. líq.</th></tr></thead><tbody>';
  const ordem=['01','02','__RL','03','__MB','04','__EB','05','__EBIT','06','07','__RES'];
  for(let i=0;i<ordem.length;i++){
    const cd=ordem[i];
    if(cd.indexOf('__')===0){
      const mapa={'__RL':['= RECEITA LÍQUIDA',R.receita_liquida],'__MB':['= MARGEM BRUTA',R.margem_bruta],
        '__EB':['= EBITDA',R.ebitda],'__EBIT':['= EBIT',R.ebit],'__RES':['= RESULTADO',R.resultado]};
      const m=mapa[cd];
      h+='<tr class="calc"><td>'+m[0]+'</td><td class="num">'+moeda2(m[1])+'</td><td>'+pc(m[1])+'</td></tr>';
      continue;
    }
    const g=L.find(function(x){return x.codigo===cd;});
    if(!g) continue;
    h+=linhaDRE(g,'g1',pc);
    const subs=L.filter(function(x){return x.pai===cd && n(x.valor)!==0;});
    for(let j=0;j<subs.length;j++){
      h+=linhaDRE(subs[j],'g2',pc);
      const cts=L.filter(function(x){return x.pai===subs[j].codigo && n(x.valor)!==0;});
      for(let k2=0;k2<cts.length;k2++) h+=linhaDRE(cts[k2],'g3',pc);
    }
  }
  return h+'</tbody></table></div>';
}
function linhaDRE(g,cls,pc){
  const z=(n(g.valor)===0&&cls==='g1')?' zero':'';
  return '<tr class="'+cls+z+'"><td>'+esc(g.codigo)+' · '+esc(g.nome)+'</td>'+
    '<td class="num">'+moeda2(g.valor)+'</td><td>'+pc(g.valor)+'</td></tr>';
}
function kc(l,valor,p,cls){
  return '<div class="kc '+(cls||'')+'"><div class="l">'+esc(l)+'</div><div class="n">'+valor+'</div>'+
    (p?'<div class="p">'+esc(p)+'</div>':'')+'</div>';
}

/* ---------- OBRA A OBRA ---------- */
function blocoFila(){
  if(!FILA) return '';
  const R=FILA.resumo||{}, it=FILA.itens||[];
  if(!it.length) return '';
  const rot={atrasado:'⚠️ Já ativada, ainda não lançada',parcial:'Falta o custo do kit',
             aberto:'Em obra — ainda não tem custo fechado'};
  // filtros: por situação e por texto
  const nAnd=it.filter(x=>x.situacao==='aberto').length;
  const nCon=it.filter(x=>x.situacao!=='aberto').length;
  let arr=it.slice();
  if(FILA_F==='andamento') arr=arr.filter(x=>x.situacao==='aberto');
  else if(FILA_F==='concluida') arr=arr.filter(x=>x.situacao!=='aberto');
  if(FILA_Q){
    const q=FILA_Q.toLowerCase();
    arr=arr.filter(x=>(x.cliente||'').toLowerCase().includes(q)
                    || String(x.contrato||'').includes(q));
  }

  let h='<div class="fila"><h3>📋 Ainda não lançadas — '+it.length+'</h3>';

  h+='<input class="fbusca" id="filaQ" value="'+esc(FILA_Q)+'" placeholder="🔍 Buscar por nome do cliente ou contrato..." '+
     'oninput="FILA_Q=this.value;redesenhaFila()">';

  h+='<div class="ffiltros">'+
     '<button class="'+(FILA_F==='todas'?'on':'')+'" onclick="FILA_F=\'todas\';render()">Todas <b>'+it.length+'</b></button>'+
     '<button class="'+(FILA_F==='andamento'?'on':'')+'" onclick="FILA_F=\'andamento\';render()">🏗️ Em obra <b>'+nAnd+'</b></button>'+
     '<button class="'+(FILA_F==='concluida'?'on':'')+'" onclick="FILA_F=\'concluida\';render()">✅ Concluídas <b>'+nCon+'</b></button>'+
     '</div>';

  h+='<div class="dica" style="margin:0 0 10px">Dá para lançar mesmo com a obra em andamento — '+
     'os valores podem ser ajustados depois.</div>';

  if(!arr.length){
    return h+'<div class="vazio" style="padding:20px"><b>Nada encontrado com esse filtro.</b></div></div>';
  }

  const mostra=FILA_TODAS?arr:arr.slice(0,8);
  for(let i=0;i<mostra.length;i++){
    const o=mostra[i];
    const tri = (o.trilha && o.trilha!=='padrao')
      ? '<span class="ftrilha">'+esc(o.trilha_icone||'')+' '+esc(o.trilha_nome||o.trilha)+'</span>' : '';
    h+='<div class="fitem '+esc(o.situacao)+'"><div class="cn"><b>'+esc(o.cliente)+'</b>'+tri+
      '<span>'+(o.contrato?'#'+esc(o.contrato)+' · ':'')+
      (o.kwp?n(o.kwp).toFixed(2)+' kWp · ':'')+esc(rot[o.situacao]||o.situacao)+
      (o.valor_projeto?' · proposta '+moeda(o.valor_projeto):'')+'</span></div>'+
      '<div class="acts">'+
      '<button class="bmini go" onclick="abrirFin(\''+o.id+'\')">Lançar</button>'+
      '<button class="bmini" onclick="dispensarFin(\''+o.id+'\')" title="Tirar da fila">✕</button>'+
      '</div></div>';
  }
  if(arr.length>8) h+='<button class="bmini" style="width:100%;margin-top:6px" onclick="FILA_TODAS=!FILA_TODAS;render()">'+
    (FILA_TODAS?'Mostrar menos':'Ver todas as '+arr.length)+'</button>';
  return h+'</div>';
}

function viewObras(){
  const T=(OBRAS&&OBRAS.totais)||{}, lista=(OBRAS&&OBRAS.obras)||[];
  const fila=blocoFila();
  if(!lista.length){
    return fila+'<div class="vazio"><span class="i">🏗️</span><b>Nenhuma obra lançada em '+esc(mesLabel())+'.</b><br>'+
      'Use a fila acima para lançar, ou navegue para outro mês.</div>';
  }
  let h=fila+'<div class="cards">'+
    kc('Obras',n(T.qtd),'','')+
    kc('Faturado',moeda(T.faturado),'','gold')+
    kc('Ticket médio',moeda(T.ticket_medio),'','')+
    kc('Preço por kWp',moeda(T.preco_kwp),n(T.kwp).toFixed(2)+' kWp','')+
  '</div>';
  h+='<div class="reg" style="padding:11px"><button class="bmini" style="width:100%" '+
     'onclick="calcPrevistoLote()">🧮 Calcular orçado de todas as obras do mês</button>'+
     '<div class="dica" style="margin-top:7px">Usa a tabela de kits, o telhado e a distância de cada obra. '+
     'Habilita a comparação orçado × real no Resumo.</div></div>';
  h+='<div class="periodo"><span style="font-size:11px;font-weight:800;color:var(--muted);'+
     'text-transform:uppercase;letter-spacing:.6px">Base do rateio</span>'+
     '<select onchange="RATEIO=this.value;render()">'+
     opt('obra','Por obra (oficial)')+opt('kwp','Por kWp')+opt('faturamento','Por % faturamento')+
     '</select></div>';
  h+='<div class="olist">';
  for(let i=0;i<lista.length;i++) h+=cardObra(lista[i]);
  h+='</div>';
  return h;
}
function opt(v,l){return '<option value="'+v+'"'+(RATEIO===v?' selected':'')+'>'+esc(l)+'</option>';}
function cardObra(o){
  let ml, rat;
  if(RATEIO==='kwp'){ ml=n(o.ml_kwp_pct); rat=n(o.rateio_kwp); }
  else if(RATEIO==='faturamento'){ ml=n(o.ml_fat_pct); rat=n(o.rateio_faturamento); }
  else { ml=n(o.ml_obra_pct); rat=n(o.rateio_obra); }
  const cls = ml>=0.12?'bom':(ml>=0?'medio':'ruim');
  const cor = ml>=0.12?'var(--green-l)':(ml>=0?'var(--gold)':'var(--red)');
  const preco=n(o.preco)||1;
  const wD=Math.max(0,Math.min(100,n(o.diretos)/preco*100));
  const wI=Math.max(0,Math.min(100,(n(o.imposto)+n(o.comissao)+n(o.operacional))/preco*100));
  const wR=Math.max(0,Math.min(100,rat/preco*100));
  const wM=Math.max(0,100-wD-wI-wR);
  let h='<button class="ob '+cls+'" onclick="verObra(\''+o.id+'\')"><div class="top">'+
    '<div class="nm">'+esc(o.cliente)+'</div>'+
    '<div class="mg"><div class="v" style="color:'+cor+'">'+pct(ml)+'</div><div class="k">margem líq.</div></div>'+
    '</div><div class="meta">'+
    '<span>'+moeda(o.preco)+'</span><span>'+n(o.kwp).toFixed(2)+' kWp</span>'+
    '<span>CMV '+pct(o.cmv_pct)+'</span><span>MC '+pct(o.mc_pct)+'</span>'+
    (o.vendedor?'<span>'+esc(o.vendedor)+'</span>':'')+
    (o.origem?'<span class="tag">'+esc(o.origem)+'</span>':'<span class="tag red">sem origem</span>')+
    (o.status_pgto==='quitado'?'<span class="tag green">quitado</span>'
      :o.status_pgto==='parcelado'?'<span class="tag gold">'+n(o.qtd_parcelas)+'x · '+n(o.parcelas_recebidas)+' recebida(s)</span>'
      :'<span class="tag">em aberto</span>')+
    '</div><div class="barra">'+
    '<i style="width:'+wD+'%;background:#3d6b8f"></i>'+
    '<i style="width:'+wI+'%;background:#7a5aa0"></i>'+
    '<i style="width:'+wR+'%;background:var(--gold)"></i>'+
    '<i style="width:'+wM+'%;background:'+cor+'"></i>'+
    '</div></button>';
  return h;
}

async function abrirFin(id){
  const ov=document.getElementById('ov'), d=document.getElementById('dw');
  d.innerHTML='<div class="center"><div class="spin"></div>Abrindo...</div>';
  ov.classList.add('on');
  const r=await sb.from('obra_financeiro').select('*').eq('obra_id',id).maybeSingle();
  const o=await sb.from('obras').select('id,cliente,contrato,potencia_kwp,qtd_modulos,data_fechamento,data_instalacao,data_conclusao,origem_lead,vendedor_id,tipo_telhado,distancia_km').eq('id',id).maybeSingle();
  const pp=await sb.from('obra_parcelas').select('*').eq('obra_id',id).order('numero');
  if(r.error||o.error||!o.data){d.innerHTML='<div class="center">Não foi possível abrir.</div>';return;}
  EDIT={fin:r.data||{obra_id:id}, obra:o.data};
  PARC=(pp.data||[]).map(function(x){return {numero:x.numero,valor:x.valor,
    vencimento:x.vencimento,recebida:x.recebida};});

  if((F0.custo_operacional==null||F0.custo_operacional===0) && o.data.qtd_modulos>0 && PARAMS.length){
    EDIT.sugereOper = n(o.data.qtd_modulos)*n(PARAMS[0].custo_operacional_placa);
  }
  renderFin();
}

function renderPrevisto(){
  const box=document.getElementById('prevBox'); if(!box) return;
  const F=EDIT.fin;
  if(F.previsto_total==null){
    box.innerHTML='<div class="dica" style="margin:0">Previsto ainda não calculado para esta obra. '+
      'Confira o telhado e a distância e toque em <b>Calcular previsto</b>.</div>';
    return;
  }
  const linhas=[
    ['Kit', F.previsto_kit, n(gv('e_valor_kit'))],
    ['Estrutura e cabo', F.previsto_estrutura, n(gv('e_cabo'))],
    ['Material CA', F.previsto_material_ca, n(gv('e_material_ca'))],
    ['Instalação', F.previsto_instalacao, n(gv('e_instalacao'))],
    ['Deslocamento', F.previsto_deslocamento, n(gv('e_deslocamento'))]
  ];
  let h='<table class="gtab" style="margin-top:4px"><thead><tr><th>Item</th>'+
    '<th class="num">Previsto</th><th class="num">Realizado</th><th class="num">Desvio</th></tr></thead><tbody>';
  let tp=0, tr=0;
  for(let i=0;i<linhas.length;i++){
    const p=n(linhas[i][1]), r=n(linhas[i][2]); tp+=p; tr+=r;
    const d=r-p;
    const cor = Math.abs(d)<1 ? 'var(--muted)' : (d>0?'var(--red)':'var(--green-l)');
    const sinal = Math.abs(d)<1 ? '—' : (d>0?'+':'')+moeda(d);
    h+='<tr><td>'+esc(linhas[i][0])+'</td><td class="num">'+moeda(p)+'</td>'+
      '<td class="num">'+(r>0?moeda(r):'—')+'</td>'+
      '<td class="num" style="color:'+cor+';font-weight:800">'+sinal+'</td></tr>';
  }
  const dt=tr-tp;
  h+='<tr style="border-top:2px solid var(--gold)"><td><b>Total</b></td>'+
    '<td class="num"><b>'+moeda(tp)+'</b></td><td class="num"><b>'+moeda(tr)+'</b></td>'+
    '<td class="num" style="color:'+(Math.abs(dt)<1?'var(--muted)':(dt>0?'var(--red)':'var(--green-l)'))+
    ';font-weight:800">'+(Math.abs(dt)<1?'—':(dt>0?'+':'')+moeda(dt))+'</b></td></tr>';
  h+='</tbody></table><div class="dica">Vermelho é custo acima do orçado. '+
     'Verde é economia. Só compara o que já foi lançado.</div>';
  box.innerHTML=h;

async function calcularPrevistoObra(){

function renderParcResumo(){ /* recalcula só o cabeçalho sem perder foco */
  const box=document.getElementById('parcBox'); if(!box) return;
  const el=box.querySelector('.resumoCalc .r.tot span:last-child'); if(!el) return;
  el.textContent=moeda2(PARC.reduce(function(a,p){return a+n(p.valor);},0));
}
function renumerar(){ for(let i=0;i<PARC.length;i++) PARC[i].numero=i+1; }
function addParcela(){
  PARC.push({numero:PARC.length+1, valor:null, vencimento:null, recebida:false});
  renderParc();
}
function gerarParcelas(){
  const q=parseInt(prompt('Dividir em quantas parcelas?','2'),10);
  if(!(q>0&&q<=36)){ if(q) toast('Informe um número entre 1 e 36'); return; }
  const total=n(gv('e_preco_negociado'));
  if(!(total>0)){ toast('Informe o preço negociado primeiro'); return; }
  const base=Math.floor(total/q*100)/100;
  const hoje=new Date();
  PARC=[];
  for(let i=0;i<q;i++){
    const d=new Date(hoje.getFullYear(),hoje.getMonth()+i,hoje.getDate());
    const v = (i===q-1) ? Math.round((total-base*(q-1))*100)/100 : base;
    PARC.push({numero:i+1, valor:v, vencimento:iso(d), recebida:false});
  }
  renderParc();
}
function gv(id){const e=document.getElementById(id);if(!e)return null;
  const v=e.value;return v===''?null:parseFloat(v);}
function recalcFin(){
  const box=document.getElementById('calcBox'); if(!box) return;
  const p=n(gv('e_preco_negociado'));
  let dir=0;
  const diretos=['valor_kit','material_ca','material_eletrico','cabo','instalacao','deslocamento','art','seguro','frete'];
  for(let i=0;i<diretos.length;i++) dir+=n(gv('e_'+diretos[i]));
  const imp=n(gv('e_imposto_valor')), com=n(gv('e_comissao_valor')), op=n(gv('e_custo_operacional'));
  const prv=n(gv('e_provisao_posvenda'));
  const mc=p-dir-imp-com-op-prv;
  const rat=n(DRE&&DRE.rateio&&DRE.rateio.por_obra);
  const ml=mc-rat;
  if(document.getElementById('prevBox')&&EDIT&&EDIT.fin&&EDIT.fin.previsto_total!=null) setTimeout(renderPrevisto,0);
  box.innerHTML='<div class="resumoCalc">'+
    lr('Preço',p)+lr('Custos diretos',-dir)+lr('Imposto + comissão + operacional',-(imp+com+op))+
    (prv>0?lr('Provisão de pós-venda',-prv):'')+
    '<div class="r tot"><span>Margem de contribuição</span><span style="color:'+
      (mc>=0?'var(--green-l)':'var(--red)')+'">'+moeda2(mc)+(p>0?' · '+pct(mc/p):'')+'</span></div>'+
    (rat>0?('<div class="r"><span>Rateio do mês (por obra)</span><span>'+moeda2(-rat)+'</span></div>'+
    '<div class="r tot"><span>Margem líquida real</span><span style="color:'+
      (ml>=0?'var(--green-l)':'var(--red)')+'">'+moeda2(ml)+(p>0?' · '+pct(ml/p):'')+'</span></div>'):'')+
    '</div>';
}
function lr(l,v){return '<div class="r"><span>'+esc(l)+'</span><span>'+moeda2(v)+'</span></div>';}
function sugerirFin(){
  const p=n(gv('e_preco_negociado'));
  if(!(p>0)){toast('Informe o preço primeiro');return;}
  const par=PARAMS.length?PARAMS[0]:null;
  if(!par){toast('Sem parâmetros cadastrados');return;}
  if(gv('e_imposto_valor')==null) document.getElementById('e_imposto_valor').value=(p*n(par.aliquota_imposto)).toFixed(2);
  if(gv('e_comissao_valor')==null) document.getElementById('e_comissao_valor').value=(p*n(par.comissao_pct_padrao)).toFixed(2);
  const mods=n(EDIT.obra.qtd_modulos);
  if(mods>0&&gv('e_custo_operacional')==null)
    document.getElementById('e_custo_operacional').value=(mods*n(par.custo_operacional_placa)).toFixed(2);
  const fech=EDIT.obra.data_fechamento;
  const provOk = PROV_DESDE && fech && fech >= PROV_DESDE;
  if(provOk && gv('e_provisao_posvenda')==null && n(par.provisao_posvenda_pct)>0){
    document.getElementById('e_provisao_posvenda').value=(p*n(par.provisao_posvenda_pct)).toFixed(2);
  }
  recalcFin();
  toast('Valores sugeridos pela vigência de '+dataBR(par.vigencia_inicio));
}
async function salvarFin(){
  const b=document.getElementById('bFin'); b.disabled=true; b.textContent='Salvando...';
  const payload={obra_id:EDIT.obra.id, atualizado_em:new Date().toISOString()};
  for(let i=0;i<CAMPOS.length;i++) payload[CAMPOS[i][0]]=gv('e_'+CAMPOS[i][0]);
  const recT=PARC.filter(function(p){return p.recebida;}).length;
  payload.status_pagamento = PARC.length===0 ? 'aberto'
                           : (recT===PARC.length ? 'quitado' : 'parcelado');
  const r=await sb.from('obra_financeiro').upsert(payload,{onConflict:'obra_id'});
  // parcelas: apaga e regrava
  await sb.from('obra_parcelas').delete().eq('obra_id',EDIT.obra.id);
  if(PARC.length){
    await sb.from('obra_parcelas').insert(PARC.map(function(p){
      return {obra_id:EDIT.obra.id, numero:p.numero, valor:p.valor,
              vencimento:p.vencimento||null, recebida:!!p.recebida};}));
  }
  const og=document.getElementById('eOrigem').value||null;
  const vd=document.getElementById('eVend').value||null;
  const upd={};
  if(og!==EDIT.obra.origem_lead) upd.origem_lead=og;
  if(vd!==EDIT.obra.vendedor_id) upd.vendedor_id=vd;
  if(Object.keys(upd).length) await sb.from('obras').update(upd).eq('id',EDIT.obra.id);
  b.disabled=false; b.textContent='Salvar';
  if(r.error){toast('Erro: '+r.error.message);return;}
  toast('Financeiro da obra salvo');
  fecharFin();
  await carregar();
}
async function dispensarFin(id){
  if(!confirm('Tirar esta obra da fila? Ela some do "aguardando lançamento", mas o registro continua.')) return;
  const r=await sb.from('obra_financeiro').update({dispensado:true}).eq('obra_id',id);
  if(r.error){toast('Erro ao dispensar');return;}
  toast('Obra removida da fila');
  await carregar();
}

async function rodarCalc(){
  const box=document.getElementById('calcRes'); if(!box) return;
  if(!(CALC.mod>=4)){ box.innerHTML='<div class="dica">Mínimo de 4 módulos.</div>'; return; }
  const r=await sb.rpc('calcular_previsto',{p_modulos:CALC.mod,p_telhado:CALC.estr,p_km:CALC.km});
  if(r.error||!r.data){ box.innerHTML='<div class="dica">Não foi possível calcular.</div>'; return; }
  const c=r.data; CALC.res=c;
  let h='';
  if(!c.kit_cadastrado)
    h+='<div class="aviso">⚠️ <b>Kit de '+CALC.mod+' módulos não cadastrado.</b> '+
       'O custo abaixo sai sem o equipamento.</div>';
  h+='<div class="resumoCalc">'+
    lr('Kit ('+esc(c.inversor||'—')+(c.marca?' '+esc(c.marca):'')+')',c.kit)+
    lr('Estrutura ('+esc(c.telhado||'')+')',c.estrutura)+
    lr('Cabo',c.cabo)+
    lr('Material CA',c.material_ca)+
    lr('Instalação',c.instalacao)+
    lr('Deslocamento ('+CALC.km+' km)',c.deslocamento)+
    lr('Homologação e pós-venda',c.homologacao)+
    '<div class="r tot"><span>Custo total</span><span>'+moeda2(c.total)+'</span></div>'+
    '</div>';
  h+='<div class="cards" style="margin-top:10px">'+
    kc('Potência',c.potencia_kwp?n(c.potencia_kwp).toFixed(2)+' kWp':'—','','')+
    kc('Custo por kWp',c.custo_por_kwp?moeda(c.custo_por_kwp):'—','','')+
    kc('Preço sugerido',moeda(c.preco_sugerido),'com imposto, comissão, 20% estrutura e 5% lucro','gold')+
    kc('Preço por kWp',c.potencia_kwp?moeda(n(c.preco_sugerido)/n(c.potencia_kwp)):'—',
       'Greener: R$ 2.310 a 3.620','')+
    '</div>';
  box.innerHTML=h;
}

async function salvarAtalho(){
  const conta=document.getElementById('aConta').value;
  const valor=parseFloat(document.getElementById('aValor').value);
  const data=document.getElementById('aData').value;
  const desc=document.getElementById('aDesc').value;
  if(!conta){toast('Escolha a categoria');return;}
  if(!(valor>0)){toast('Informe um valor maior que zero');return;}
  if(!data){toast('Informe a competência');return;}
  const b=document.getElementById('bAt'); b.disabled=true; b.textContent='Salvando...';
  const ss=await sb.auth.getSession();
  const r=await sb.from('dre_lancamentos').insert({
    data_competencia:data, conta_codigo:conta, valor:valor,
    descricao:desc||null, origem:'manual',
    criado_por:(ss.data.session&&ss.data.session.user.email)||null});
  b.disabled=false; b.textContent='Salvar';
  if(r.error){toast('Erro: '+r.error.message);return;}
  toast('Lançado');
  ATALHO=null;
  await carregar(); ABA='lancar'; render();
}

      '<td>'+(c.no_dre===false?'<span class="tag red">não</span>':'<span class="tag green">sim</span>')+'</td></tr>';
  }
  h+='</tbody></table>'+
     '<div class="dica">As contas marcadas como <b>fora do DRE</b> são retirada de sócio e amortização de '+
     'empréstimo. Elas continuam sendo lançadas normalmente, mas não afetam o resultado da operação.</div></div>';

  h+='<div class="reg"><h3>Origens de lead</h3><table class="gtab"><thead><tr>'+
     '<th>Código</th><th>Nome</th></tr></thead><tbody>';
  for(let i=0;i<ORIGENS.length;i++){
    h+='<tr><td>'+esc(ORIGENS[i].codigo)+'</td><td>'+esc(ORIGENS[i].nome)+'</td></tr>';
  }
  h+='</tbody></table><div class="dica">Cadastradas no banco. O campo aparece no cadastro da obra e '+
     'alimenta o cálculo de CAC na aba Desempenho.</div></div>';
  return h;
}

boot();
</script>
</body>
</html>
