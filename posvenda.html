<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="theme-color" content="#011D2E">
<title>Polaris — Pós-venda</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html{overflow-x:hidden;width:100%}
body{overflow-x:hidden;width:100%;max-width:100vw;position:relative}
img,video,table{max-width:100%}
.wrap,.toolbar,.stats,.dchips,.cchips,.tools{max-width:100%}
:root{--navy:#011D2E;--green:#3B8B3B;--green-l:#58B868;--gold:#F5A623;
--bg:#0a1622;--card:#0f2233;--card2:#13293c;--border:#1d3850;--txt:#eaf2f8;--muted:#8fa6b8}
html[data-theme="light"]{--gold:#B8790A;--green-l:#3B8B3B;--bg:#F0F2ED;--card:#FFF;--card2:#F4F6F3;
--border:#DCE4EA;--txt:#022C44;--muted:#5F7787}
body{font-family:'Manrope',system-ui,sans-serif;background:
radial-gradient(1100px 560px at 82% -12%, rgba(12,60,90,.32) 0%, transparent 62%),var(--bg);
color:var(--txt);min-height:100vh;transition:background .3s;-webkit-font-smoothing:antialiased}

/* ---- Topbar com abas ---- */
.topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;
background:rgba(1,29,46,.88);backdrop-filter:blur(10px);
position:sticky;top:0;z-index:40;border-bottom:1px solid var(--border)}
html[data-theme="light"] .topbar{background:rgba(255,255,255,.9)}
.topbar img{height:26px}
.tabs{display:flex;gap:4px;background:var(--card2);border-radius:12px;padding:3px}
.tab{background:none;border:none;color:var(--muted);border-radius:9px;padding:8px 14px;
font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;
display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:.18s}
.tab:hover{color:var(--txt)}
.tab.on{background:var(--card);color:var(--gold);box-shadow:0 1px 6px rgba(0,0,0,.18)}
.tbrow{display:flex;align-items:center;gap:10px;width:100%;flex-wrap:wrap}
.tbacts{margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:0}
.ver{font-size:9.5px;color:var(--muted);opacity:.55;font-weight:700;white-space:nowrap}
@media(max-width:640px){.ver{display:none}}
.who{font-size:11px;color:var(--muted);font-weight:600;max-width:150px;
overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-out{background:none;border:1px solid var(--border);color:var(--muted);border-radius:9px;
padding:6px 10px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-out:hover{border-color:var(--gold);color:var(--gold)}

.wrap{max-width:1240px;margin:0 auto;padding:18px 16px 60px}

/* ---- Hero: o que precisa de você ---- */
.hero{background:var(--card);border:1px solid var(--border);border-radius:18px;
padding:20px;margin-bottom:16px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
background:linear-gradient(180deg,var(--gold),var(--green))}
.hero .eyebrow{font-size:10.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;
color:var(--muted)}
.hero h1{font-size:20px;font-weight:800;margin-top:6px;line-height:1.25}
.hero .sub{font-size:13px;color:var(--muted);margin-top:6px;font-weight:600}
.pend{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}
.pcard{flex:1 1 160px;background:var(--card2);border:1px solid var(--border);border-radius:13px;
padding:13px;cursor:pointer;transition:.18s;text-align:left;font-family:inherit;color:var(--txt)}
.pcard:hover{border-color:var(--gold);transform:translateY(-2px)}
.pcard .n{font-size:26px;font-weight:800;line-height:1}
.pcard .l{font-size:11px;color:var(--muted);font-weight:700;margin-top:5px;line-height:1.35}
.pcard.alerta .n{color:var(--gold)}
.pcard.ok .n{color:var(--green-l)}

/* ---- Busca e lista ---- */
.tools{display:flex;gap:8px;margin:16px 0 12px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:var(--card);
border:1px solid var(--border);border-radius:11px;padding:0 12px}
.search input{flex:1;background:none;border:none;outline:none;color:var(--txt);
font-family:inherit;font-size:14px;padding:11px 0}
.chip{background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:20px;
padding:8px 13px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.chip:hover{border-color:var(--gold)}
.chip.on{border-color:var(--gold);color:var(--gold);background:var(--card2)}

.lista{display:grid;gap:9px}
@media(min-width:900px){.lista{grid-template-columns:1fr 1fr}}
.cli{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;
cursor:pointer;transition:.18s;text-align:left;font-family:inherit;color:var(--txt);width:100%;
display:block;position:relative}
.cli:hover{border-color:var(--gold);transform:translateY(-2px)}
.cli.pend{border-left:3px solid var(--gold)}
.cli .top{display:flex;align-items:flex-start;gap:9px}
.cli .nome{font-size:15px;font-weight:800;line-height:1.25;flex:1}
.cli .meta{font-size:11.5px;color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 10px;font-weight:600}
.nota{flex-shrink:0;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;
justify-content:center;font-size:14px;font-weight:800;background:var(--card2);border:1px solid var(--border)}
.nota.p{color:var(--green-l);border-color:var(--green-l)}
.nota.d{color:#e07070;border-color:#e07070}
.nota.vazio{color:var(--muted);font-size:16px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;
letter-spacing:.5px;text-transform:uppercase;border-radius:20px;padding:3px 8px;
background:var(--card2);border:1px solid var(--border);color:var(--muted)}
.tag.gold{border-color:var(--gold);color:var(--gold)}
.tag.green{border-color:var(--green-l);color:var(--green-l)}
.tag.red{border-color:#e07070;color:#e07070}

/* ---- Ficha (drawer) ---- */
.ov{position:fixed;inset:0;background:rgba(0,10,20,.72);backdrop-filter:blur(4px);
z-index:60;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.ficha{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:760px;
max-height:94vh;overflow-y:auto;border:1px solid var(--border);border-bottom:none}
@media(min-width:700px){.ov{align-items:center}.ficha{border-radius:20px;border-bottom:1px solid var(--border)}}
.fhead{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--border);
padding:18px 20px;z-index:2}
.fhead .nome{font-size:19px;font-weight:800;line-height:1.2;padding-right:36px}
.fhead .meta{font-size:12px;color:var(--muted);margin-top:6px;font-weight:600;
display:flex;flex-wrap:wrap;gap:4px 12px}
.fechar{position:absolute;top:16px;right:16px;background:var(--card2);border:1px solid var(--border);
color:var(--muted);width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:15px;font-family:inherit}
.fbody{padding:18px 20px 30px}
.sec{margin-bottom:22px}
.sec h3{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;
color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec h3::after{content:'';flex:1;height:1px;background:var(--border)}

.dados{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.dado{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px}
.dado .k{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.dado .v{font-size:15px;font-weight:800;margin-top:3px}
.dado .v small{font-size:11px;color:var(--muted);font-weight:700}

/* trilha — o elemento assinatura */
.trilha{position:relative;padding-left:26px}
.trilha::before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:2px;
background:linear-gradient(180deg,var(--gold),var(--green),var(--border))}
.ev{position:relative;padding-bottom:16px}
.ev::before{content:'';position:absolute;left:-22px;top:4px;width:10px;height:10px;
border-radius:50%;background:var(--card);border:2px solid var(--border)}
.ev.on::before{border-color:var(--gold);background:var(--gold)}
.ev.cli::before{border-color:var(--green-l);background:var(--green-l)}
.ev .quando{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.4px}
.ev .oque{font-size:13.5px;font-weight:700;margin-top:2px;line-height:1.4}
.ev .txt{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.5;
background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 11px;font-weight:600}
.ev .txt b{color:var(--txt)}

.vazio{color:var(--muted);text-align:center;padding:26px 14px;font-size:13px;
background:var(--card);border:1px dashed var(--border);border-radius:13px;line-height:1.6}
.reg{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:14px;margin-top:8px}
.reg .lin{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:9px}
.reg .cp{flex:1;min-width:96px}
.reg label{display:block;font-size:10px;color:var(--muted);font-weight:700;
text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.reg input,.reg select,.reg textarea{width:100%;background:var(--card2);border:1px solid var(--border);
color:var(--txt);border-radius:9px;padding:10px;font-family:inherit;font-size:14px;outline:none}
.reg input:focus,.reg select:focus,.reg textarea:focus{border-color:var(--gold)}
.reg .chk{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;cursor:pointer;
padding:8px 0}
.reg .chk input{width:19px;height:19px;accent-color:var(--green)}
.reg .salvar{width:100%;background:var(--green);border:none;color:#fff;border-radius:10px;
padding:12px;font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer;margin-top:4px}
.reg .salvar:active{transform:scale(.99)}
.reg .dica{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.45;font-weight:600;
  background:none;border:0;padding:0}
.mini{background:none;border:1px dashed var(--border);color:var(--muted);border-radius:9px;
padding:8px 12px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;width:100%}
.mini:hover{border-color:var(--gold);color:var(--gold)}
.gtab{width:100%;font-size:12px;border-collapse:collapse;margin-top:8px}
.gtab th{text-align:left;font-size:9.5px;color:var(--muted);text-transform:uppercase;
letter-spacing:.5px;padding:6px 5px;border-bottom:1px solid var(--border);font-weight:800}
.gtab td{padding:7px 5px;border-bottom:1px solid var(--border);font-weight:600}
.gtab tr:last-child td{border-bottom:none}
.gtab .num{text-align:right}
.rgstat{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.rgstat .b{flex:1;min-width:110px;background:var(--card);border:1px solid var(--border);
border-radius:12px;padding:12px}
.rgstat .b .n{font-size:22px;font-weight:800;line-height:1}
.rgstat .b .l{font-size:10.5px;color:var(--muted);font-weight:700;margin-top:4px}
.switch{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--border);
border-radius:13px;padding:14px;margin-bottom:14px}
.switch .info{flex:1}
.switch .tt{font-size:14px;font-weight:800}
.switch .ds{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.sw{width:52px;height:29px;border-radius:20px;background:var(--border);border:none;cursor:pointer;
position:relative;flex-shrink:0;transition:.22s}
.sw.on{background:var(--green)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;
background:#fff;transition:.22s}
.sw.on::after{transform:translateX(23px)}
.rgrow{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--border);
border-radius:12px;padding:12px;margin-bottom:7px}
.rgrow.hoje{border-left:3px solid var(--gold)}
.rgrow.bloq{opacity:.6;border-left:3px solid #e07070}
.rgrow .ic{font-size:19px;flex-shrink:0}
.rgrow .cn{flex:1;min-width:0}
.rgrow .cn b{display:block;font-size:13.5px;line-height:1.3}
.rgrow .cn span{font-size:11px;color:var(--muted);font-weight:600}
.rgrow .qd{font-size:11px;font-weight:800;color:var(--muted);text-align:right;flex-shrink:0}
.mod{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:7px}
.mod .top{display:flex;align-items:center;gap:9px}
.mod .top b{flex:1;font-size:13.5px}
.mod .dia{background:var(--card2);border:1px solid var(--border);border-radius:20px;padding:3px 9px;
font-size:11px;font-weight:800;color:var(--gold)}
.mod .tx{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5;
white-space:pre-wrap;max-height:64px;overflow:hidden;position:relative}
.mod.aberto .tx{max-height:none}
/* ---- Calculadora ---- */
.fab{position:fixed;right:18px;bottom:18px;width:56px;height:56px;border-radius:50%;
background:var(--green);border:none;color:#fff;font-size:23px;cursor:pointer;z-index:50;
box-shadow:0 6px 22px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
.fab:active{transform:scale(.94)}
.calc .res{background:var(--card2);border:1px solid var(--border);border-radius:13px;
padding:15px;margin-top:13px}
.calc .big{font-size:30px;font-weight:800;color:var(--green-l);line-height:1}
.calc .big small{font-size:13px;color:var(--muted);font-weight:700;display:block;margin-top:3px}
.calc .brk{display:flex;justify-content:space-between;font-size:12.5px;padding:7px 0;
border-bottom:1px solid var(--border);font-weight:600}
.calc .brk:last-child{border-bottom:none}
.calc .brk span:last-child{font-weight:800}
.calc .brk.tot span{color:var(--gold)}
.calc .al{background:rgba(224,112,112,.12);border:1px solid #e07070;color:#e07070;
border-radius:9px;padding:10px;font-size:12px;font-weight:700;margin-top:11px;line-height:1.45}
.plano{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:14px;
margin-bottom:9px;cursor:pointer;transition:.16s}
.plano:hover{border-color:var(--gold)}
.plano.sel{border-color:var(--green-l);background:var(--card2)}
.plano .ph{display:flex;align-items:center;gap:9px}
.plano .pn{font-size:14.5px;font-weight:800;flex:1}
.plano .pp{font-size:19px;font-weight:800;color:var(--green-l)}
.plano .pp small{font-size:11px;color:var(--muted);font-weight:700}
.plano .pd{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.5;font-weight:600}

/* ---- Indicações ---- */
.funil{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none}
.funil::-webkit-scrollbar{display:none}
.fcol{flex:0 0 auto;background:var(--card);border:1px solid var(--border);border-radius:12px;
padding:11px 14px;min-width:96px;cursor:pointer;transition:.16s}
.fcol:hover{border-color:var(--gold)}
.fcol.on{border-color:var(--gold);background:var(--card2)}
.fcol .n{font-size:21px;font-weight:800;line-height:1}
.fcol .l{font-size:10px;color:var(--muted);font-weight:700;margin-top:4px;white-space:nowrap}
.icard{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:13px;
margin-bottom:9px;border-left:3px solid var(--gold)}
.icard.fech{border-left-color:var(--green-l)}
.icard.perd{border-left-color:#e07070;opacity:.72}
.icard .t1{display:flex;align-items:flex-start;gap:9px}
.icard .nm{font-size:15px;font-weight:800;flex:1;line-height:1.25}
.icard .cod{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.5px;
background:var(--card2);border:1px solid var(--border);border-radius:6px;padding:3px 7px;white-space:nowrap}
.icard .via{font-size:12px;color:var(--muted);margin-top:5px;font-weight:600}
.icard .via b{color:var(--txt)}
.icard .vl{font-size:17px;font-weight:800;color:var(--green-l);margin-top:7px}
.icard .vl small{font-size:11px;color:var(--muted);font-weight:700}
.icard .st{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.icard select{background:var(--card2);border:1px solid var(--border);color:var(--txt);
border-radius:8px;padding:7px 9px;font-family:inherit;font-size:12px;font-weight:700}
.icard .bt{background:var(--card2);border:1px solid var(--border);color:var(--muted);
border-radius:8px;padding:7px 11px;font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer}
.icard .bt:hover{border-color:var(--gold);color:var(--gold)}
.icard .bt.pg{border-color:var(--green);color:var(--green-l)}
.icard .bt.pago{background:rgba(88,184,104,.12);border-color:var(--green-l);color:var(--green-l);cursor:default}
.rank{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px;
margin-bottom:7px;display:flex;align-items:center;gap:11px}
.rank .pos{font-size:15px;font-weight:800;color:var(--muted);min-width:22px}
.rank .inf{flex:1}
.rank .nm{font-size:13.5px;font-weight:800;line-height:1.25}
.rank .sb{font-size:11px;color:var(--muted);margin-top:3px;font-weight:600}
.rank .vl{font-size:14px;font-weight:800;color:var(--green-l)}

/* ---- Régua ---- */
.fbar{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--gold);
border-radius:11px;padding:10px 13px;margin-bottom:12px;font-size:13px;flex-wrap:wrap}
.fbar .ic{font-size:15px}
.fbar b{font-weight:800;color:var(--txt)}
.fbar .qt{color:var(--muted);font-weight:700;font-size:12px}
.fbar button{margin-left:auto;background:var(--card2);border:1px solid var(--border);
color:var(--muted);border-radius:8px;padding:6px 11px;font-family:inherit;font-size:11.5px;
font-weight:800;cursor:pointer;white-space:nowrap}
.fbar button:hover{border-color:var(--gold);color:var(--gold)}
.plnav{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.plnav button{background:var(--card);border:1px solid var(--border);color:var(--muted);
border-radius:10px;padding:9px 14px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.plnav button.on{background:var(--card2);border-color:var(--gold);color:var(--txt)}
.plpot{background:linear-gradient(135deg,var(--card2),var(--card));border:1px solid var(--gold);
border-radius:14px;padding:18px;margin:12px 0}
.plpot .lb{font-size:10.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.plpot .big{font-size:30px;font-weight:800;color:var(--gold);margin-top:7px;line-height:1;letter-spacing:-1px}
.plpot .big small{font-size:14px;color:var(--muted);font-weight:700}
.plpot .sb{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.45}
.plpot .cen{display:flex;gap:9px;margin-top:14px}
.plpot .cen div{flex:1;background:rgba(0,0,0,.18);border-radius:10px;padding:10px;text-align:center}
.plpot .cen div.mid{border:1px solid var(--gold)}
.plpot .cen b{display:block;font-size:15px;font-weight:800}
.plpot .cen span{display:block;font-size:10.5px;color:var(--muted);margin-top:3px}
.ondag{display:flex;gap:7px;align-items:flex-end;margin-top:11px;min-height:130px}
.ob{flex:1;text-align:center;display:flex;flex-direction:column;justify-content:flex-end}
.ob .bar{background:linear-gradient(180deg,var(--gold),rgba(245,166,35,.35));border-radius:6px 6px 0 0;min-height:8px}
.ob .q{font-size:15px;font-weight:800;margin-top:6px}
.ob .m{font-size:10.5px;color:var(--muted);font-weight:700}
.ob .v{font-size:9.5px;color:var(--green-l);font-weight:700;margin-top:2px}
.pltbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:9px}
.pltbl th{text-align:left;color:var(--muted);font-size:10.5px;text-transform:uppercase;
letter-spacing:.8px;padding-bottom:6px;font-weight:800}

<body>
<div class="topbar">
  <div class="tbrow">
    <img id="logo" src="https://obras.polarisenergiasolar.com/logo.png" onerror="this.style.display='none'">
    <div class="tabs">
      <a class="tab" href="inicio.html">Início</a>
      <a class="tab" id="tabObras" href="painel.html">Obras</a>
      <button class="tab on">Pós-venda</button>
      <a class="tab" id="tabFin" href="financeiro.html">Financeiro</a>
    </div>
    <div class="tbacts">
      <span class="who" id="who"></span>
      <button class="btn-out" id="bTema">🌙</button>
      <button class="btn-out" onclick="sair()" title="Sair">↪</button>
      <span class="ver">v06/08 21:22</span>
    </div>
  </div>
</div>

<div class="wrap" id="app">
  <div class="center"><div class="spin"></div>Carregando...</div>
</div>

<div class="ov" id="ov"><div class="ficha" id="ficha"></div></div>
<button class="fab" id="fab" title="Calculadora de serviços" onclick="abrirCalc()">🧮</button>
<div class="toast" id="toast"></div>

<script>
const SB_URL='https://dakubhcgohiwzyqiegqf.supabase.co';
const SB_KEY='sb_publishable_hue0wC6DINtAaxTPlSIOIg_X1Tr0vJx';
const sb=supabase.createClient(SB_URL,SB_KEY);
const LOGO_D='https://obras.polarisenergiasolar.com/logo.png', LOGO_L='https://obras.polarisenergiasolar.com/logo-claro.png';
let DADOS=null, FILTRO='', BUSCA='';
let VISAO='jornada', KB=null, BRINDES=[];
try{VISAO=localStorage.getItem('polaris-pv-visao')||'jornada'}catch(e){}

function tema(t){document.documentElement.setAttribute('data-theme',t);
  document.getElementById('bTema').textContent=t==='dark'?'🌙':'☀️';
  const l=document.getElementById('logo'); if(l) l.src=(t==='light')?LOGO_L:LOGO_D;
  try{localStorage.setItem('polaris-tema',t)}catch(e){}}
document.getElementById('bTema').onclick=()=>tema(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
try{tema(localStorage.getItem('polaris-tema')||'dark')}catch(e){tema('dark')}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(window._t);window._t=setTimeout(()=>t.classList.remove('on'),3200);}
function dataBR(d){if(!d)return'—';const p=String(d).split('T')[0].split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function quando(iso){
  if(!iso) return '—';
  const d=new Date(iso), h=Math.floor((Date.now()-d)/3600000);
  if(h<1) return 'agora há pouco';
  if(h<24) return `há ${h}h`;
  const dias=Math.floor(h/24);
  if(dias<7) return `há ${dias} dia${dias>1?'s':''}`;
  return d.toLocaleDateString('pt-BR');
}
async function sair(){await sb.auth.signOut();location.href='login.html';}

const CTX={
  indicacao:{i:'🎁',n:'Indicação',c:'gold'},
  iptu:{i:'🏛️',n:'IPTU',c:''},
  tecnico:{i:'🔧',n:'Técnico',c:'red'},
  conta:{i:'📄',n:'Conta de luz',c:''},
  reclamacao:{i:'😠',n:'Reclamação',c:'red'},
  elogio:{i:'💚',n:'Elogio',c:'green'},
  sair:{i:'🚪',n:'Pediu para sair',c:'red'},
  agendamento:{i:'📅',n:'Agendamento',c:''},
  geral:{i:'💬',n:'Mensagem',c:''}
};

async function boot(){
  const t=document.getElementById('tabObras'); if(t) t.href='painel.html?v='+Date.now();
  const tf=document.getElementById('tabFin'); if(tf) tf.href='financeiro.html?v='+Date.now();
  const s=await sb.auth.getSession();
  if(!s.data.session){location.href='login.html';return;}
  document.getElementById('who').textContent=s.data.session.user.email;
  const r=await sb.rpc('get_posvenda_lista');
  if(r.error||!r.data){
    document.getElementById('app').innerHTML='<div class="center"><span class="i">🔒</span><b>Sem acesso ao pós-venda.</b><br>Peça ao administrador para liberar.</div>';
    return;
  }
  DADOS=r.data;
  const k=await sb.rpc('get_kanban_posvenda');
  KB=k.data||null;
  render();
}

function render(){
  const R=DADOS.resumo||{}, cl=DADOS.clientes||[];
  const hora=new Date().getHours();
  const saud=hora<12?'Bom dia':(hora<18?'Boa tarde':'Boa noite');
  const pend=(R.respostas_pendentes||0);

  let h=`<div class="hero">
    <div class="eyebrow">Pós-venda</div>
    <h1>${saud}. ${pend? `Você tem ${pend} ${pend>1?'mensagens':'mensagem'} para tratar.` : 'Nada pendente por aqui.'}</h1>
    <div class="sub">${pend? 'Clientes escreveram nos grupos e ainda não tiveram retorno.' : 'Todas as mensagens dos clientes foram tratadas. 👏'}</div>
    <div class="pend">
      <button class="pcard ${R.indicacoes_pendentes?'alerta':''}" onclick="setFiltro('indicacao')">
        <div class="n">${R.indicacoes_pendentes||0}</div><div class="l">Indicações aguardando</div></button>
      <button class="pcard ${pend?'alerta':''}" onclick="setFiltro('pendentes')">
        <div class="n">${pend}</div><div class="l">Respostas para tratar</div></button>
      <button class="pcard ok" onclick="setFiltro('')">
        <div class="n">${R.clientes_ativos||0}</div><div class="l">Clientes ativos</div></button>
      <button class="pcard" onclick="setFiltro('sem_nps')">
        <div class="n">${R.sem_nps||0}</div><div class="l">Sem pesquisa respondida</div></button>
      <button class="pcard ${R.sem_aniversario?'alerta':''}" onclick="setFiltro('sem_aniv')">
        <div class="n">${R.sem_aniversario||0}</div><div class="l">Sem data de aniversário</div></button>
    </div>
  </div>`;

  h+=`<div class="tools">
    <div class="vtabs">
      <button class="vtab ${VISAO==='jornada'?'on':''}" onclick="setVisao('jornada')">Jornada</button>
      <button class="vtab ${VISAO==='lista'?'on':''}" onclick="setVisao('lista')">Lista</button>
      <button class="vtab ${VISAO==='regua'?'on':''}" onclick="setVisao('regua')">Régua</button>
      <button class="vtab ${VISAO==='indic'?'on':''}" onclick="setVisao('indic')">Indicações</button>
      <button class="vtab ${VISAO==='planos'?'on':''}" onclick="setVisao('planos')">Planos</button>
      <button class="vtab ${VISAO==='usinas'?'on':''}" onclick="setVisao('usinas')">Usinas</button>
      <button class="vtab ${VISAO==='auto'?'on':''}" onclick="setVisao('auto')">Automações</button>
    </div>
    <div class="search">🔍<input id="q" placeholder="Buscar cliente ou contrato..." value="${esc(BUSCA)}" oninput="setBusca(this.value)"></div>
    ${VISAO==='lista'?`
    <button class="chip ${FILTRO===''?'on':''}" onclick="setFiltro('')">Todos</button>
    <button class="chip ${FILTRO==='pendentes'?'on':''}" onclick="setFiltro('pendentes')">Com pendência</button>
    <button class="chip ${FILTRO==='sem_nps'?'on':''}" onclick="setFiltro('sem_nps')">Sem NPS</button>
    <button class="chip ${FILTRO==='sem_aniv'?'on':''}" onclick="setFiltro('sem_aniv')">🎂 Sem aniversário</button>
    <button class="chip ${FILTRO==='brinde'?'on':''}" onclick="setFiltro('brinde')">🎁 Brinde a retirar${R.brinde_a_retirar?' <b>'+R.brinde_a_retirar+'</b>':''}</button>
    <button class="chip ${FILTRO==='usina'?'on':''}" onclick="setFiltro('usina')">⚡ Usina com problema${R.usinas_com_problema?' <b>'+R.usinas_com_problema+'</b>':''}</button>`:''}
  </div>`;

  if(VISAO==='indic'){
    document.getElementById('app').innerHTML=h+'<div id="inbox"><div class="center"><div class="spin"></div>Carregando indicações...</div></div>';
    carregarIndic();
    return;
  }
  if(VISAO==='regua'){
    document.getElementById('app').innerHTML=h+'<div id="rgbox"><div class="center"><div class="spin"></div>Carregando a régua...</div></div>';
    carregarRegua();
    return;
  }
  if(VISAO==='planos'){
    document.getElementById('app').innerHTML=h+'<div id="plbox"><div class="center"><div class="spin"></div>Carregando planos...</div></div>';
    carregarPlanos();
    return;
  }
  if(VISAO==='brindes'){
    document.getElementById('app').innerHTML=h+'<div id="brbox"><div class="center"><div class="spin"></div>Carregando brindes...</div></div>';
    carregarBrindes();
    return;
  }
  if(VISAO==='usinas'){
    document.getElementById('app').innerHTML=h+'<div id="usbox"><div class="center"><div class="spin"></div>Lendo as usinas...</div></div>';
    carregarUsinas();
    return;
  }
  if(VISAO==='auto'){
    document.getElementById('app').innerHTML=h+'<div id="mgbox"><div class="center"><div class="spin"></div>Carregando automações...</div></div>';
    carregarAutomacoes();
    return;
  }
  if(VISAO==='jornada'){
    h+=renderJornada();
    document.getElementById('app').innerHTML=h;
    setTimeout(ligaKb, 30);
    return;
  }
  let arr=cl.slice();
  if(FILTRO==='pendentes') arr=arr.filter(c=>c.pendentes>0);
  // NPS e aniversário só fazem sentido depois da ativação
  if(FILTRO==='sem_nps') arr=arr.filter(c=>c.ativo && c.nps==null);
  if(FILTRO==='sem_aniv') arr=arr.filter(c=>c.ativo && !c.nascimento_dia);
  if(FILTRO==='indicacao') arr=arr.filter(c=>c.pendentes>0);
  if(FILTRO==='brinde') arr=arr.filter(c=>c.brinde && !c.brinde_retirado);
  if(FILTRO==='usina') arr=arr.filter(c=>c.usina_estado && c.usina_estado!=='normal');
  if(BUSCA){const b=BUSCA.toLowerCase();
    arr=arr.filter(c=>(c.cliente||'').toLowerCase().includes(b)||(c.contrato||'').includes(b));}

  h+=faixaFiltro(arr.length);

  if(!arr.length){
    h+=`<div class="vazio">Nenhum cliente com esse filtro.<br>Ajuste a busca ou escolha "Todos".</div>`;
  } else {
    h+='<div class="lista">'+arr.map(c=>{
      const n=c.nps;
      const cls=n==null?'vazio':(n>=9?'p':(n<=6?'d':''));
      const bits=[];
      if(c.cidade) bits.push('📍 '+esc(c.cidade));
      if(c.potencia_kwp) bits.push('⚡ '+String(c.potencia_kwp).replace('.',',')+' kWp');
      if(c.dias_ativo!=null) bits.push('☀️ '+c.dias_ativo+' dias ativo');
      if(c.vendedor) bits.push('👔 '+esc(c.vendedor));
      if(c.usinas>1) bits.push(c.usinas+' usinas');
      if(c.kwh_30d) bits.push(Number(c.kwh_30d).toLocaleString('pt-BR')+' kWh/30d');
      return `<button class="cli ${c.pendentes?'pend':''}" onclick="abrirFicha('${c.id}')">
        <div class="top">
          <div class="nome">${esc(c.cliente)}${c.contrato?` <span style="color:var(--muted);font-weight:600;font-size:12px">#${esc(c.contrato)}</span>`:''}</div>
          <div class="nota ${cls}">${n==null?'—':n}</div>
        </div>
        <div class="meta">${bits.join('<span style="opacity:.4">·</span>')}</div>
        <div style="margin-top:8px;display:flex;gap:5px;flex-wrap:wrap">
        ${c.pendentes?`<span class="tag gold">💬 ${c.pendentes} para tratar</span>`:''}
        ${(c.brinde && !c.brinde_retirado)?`<span class="tag gold">🎁 ${c.brinde==='fone'?'fone':'copo'} a retirar</span>`:''}
        ${(c.usina_estado && c.usina_estado!=='normal')?`<span class="tag" style="border-color:rgba(224,163,62,.5);color:#e0a33e">⚡ ${esc(c.usina_rotulo||c.usina_estado)}${c.cliente_avisado?' · avisado':''}</span>`:''}
        ${(c.usina_pct!=null && c.usina_pct<85)?`<span class="tag" style="border-color:rgba(229,115,115,.5);color:#e57373">${c.usina_pct}% do previsto</span>`:''}
        ${(c.ativo && !c.nascimento_dia)?`<span class="tag">🎂 sem aniversário</span>`:''}
        ${!c.ativo?`<span class="tag" style="border-color:rgba(143,166,184,.4);color:var(--muted)">🏗️ em obra</span>`:''}
        </div>
      </button>`;
    }).join('')+'</div>';
  }

}

function planoCompletoPara(mods){
  const lista=(PLN.planos||[]).filter(p=>p.nivel===3);
  const m=Number(mods)||0;
  // sem saber o tamanho do sistema nao da para dizer a faixa. Devolver o
  // ultimo da lista, como era antes, fazia a tela anunciar um preco que nao
  // vale para aquele cliente.
  if(!m) return null;
  return lista.find(p=>m>=Number(p.mod_min||0) && m<=Number(p.mod_max||9999)) || null;
}
// Faixa acima de 45 modulos existe sem preco de tabela de proposito: o valor
// e negociado por sistema. Nunca imprimir moedaBR(null), que vira "R$ 0,00".
function temPrecoTabela(p){ return !!(p && p.mensal!=null && p.anual!=null); }
// O Completo vende uma visita anual em CADA endereco, entao quem tem duas
// propriedades paga o extra. O valor vem da config, nunca chumbado aqui.
function adicionalEndereco(qtdEnderecos){
  const nEnd = Math.max(1, Number(qtdEnderecos)||1);
  const porAno = Number(PLN.endereco_adicional!=null?PLN.endereco_adicional:0);
  const extras = nEnd - 1;
  return { extras: extras,
           anual: porAno*extras,
           mensal: Math.round(porAno/12*extras*100)/100,
           porAno: porAno };
}
function moedaBR(v){ return 'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2}); }

function textoPlano(cliente, mods, enderecos){
  const P=PLN.planos||[];
  const ess=P.find(p=>p.codigo==='essencial');
  const atv=P.find(p=>p.codigo==='ativo');
  const cmp=planoCompletoPara(mods);
  const nome=(cliente||'').trim().split(' ')[0];
  const pn=nome?nome.charAt(0).toUpperCase()+nome.slice(1).toLowerCase():'';

  let t='☀️ *'+pn+', seu sistema merece continuar rendendo o máximo*\n\n';
  t+='O manual do seu inversor traz uma informação que pouca gente lê: a garantia '
   +'*não cobre falhas causadas por falta de manutenção*. É por isso que criamos '
   +'nossos planos de acompanhamento.\n\n';
  t+='━━━━━━━━━━━━━━━\n\n';

  t+='🥉 *ESSENCIAL* — '+moedaBR(ess.mensal)+'/mês\n'
   +'_ou '+moedaBR(ess.anual)+' no ano_\n'
   +'• Monitoramento da geração\n'
   +'• Alerta se o sistema parar\n'
   +'• Suporte por WhatsApp\n'
   +'• Relatório de desempenho\n\n';

  t+='🥈 *ATIVO* — '+moedaBR(atv.mensal)+'/mês\n'
   +'_ou '+moedaBR(atv.anual)+' no ano_\n'
   +'• Tudo do Essencial\n'
   +'• Análise mensal da conta de luz\n'
   +'• Atendimento prioritário\n'
   +'• '+Number(atv.desconto)+'% de desconto em serviços\n'
   +'• Apoio na relação com a distribuidora\n\n';

  const ad = adicionalEndereco(enderecos);
  if(temPrecoTabela(cmp)){
    t+='🥇 *COMPLETO* — '+moedaBR(Number(cmp.mensal)+ad.mensal)+'/mês\n'
      +'_ou '+moedaBR(Number(cmp.anual)+ad.anual)+' no ano_\n';
    if(ad.extras>0){
      t+='_já inclui '+moedaBR(ad.anual)+'/ano de '+(ad.extras===1?'1 endereço':ad.extras+' endereços')
        +' além do primeiro — a visita técnica é em cada um_\n';
    }
  } else {
    t+='🥇 *COMPLETO* — valor sob consulta\n'
      +'_seu sistema é maior que as faixas de tabela; preparamos uma proposta '
      +'para ele_\n';
  }
  t+='• Tudo do Ativo\n'
   +(ad.extras>0
      ? '• *Uma visita técnica anual em cada endereço*\n'
      : '• *Visita técnica anual inclusa*\n')
   +'• Limpeza dos módulos\n'
   +'• Inspeção elétrica e de fixação\n'
   +'• *Laudo técnico assinado*\n';
  // o desconto sai da tabela, nunca de um numero fixo aqui
  var _desc = (cmp && cmp.desconto!=null) ? cmp.desconto
            : (P.filter(function(p){return p.nivel===3 && p.desconto!=null;})[0]||{}).desconto;
  if(_desc!=null) t+='• '+Number(_desc)+'% de desconto em serviços\n';
  t+='\n';

  t+='━━━━━━━━━━━━━━━\n\n';
  t+='O *Laudo técnico* é o documento que o fabricante pede quando há acionamento '
   +'de garantia. Sem ele, a cobertura pode ser recusada.\n\n';
  t+='Qualquer dúvida, é só chamar aqui. 💚\n\n*Equipe Polaris Energia Solar* ☀️';
  return t;
}

function rolaKb(dir){
  const el=document.getElementById('kbBox'); if(!el) return;
  el.scrollBy({left: dir*Math.round(el.clientWidth*0.8), behavior:'smooth'});
}
function ajustaSetasKb(){
  const el=document.getElementById('kbBox');
  const e=document.getElementById('kbEsq'), d=document.getElementById('kbDir');
  if(!el||!e||!d) return;
  const sobra = el.scrollWidth - el.clientWidth;
  if(sobra < 12){ e.classList.remove('on'); d.classList.remove('on'); return; }
  e.classList.toggle('on', el.scrollLeft > 8);
  d.classList.toggle('on', el.scrollLeft < sobra - 8);
}
function ligaKb(){
  const el=document.getElementById('kbBox'); if(!el) return;
  if(el.dataset.on) return;
  el.dataset.on='1';
  el.addEventListener('scroll', ajustaSetasKb, {passive:true});
  window.addEventListener('resize', ajustaSetasKb);
  ajustaSetasKb();
}

function renderPainelPlanos(){
  if(!PAI) return '<div class="vazio">Não foi possível carregar o painel.</div>';
  const R=PAI.resumo||{}, PT=PAI.potencial||{}, onda=PAI.onda||[], portes=PAI.portes||[];
  const L=PAI.lista||[];

  let h='<div class="rgstat">'
   +'<div class="rgs"><div class="n">'+n(R.contratos)+'</div><div class="l">Contratos ativos</div></div>'
   +'<div class="rgs"><div class="n" style="color:var(--gold)">'+n(R.cortesias)+'</div><div class="l">Em cortesia</div></div>'
   +'<div class="rgs"><div class="n" style="color:var(--green-l)">'+n(R.pagos)+'</div><div class="l">Pagantes</div></div>'
   +'<div class="rgs"><div class="n">'+moedaBR(R.mrr)+'</div><div class="l">Receita mensal</div></div>'
   +'</div>';

  // de quantas cortesias viraram cliente. Enquanto ninguem venceu fica oculto,
  // porque "0 de 0" nao informa nada.
  const CV = PAI.conversao||{};
  if(n(CV.decididos)>0){
    const taxa = Math.round(n(CV.renovaram)/n(CV.decididos)*100);
    h+='<div class="plpot" style="border-color:rgba(88,184,104,.4)">'
     +'<div class="lb">Fidelização</div>'
     +'<div class="big" style="color:var(--green-l)">'+taxa+'<small>%</small></div>'
     +'<div class="sb">'+n(CV.renovaram)+' de '+n(CV.decididos)
     +' que chegaram ao fim viraram plano pago</div></div>';
  }

  // contrato fechado que ainda nao teve o primeiro pagamento: nao e receita,
  // mas e a unica coisa da tela que pede acao hoje
  if(n(R.aguardando)>0){
    h+='<div class="plpot" style="border-color:rgba(214,175,88,.45)">'
     +'<div class="lb">Aguardando o 1º pagamento</div>'
     +'<div class="big" style="color:var(--gold)">'+n(R.aguardando)
     +'<small>'+(n(R.aguardando)===1?' contrato':' contratos')+'</small></div>'
     +'<div class="sb">os 12 meses só começam a contar quando o pagamento entrar</div>'
     +'</div>';
  }

  // o potencial, que é o número que interessa
  h+='<div class="plpot">'
   +'<div class="lb">Potencial da carteira</div>'
   +'<div class="big">'+moedaBR(PT.total_anual)+'<small>/ano</small></div>'
   +'<div class="sb">se os '+n(R.cortesias)+' clientes em cortesia assinarem o Completo do porte deles</div>'
   +'<div class="cen">'
   +'<div><b>'+moedaBR(PT.c20)+'</b><span>convertendo 20%</span></div>'
   +'<div class="mid"><b>'+moedaBR(PT.c30)+'</b><span>convertendo 30%</span></div>'
   +'<div><b>'+moedaBR(PT.c50)+'</b><span>convertendo 50%</span></div>'
   +'</div></div>';

  // a onda de vencimentos
  if(onda.length){
    const maxC=Math.max.apply(null,onda.map(function(x){return n(x.contratos);}));
    h+='<div class="sec"><h3>🌊 Onda de vencimentos</h3>'
     +'<div class="dica">Quando a cortesia de 1 ano termina. É a janela para converter.</div>'
     +'<div class="ondag">';
    onda.forEach(function(o){
      const alt=Math.round(n(o.contratos)/maxC*100);
      h+='<div class="ob"><div class="bar" style="height:'+Math.max(alt,8)+'%"></div>'
        +'<div class="q">'+n(o.contratos)+'</div>'
        +'<div class="m">'+esc(o.mes)+'</div>'
        +'<div class="v">'+moedaBR(o.potencial)+'</div></div>';
    });
    h+='</div></div>';
  }

  // por porte
  if(portes.length){
    h+='<div class="sec"><h3>📐 Por porte do sistema</h3><table class="pltbl">'
     +'<tr><th>Porte</th><th class="num">Clientes</th><th class="num">Anual</th><th class="num">Potencial</th></tr>';
    portes.forEach(function(p){
      const semTab = n(p.anual)===0;
      h+='<tr><td>'+esc(p.porte)+'</td><td class="num">'+n(p.clientes)+'</td>'
        +'<td class="num">'+(semTab?'<span style="color:var(--muted)">sob consulta</span>':moedaBR(p.anual))+'</td>'
        +'<td class="num">'+(semTab?'<span style="color:var(--muted)">—</span>':'<b>'+moedaBR(p.potencial)+'</b>')+'</td></tr>';
    });
    h+='</table></div>';
  }

  // quem vence primeiro
  const prox=L.slice(0,12);
  h+='<div class="sec"><h3>⏳ Para acompanhar</h3>';
  prox.forEach(function(c){
    const esperando = c.status==='aguardando_pagamento';
    const d=n(c.dias);
    const cor = esperando ? 'var(--gold)'
              : (d<0?'#e07070':(d<=60?'var(--gold)':'var(--muted)'));
    // sem pagamento nao existe `fim`: dataBR(null) e "em 0 dias" seriam mentira
    const quando = esperando ? 'aguardando o 1º pagamento'
                 : 'vence '+dataBR(c.fim)+' · '+(d<0?'venceu':'em '+d+' dias');
    const valor = esperando ? moedaBR(c.valor)
                : (c.completo_anual!=null ? moedaBR(c.completo_anual) : 'sob consulta');
    // clicar abre a ficha do cliente, como na Lista. A proposta pronta fica
    // no botao ao lado, para quem quer o atalho.
    h+='<div class="chkline" onclick="abrirFicha(\''+c.obra_id+'\')">'
      +'<div class="cn"><b>'+esc(c.cliente)+'</b>'
      +(c.externo?'<span class="uext">cliente de plano</span>':'')
      +'<span>'+(c.modulos||'?')+' módulos · <span style="color:'+cor+'">'+quando+'</span></span></div>'
      +'<span style="font-size:12px;font-weight:800;color:var(--green-l)">'+valor+'</span>'
      +'<button class="stb" style="margin-left:9px" '
      +'onclick="event.stopPropagation();irEnviar(\''+c.obra_id+'\')">proposta</button>'
      // A janela de decisao. `dias` so existe depois que o contrato comecou --
      // n(null) devolve 0, entao testar o `d` ja convertido punha o botao em
      // quem ainda espera o 1o pagamento, que nao tem desfecho nenhum.
      +((c.contrato_id && !esperando && c.dias!=null && d<=90)
         ? '<button class="stb" style="margin-left:6px" '
           +'onclick="event.stopPropagation();formDesfecho(\''+c.contrato_id+'\')">fidelizou?</button>'
         : '')
      +'<span style="color:var(--muted)">›</span></div>'
      +(c.contrato_id ? '<div id="fd'+c.contrato_id+'"></div>' : '');
  });
  h+='</div>';
  return h;
}

/* ---------- FIDELIZOU OU NAO ----------
   O `status` dizia se o contrato esta valendo, nunca COMO terminou. Cortesia
   que venceu e nao renovou ficava igual a cortesia que virou plano pago: as
   duas viravam 'encerrado'. Sem isso nao da para responder "de 53 cortesias,
   quantas viraram cliente?", que e a pergunta que importa nessa carteira. */
function formDesfecho(contratoId){
  const box=document.getElementById('fd'+contratoId); if(!box) return;
  if(box.innerHTML){ box.innerHTML=''; return; }
  const P=(PLN&&PLN.planos)||[];
  let ops='<option value="">— escolha o plano —</option>';
  P.forEach(function(p){
    if(p.codigo==='essencial') return;   // a cortesia nao se renova em cortesia
    ops+='<option value="'+esc(p.codigo)+'" data-anual="'+(p.anual!=null?p.anual:'')+'">'
      +esc(p.nome)+(p.anual!=null?' · '+moedaBR(p.anual)+'/ano':' · sob consulta')+'</option>';
  });
  box.innerHTML='<div class="ncsec">'
   +'<div class="nctit">Como terminou este contrato?</div>'
   +'<div class="ncg2">'
   +'<label>Fidelizou — plano novo<select id="df_plano'+contratoId+'" '
     +'onchange="dfPreco(\''+contratoId+'\')">'+ops+'</select></label>'
   +'<label>Valor (R$)<input id="df_valor'+contratoId+'" type="number" step="0.01" inputmode="decimal"></label>'
   +'</div>'
   +'<label class="ncck"><input type="checkbox" id="df_aguard'+contratoId+'" checked> '
     +'começa no 1º pagamento</label>'
   +'<div class="plbtns" style="margin-top:9px">'
   +'<button class="stb prim" onclick="dfSalvar(\''+contratoId+'\',\'renovou\')">✓ Fidelizou</button>'
   +'<button class="stb" onclick="dfSalvar(\''+contratoId+'\',\'nao_renovou\')">✗ Não fidelizou</button>'
   +'</div>'
   +'<div class="ncdica" style="margin-top:9px">Marcar "não fidelizou" encerra o '
   +'contrato e pede o motivo — é o motivo que mostra, daqui a um ano, por que a '
   +'carteira converteu pouco ou muito.</div>'
   +'</div>';
}

function dfPreco(id){
  const sel=document.getElementById('df_plano'+id), inp=document.getElementById('df_valor'+id);
  if(!sel||!inp) return;
  const op=sel.options[sel.selectedIndex];
  const a=op?op.getAttribute('data-anual'):'';
  if(a) inp.value=a;   // preenche pelo preco de tabela; da para editar
}

async function dfSalvar(id, desfecho){
  const v=function(x){ return (((document.getElementById(x+id)||{}).value)||'').trim(); };
  let motivo=null;
  if(desfecho==='nao_renovou'){
    motivo=prompt('Por que não fidelizou?\n\n(achou caro, não vê valor, trocou de empresa, sem resposta...)');
    if(motivo===null) return;
    if(!confirm('Encerrar o contrato como NÃO fidelizado?')) return;
  } else {
    if(!v('df_plano')){ toast('Escolha o plano da renovação'); return; }
    if(!v('df_valor')){ toast('Informe o valor'); return; }
    if(!confirm('Registrar como fidelizado e abrir o contrato novo?')) return;
  }
  const r=await sb.rpc('plano_desfecho',{
    p_contrato:id, p_desfecho:desfecho, p_motivo:motivo,
    p_plano_codigo: desfecho==='renovou' ? v('df_plano') : null,
    p_valor: desfecho==='renovou' ? parseFloat(v('df_valor')) : null,
    p_forma:'anual', p_meses:12,
    p_aguardando: !!(document.getElementById('df_aguard'+id)||{}).checked });
  if(r.error){ toast('Erro: '+r.error.message); return; }
  if(r.data && r.data.erro){ toast(r.data.erro); return; }
  toast(desfecho==='renovou' ? 'Fidelizado ✓ contrato novo aberto' : 'Registrado como não fidelizado');
  carregarPlanos();
}

   Tudo numa chamada so. A gravacao e feita por plano_cadastrar_cliente(),

   inteiro, ou nao entra nada. A tela nao decide regra nenhuma -- trilha,

let NC = { usinas: [ {} ] };

function ncLerUsinas(){
  for(let i=0;i<NC.usinas.length;i++){
    const g=function(id){ return ((document.getElementById(id+i)||{}).value||''); };
    NC.usinas[i] = {
      apelido:g('nc_u_ap'), potencia_kwp:g('nc_u_kwp'), modulos:g('nc_u_mod'),
      cidade:g('nc_u_cid'), endereco:g('nc_u_end'),
      data_instalacao:g('nc_u_dti'),
      data_estimada: !!(document.getElementById('nc_u_est'+i)||{}).checked,
      compensa_em_indice:g('nc_u_comp')
    };
  }
}
function ncRedesenha(){
  const box=document.getElementById('ncUsinas');
  if(box) box.innerHTML = NC.usinas.map(ncUsinaLinha).join('');
}
function ncAddUsina(){ ncLerUsinas(); NC.usinas.push({}); ncRedesenha(); }
function ncDelUsina(i){
  ncLerUsinas(); NC.usinas.splice(i,1);
  if(!NC.usinas.length) NC.usinas=[{}];
  ncRedesenha();
}

   +'<div class="ncuh"><b>Usina '+(i+1)+'</b>'

function alCopiar(id){
  const x=((AUT.fila||{}).hoje||[]).find(function(y){return y.leitura_id===id;});
  if(!x) return;
  if(navigator.clipboard) navigator.clipboard.writeText(x.texto||'').then(function(){ toast('Mensagem copiada ✓'); });
  else toast('Selecione o texto e copie');
}

// Envia e marca numa tacada so. Mesma mecanica de enviarPlano: quem aperta o
// botao e uma pessoa, entao nao fura a regra 3.5.
async function alEnviar(id){
  const x=((AUT.fila||{}).hoje||[]).find(function(y){return y.leitura_id===id;});
  if(!x || !x.grupo){ toast('Este cliente não tem grupo cadastrado'); return; }
  if(!confirm('Enviar o aviso de leitura no grupo de '+x.cliente+'?')) return;
  try{
    const { data:sess } = await sb.auth.getSession();
    const r=await fetch(SB_URL+'/functions/v1/notificar-grupo',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+sess.session.access_token},
      body:JSON.stringify({grupo_id:x.grupo, message:x.texto})
    });
    const res=await r.json().catch(function(){return {};});
    if(!r.ok||res.error){ toast('Erro ao enviar: '+(res.error||r.status)); return; }
  }catch(e){ toast('Falha de conexão'); return; }
  // so marca depois que o envio deu certo (convencao 8: confere o erro antes de seguir)
  const m=await sb.rpc('autoleitura_marcar',{p_leitura:id, p_tipo:x.tipo});
  if(m.error){ toast('Enviado, mas não consegui marcar: '+m.error.message); return; }
  // envio adiantado nao cancela o automatico da data certa
  if(m.data && m.data.marcado===false && m.data.aviso) toast('📤 Enviado. '+m.data.aviso);
  else toast('📤 Aviso enviado para '+x.cliente);
  carregarPlanos();
}

function ncColeta(){
  ncLerUsinas();
  const v=function(id){ return (((document.getElementById(id)||{}).value)||'').trim(); };
  const dig=function(x){ return String(x||'').replace(/\D/g,''); };
  return {
    cliente:{ nome:v('nc_nome'), telefone:dig(v('nc_tel')), documento:dig(v('nc_doc')),
              cidade:v('nc_cid'), nascimento_dia:v('nc_dia'), nascimento_mes:v('nc_mes') },
    obra:{ sistema_origem:v('nc_origem'), endereco:v('nc_end'), cidade:v('nc_cid'),
           grupo:v('nc_grupo'), categoria:v('nc_cat'), ramo:v('nc_ramo') },
    usinas: NC.usinas.map(function(u){ return {
        apelido:(u.apelido||'').trim(), potencia_kwp:u.potencia_kwp||'',
        modulos:u.modulos||'', cidade:(u.cidade||'').trim(),
        endereco:(u.endereco||'').trim(), data_instalacao:u.data_instalacao||'',
        data_estimada:!!u.data_estimada, compensa_em_indice:u.compensa_em_indice||'' }; }),
    contrato:{ plano_codigo:v('nc_plano'), valor:v('nc_valor'), forma:v('nc_forma'),
               meses:v('nc_meses'),
               aguardando: !!(document.getElementById('nc_aguard')||{}).checked,
               inicio:v('nc_inicio'),
               nota_documento: dig(v('nc_notadoc')) || dig(v('nc_doc')),
               nota_nome:v('nc_notanome'), observacao:v('nc_obs') }
  };
}

  const r=await sb.rpc('plano_cadastrar_cliente',{ p:ncColeta(), p_simular:true });
  if(r.error){ toast('Erro: '+r.error.message); return; }
  const d=r.data||{};

   +d.usinas+(d.usinas===1?' usina':' usinas')+' · '+Number(d.kwp||0).toFixed(2)+' kWp'

   +' · <b>'+nEnd+(nEnd===1?' endereço':' endereços')+'</b><br>';

async function ncGravar(){
  if(!confirm('Gravar este cadastro?')) return;
  const r=await sb.rpc('plano_cadastrar_cliente',{ p:ncColeta(), p_simular:false });
  if(r.error){ toast('Erro: '+r.error.message); return; }
  const d=r.data||{};
  if(!d.ok){ ncErros(d.erros); return; }

function previaPlano(){
  const el=document.getElementById('plPrev'); if(!el) return;
  if(!PLSEL){ el.innerHTML=''; return; }
  const c=(PLN.clientes||[]).find(function(x){return x.id===PLSEL;});
  if(!c){ el.innerHTML=''; return; }
  const cmp=planoCompletoPara(c.modulos);
  const ad=adicionalEndereco(c.enderecos);
  const txt=textoPlano(c.cliente, c.modulos, c.enderecos);
  let h='<div class="plprev">';
  h+='<div class="plinfo">Sistema de <b>'+(c.modulos||'?')+' módulos</b>'
    +(ad.extras>0?' em <b>'+(ad.extras+1)+' endereços</b>':'')+' → '
    +(temPrecoTabela(cmp)
        ? 'Completo por <b>'+moedaBR(Number(cmp.mensal)+ad.mensal)+'/mês</b>'
          +(ad.extras>0?' <span style="color:var(--muted)">('+moedaBR(cmp.mensal)
            +' + '+moedaBR(ad.mensal)+' de endereço extra)</span>':'')
        : 'Completo <b>sob consulta</b> (porte fora da tabela)')
    +(c.externo?' · <span class="uext">cliente de plano</span>':'')
    +(c.plano_atual?' · hoje no plano <b>'+esc(c.plano_atual)+'</b>':'')+'</div>';
  h+='<pre class="plmsg">'+esc(txt)+'</pre>';
  h+='<div class="plbtns">'
   +'<button class="stb" onclick="copiarPlano()">📋 Copiar</button>'
   +(c.grupo?'<button class="stb prim" onclick="enviarPlano()">📤 Enviar no grupo</button>':
     '<span class="dica">Cliente sem grupo cadastrado</span>')
   +'</div></div>';
  el.innerHTML=h;
}

function copiarPlano(){
  const c=(PLN.clientes||[]).find(function(x){return x.id===PLSEL;});
  if(!c) return;
  const t=textoPlano(c.cliente,c.modulos,c.enderecos);
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(function(){ toast('Mensagem copiada ✓'); });
  else toast('Selecione o texto e copie');
}

async function enviarPlano(){
  const c=(PLN.clientes||[]).find(function(x){return x.id===PLSEL;});
  if(!c||!c.grupo) return;
  if(!confirm('Enviar a proposta de planos no grupo de '+c.cliente+'?')) return;
  const t=textoPlano(c.cliente,c.modulos,c.enderecos);
  try{
    const { data:sess } = await sb.auth.getSession();
    const r=await fetch(SB_URL+'/functions/v1/notificar-grupo',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+sess.session.access_token},
      body:JSON.stringify({grupo_id:c.grupo, message:t})
    });
    const res=await r.json().catch(function(){return {};});
    if(!r.ok||res.error){ toast('Erro ao enviar: '+(res.error||r.status)); return; }
    toast('📤 Proposta enviada para '+c.cliente);
  }catch(e){ toast('Falha de conexão'); }
}

var AUTOS=null;
async function carregarAutomacoes(){
  var r=await sb.rpc('get_automacoes');
  if(r.error||!r.data){ document.getElementById('mgbox').innerHTML='<div class="vazio">Não consegui carregar.</div>'; return; }
  AUTOS=r.data; renderAutomacoes();
}
async function ligarAutomacao(chave, ligar){
  var r=await sb.rpc('ligar_automacao',{p_chave:chave, p_ligar:ligar});
  if(r.error||(r.data&&r.data.erro)){ toast((r.data&&r.data.erro)||'Não deu certo'); return; }
  toast(ligar?'Ligada ✓':'Desligada');
  var a=(AUTOS||[]).find(function(x){return x.chave===chave;});
  if(a) a.ligada=ligar;
  renderAutomacoes();
}
function renderAutomacoes(){
  var lista=AUTOS||[];
  var ligadas=lista.filter(function(a){return a.ligada;}).length;
  var grupos=[];
  lista.forEach(function(a){ if(grupos.indexOf(a.grupo)<0) grupos.push(a.grupo); });
  var h='<div class="dica" style="margin-bottom:14px">'
    +'<b>'+ligadas+' de '+lista.length+'</b> automações ligadas. '
    +'Desligar uma não apaga nada — só para de executar.</div>';
  grupos.forEach(function(g){
    h+='<div class="sec"><h3>'+esc(g)+'</h3>';
    lista.filter(function(a){return a.grupo===g;}).forEach(function(a){
      h+='<div class="autol">'
        +'<div class="autotxt"><b>'+esc(a.nome)+'</b>'
        +(a.descricao?'<span>'+esc(a.descricao)+'</span>':'')+'</div>'
        +'<button class="sw'+(a.ligada?' on':'')+'" onclick="ligarAutomacao(\'' + a.chave + '\','+(!a.ligada)+')" '
        +'aria-label="'+(a.ligada?'desligar':'ligar')+'"><i></i></button>'
        +'</div>';
    });
    h+='</div>';
  });
  document.getElementById('mgbox').innerHTML=h;
}

function n0(v){ return v==null?'—':Math.round(Number(v)).toLocaleString('pt-BR'); }
function corPct(p){ if(p==null) return 'var(--mut)'; if(p>=90) return '#7bbf7b'; if(p>=75) return '#e0a33e'; return '#e57373'; }

var UDIAS=30;
function setUdias(n){ UDIAS=n; abrirUsina(DET.usina.id); }
async function abrirUsina(id){
  var w=document.getElementById('usinaModal');
  if(!w){ w=document.createElement('div'); w.id='usinaModal'; document.body.appendChild(w); }
  w.className='uwrap';
  w.innerHTML='<div class="ubox"><div class="center"><div class="spin"></div>Carregando...</div></div>';
  w.onclick=function(ev){ if(ev.target===w) fecharUsina(); };
  var r=await sb.rpc('get_usina_detalhe',{p_usina:id, p_dias:UDIAS});
  if(r.error||!r.data){ w.innerHTML='<div class="ubox">Não consegui carregar.</div>'; return; }
  DET=r.data; desenhaUsina();
}
function fecharUsina(){ var w=document.getElementById('usinaModal'); if(w) w.className='uwrap off'; }

    var anor=dias.filter(function(d){return d.anormal;}).length;
    var esp=dias.filter(function(d){return Number(d.esperado)>0;});
    var espMed = esp.length? esp.reduce(function(a,d){return a+Number(d.esperado);},0)/esp.length : 0;
    h+='<div class="usec">Energia produzida'
      +(anor?' <span style="color:#e57373;font-weight:700;text-transform:none;letter-spacing:0">· '
        +anor+' dia'+(anor>1?'s':'')+' fora do padrão</span>':'')+'</div>';
    h+='<div class="dper">'
      +[[7,'7 dias'],[30,'30 dias'],[90,'90 dias']].map(function(o){
          return '<button class="dpb'+(UDIAS===o[0]?' on':'')+'" onclick="setUdias('+o[0]+')">'+o[1]+'</button>';
        }).join('')
      +'<span class="dlegp"><i class="lp-real"></i>produzida <i class="lp-esp"></i>esperada</span></div>';
    h+='<div class="dgraf">';
    if(espMed>0) h+='<div class="dlinha" style="bottom:'+(espMed/mx*100*0.65+24)+'px"></div>';
    dias.forEach(function(d,ix){
      var alt=(Number(d.kwh)||0)/mx*100;
      var chuvoso=(d.tempo==='chuva'||d.tempo==='nublado');
      var cor = d.sem_medicao ? 'repeating-linear-gradient(45deg,var(--card2),var(--card2) 3px,var(--border) 3px,var(--border) 6px)'
              : (d.anormal ? '#e57373' : (chuvoso ? '#8fa6b8' : '#22b573'));
      var icone = d.sem_medicao ? '📵'
                : (d.tempo==='chuva' ? '🌧️' : (d.tempo==='nublado' ? '☁️'
                : (d.tempo==='sol entre nuvens' ? '⛅' : (d.tempo==='sol' ? '☀️' : '·'))));
      var altura = d.sem_medicao ? 100 : Math.max(alt,2);
      h+='<div class="dcol'+(d.anormal?' ruim':'')+(d.sem_medicao?' mudo':'')+'" onclick="event.stopPropagation();detalheDia('+ix+')">'
        +'<div class="dtempo">'+icone+'</div>'
        +'<div class="dval">'+(d.sem_medicao?'':(Number(d.kwh)>0?Math.round(d.kwh):''))+'</div>'
        +'<div class="dbar"><span style="height:'+altura+'%;background:'+cor+'"></span></div>'
        +'<div class="ddia">'+String(d.dia).slice(8,10)+'/'+String(d.dia).slice(5,7)+'</div>'
        +'</div>';
    });
    h+='</div>';
    h+='<div id="diaInfo" class="diainfo"></div>';
    var temMudo=dias.some(function(x){return x.sem_medicao;});
    h+='<div class="dleg"><span><i style="background:#22b573"></i>dia de sol</span>'
      +'<span><i style="background:#8fa6b8"></i>chuva ou nublado</span>'
      +'<span><i style="background:#e57373"></i>fora do padrão</span>'
      +(temMudo?'<span><i class="imudo"></i>sem medição — o sistema pode estar gerando</span>':'')
      +'</div>';
  }
  h+='<div class="usec">Previsto e realizado, mês a mês</div>';
  var maxv=1;
  meses.forEach(function(m){ maxv=Math.max(maxv, Number(m.ajustado)||0, Number(m.real)||0); });
  h+='<div class="ugraf">';
  meses.forEach(function(m){
    var pv=(Number(m.ajustado)||0)/maxv*100, rv=(m.real!=null?Number(m.real):0)/maxv*100;
    var pct=(m.ajustado&&m.real!=null)?Math.round(m.real/m.ajustado*100):null;
    h+='<div class="ugcol" title="'+MESNOME[m.mes-1]+': '+(m.real!=null?n0(m.real):'sem dado')+' de '+n0(m.ajustado)+' kWh">'
      +'<div class="ugbar"><span class="ugprev" style="height:'+pv+'%"></span>'
      +'<span class="ugreal" style="height:'+rv+'%;background:'+corPct(pct)+'"></span></div>'
      +'<div class="ugm">'+MESNOME[m.mes-1]+'</div></div>';
  });
  h+='</div>';
  h+='<div class="mut" style="font-size:11.5px;margin:-2px 0 10px">Barra clara é o previsto, colorida é o realizado.</div>';
  h+='<div class="umeses">';
  meses.forEach(function(m){
    var real=m.real, prev=m.ajustado, pct = (prev&&real!=null)? Math.round(real/prev*100) : null;
    var fat=DET.usina.fator;
    h+='<div class="umes">'
      +'<div class="umnome">'+MESNOME[m.mes-1]+'</div>'
      +'<input class="uminput" type="number" min="0" value="'+(m.previsto!=null?m.previsto:'')+'" '
      +'onchange="gravarPrevisao('+m.mes+',this.value)" title="Previsto da proposta, antes do ajuste">'
      +((fat!=null && Number(fat)!==1)
        ? '<div class="umaj">meta '+n0(m.ajustado)+'</div>' : '')
      +'<div class="umreal" style="color:'+corPct(pct)+'">'+(real!=null?n0(real):'—')+'</div>'
      +'<div class="umfonte">'+(real!=null&&pct!=null?pct+'%':(m.fonte==='proposta'?'proposta':'estimado'))+'</div>'
      +'</div>';
  });
  h+='</div>';
  if(hist.length){
    h+='<div class="usec">Histórico</div><div class="uhist">';
    hist.slice(0,12).forEach(function(x){
      h+='<div class="uhl"><span>'+x.ref+'</span>'
        +'<span>'+n0(x.kwh)+' de '+n0(x.previsto)+' kWh</span>'
        +'<span style="color:'+corPct(x.pct)+'">'+(x.pct!=null?x.pct+'%':'—')
        +(x.completo?'':' <span class="mut">parcial</span>')+'</span></div>';
    });
    h+='</div>';
  }
  h+='<div class="usec">Mensagens enviadas a este cliente</div>';
  if(!msgs.length) h+='<div class="mut" style="font-size:12.5px">Nada enviado ainda.</div>';
  else { h+='<div class="uhist">'; msgs.slice(0,8).forEach(function(m){
      var d=new Date(m.quando);
      h+='<div class="uhl"><span>'+esc(m.tipo)+'</span><span class="mut">'
        +('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear()+'</span></div>';
    }); h+='</div>'; }
  h+='</div>';
  document.getElementById('usinaModal').innerHTML=h;
}

function detalheDia(ix){
  var d=(DET.dias_serie||DET.dias||[])[ix]; if(!d) return;
  var el=document.getElementById('diaInfo'); if(!el) return;
  var dt=String(d.dia).slice(8,10)+'/'+String(d.dia).slice(5,7);
  if(d.sem_medicao){
    el.innerHTML='<b>'+dt+'</b> · sem medição — a usina estava sem comunicar, pode ter gerado normalmente'
      +(d.tempo?' · '+d.tempo:'');
    return;
  }
  var partes=['<b>'+dt+'</b>', n0(d.kwh)+' kWh'];
  if(d.tempo) partes.push(d.tempo);
  if(d.sol!=null) partes.push(d.sol+'h de sol');
  if(d.chuva) partes.push(d.chuva+' mm de chuva');
  if(d.razao!=null) partes.push(Math.round(d.razao*100)+'% do padrão dela');
  if(d.anormal) partes.push('<b style="color:#e57373">fora do padrão</b>');
  el.innerHTML=partes.join(' · ');
}

async function gravarCausa(){
  var c=document.getElementById('causaIn').value;
  var n=document.getElementById('causaNota').value;
  var av=document.getElementById('causaAvisado').checked;
  var r=await sb.rpc('salvar_causa',{p_usina:DET.usina.id, p_causa:c||null, p_nota:n||null, p_avisado:av});
  if(r.error||(r.data&&r.data.erro)){ toast('Não deu para salvar'); return; }
  toast('Motivo registrado ✓');
  USI=null; abrirUsina(DET.usina.id);
}

async function gravarFator(){
  var f=document.getElementById('fatorIn').value.replace(',','.');
  var nota=document.getElementById('notaIn').value;
  var r=await sb.rpc('salvar_fator',{p_usina:DET.usina.id, p_fator: f===''?null:Number(f), p_nota: nota||null});
  if(r.error||(r.data&&r.data.erro)){ toast('Não deu: '+((r.data&&r.data.erro)||r.error.message)); return; }
  toast('Ajuste salvo ✓');
  USI=null; abrirUsina(DET.usina.id);
}
async function gravarPrevisao(mes, valor){
  var v=String(valor).replace(',','.');
  if(v==='') return;
  var r=await sb.rpc('salvar_previsao',{p_usina:DET.usina.id, p_mes:mes, p_kwh:Number(v)});
  if(r.error||(r.data&&r.data.erro)){ toast('Não deu para salvar'); return; }
  toast(MESNOME[mes-1]+' salvo ✓');
  abrirUsina(DET.usina.id);
}

function renderUsinasVelho(){

  };

    + chip('','Todas',R.total||0,'')
    + chip('operando','Operando',R.operando||0,'#7bbf7b')

    + chip('problema','Com problema',R.problema||0,'#e0a33e')
    + chip('sem_leitura','Sem leitura',R.sem_leitura||0,'#8fa6b8')
    + '</div>';

  if(UFILTRO) arr=arr.filter(function(u){return u.grupo_status===UFILTRO;});

      +'<div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline">'
      +'<b style="font-size:14.5px">'+esc(u.cliente||'')+'</b>'
      +'<span style="color:'+cor+';font-size:12px;white-space:nowrap">● '+esc(st)+'</span></div>'
      +'<div class="mut" style="font-size:12.5px;margin-top:4px">'
      + esc(u.apelido||'Usina') + ' · ' + (Number(u.kwp)||0).toFixed(2).replace('.',',') + ' kWp'
      + (u.contrato?' · contrato '+esc(u.contrato):'')
      + (u.papel!=='propria'?' · '+esc(u.papel):'')
      + (u.horas_assim!=null?' · '+hTxt(u.horas_assim):'')
      + (u.saiu?' · <span style="color:#e0a33e">pediu para sair</span>':'')
      +'</div></div>';
  });
  return h+'</div>';
}

function renderUsinas(){
  var R=(USI&&USI.resumo)||{}, arr=((USI&&USI.usinas)||[]).slice();
  var total=R.total||0;
  var faixas=[
    ['crítico','Erro no inversor','#c0392b',R.critico||0],
    ['parada','Parada','#c0392b',R.parada||0],
    ['silencioso','Sem gerar com sol','#d35400',R.silencioso||0],
    ['nunca gerou','Nunca gerou','#d35400',R.nunca_gerou||0],
    ['sem comunicação','Sem medição','#e0a33e',R.sem_comunicacao||0],
    ['sem dado','Sem dado','#7b8a99',R.sem_dado||0],
    ['alerta','Alerta','#e0a33e',R.alerta||0],
    ['normal','Gerando','#5aa469',R.normal||0]
  ].filter(function(f){return f[3]>0;});

  var h='<div class="saude">';
  if(total){
    h+='<div class="sbar">';
    faixas.forEach(function(f){
      h+='<div class="sseg'+(UFILTRO===f[0]?' on':'')+'" style="width:'+(f[3]/total*100)+'%;background:'+f[2]+'" '
        +'title="'+f[1]+': '+f[3]+'" onclick="setUfiltro(\'' + (UFILTRO===f[0]?'':f[0]) + '\')"></div>';
    });
    h+='</div>';
  }
  h+='<div class="sleg">';
  h+='<button class="slg'+(UFILTRO===''?' on':'')+'" onclick="setUfiltro(\'\')"><b>'+total+'</b> todas</button>';
  faixas.forEach(function(f){
    h+='<button class="slg'+(UFILTRO===f[0]?' on':'')+'" onclick="setUfiltro(\'' + f[0] + '\')">'
      +'<i style="background:'+f[2]+'"></i><b>'+f[3]+'</b> '+f[1]+'</button>';
  });
  h+='</div></div>';

  if(UFILTRO) arr=arr.filter(function(u){return u.estado===UFILTRO;});
  if(BUSCA){ var b=BUSCA.toLowerCase();
    arr=arr.filter(function(u){return (u.cliente||'').toLowerCase().includes(b)
      ||(u.contrato||'').includes(b)||(u.apelido||'').toLowerCase().includes(b);}); }
  if(!arr.length) return h+'<div class="vazio">Nenhuma usina com esse filtro.</div>';

  var CAUSANOME={wifi:'Wi-Fi desconectado',sem_energia:'Faltou energia',
    desligado_pelo_cliente:'Cliente desligou',obra_no_local:'Obra no local',
    aguardando_concessionaria:'Aguardando concessionária',defeito_inversor:'Defeito no inversor',
    cadastro_errado:'Cadastro errado',outro:'Outro motivo'};
  var cEstado={'parada':'#c0392b','crítico':'#c0392b','silencioso':'#d35400',
               'nunca gerou':'#d35400','sem comunicação':'#e0a33e',
               'alerta':'#e0a33e','normal':'#5aa469','sem dado':'#7b8a99','sem leitura':'#7b8a99'};
  var cDesemp={boa:'#5aa469',atencao:'#e0a33e',baixa:'#e57373',sem_base:'#7b8a99'};

  h+='<div class="ugrade">';
  arr.forEach(function(u){
    var ce=cEstado[u.estado]||'#7b8a99', cd=cDesemp[u.desempenho]||'#7b8a99';
    var kwp=(Number(u.kwp)||0).toFixed(2).replace('.',',');
    h+='<div class="ucard" onclick="abrirUsina(\'' + u.usina_id + '\')">'
      +  '<div class="uctopo">'
      +    '<div class="ucnome">'+esc(u.cliente||'')+'</div>'
      +    (u.contrato?'<span class="uctag">'+esc(u.contrato)+'</span>':'')
      +  '</div>'
      +  '<div class="ucloc">'+esc(u.apelido||'Usina')+' · '+kwp+' kWp'
      +    (u.cidade?' · '+esc(u.cidade):'')+'</div>'
      +  '<div class="ucselos">'
      +    '<span class="ucselo" style="border-color:'+ce+';color:'+ce+'">'
      +      '<span class="ucdot" style="background:'+ce+'"></span>'+esc(u.rotulo||u.estado)+'</span>'
      +    (u.causa ? ('<span class="uctagc">'+esc(CAUSANOME[u.causa]||u.causa)
             +(u.avisado?' · avisado':'')+'</span>') : '')
      +  '</div>'
      +  '<div class="ucmotivo">'+esc(u.motivo||'')+'</div>'
      +  '<div class="ucrod">'
      +    '<span>'+(u.pct!=null
             ? '<b style="color:'+cd+';font-size:15px">'+u.pct+'%</b> do previsto em '+esc(u.ref_pct||'')
             : (Number(u.kwh_14d)>0
                ? '<b style="font-size:15px">'+Number(u.kwh_14d).toLocaleString('pt-BR')+'</b> kWh em 14 dias'
                : 'sem geração registrada'))+'</span>'
      +    (u.papel!=='propria'?'<span class="ucobs">'+esc(u.papel)+'</span>':'')
      +    (u.saiu?'<span class="ucobs">saiu da lista</span>':'')
      +  '</div>'
      +  (u.nota?'<div class="ucnota">'+esc(u.nota)+'</div>':'')
      +'</div>';
  });
  return h+'</div>';
}

var MSG=null, MABA='pendentes';
function setMaba(v){ MABA=v; document.getElementById('mgbox').innerHTML=renderMensagens(); }
function quandoTxt(t){ if(!t) return ''; var d=new Date(t);
  return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }

async function decidir(id, acao){
  var el=document.getElementById('tx-'+id);
  var txt=el?el.value:null;
  if(acao==='recusar' && !confirm('Recusar esta mensagem? Ela não será enviada.')) return;
  var r=await sb.rpc('decidir_mensagem',{p_id:id, p_acao:acao, p_texto:txt});
  if(r.error||(r.data&&r.data.erro)){ toast((r.data&&r.data.erro)||'Não deu certo'); return; }
  toast(acao==='aprovar'?'Aprovada ✓':'Recusada');
  carregarMensagens();
}

var APROV=null;
async function carregarMensagens(){
  var r=await sb.rpc('get_posvenda_mensagens',{p_dias:14});
  if(r.error||!r.data){ document.getElementById('mgbox').innerHTML='<div class="vazio">Não consegui carregar.</div>'; return; }
  MSG=r.data;
  var q=await sb.rpc('get_aprovacoes',{p_situacao:'todas'});
  APROV=(q.error?[]:(q.data||[]));
  document.getElementById('mgbox').innerHTML=renderMensagens();
}

function renderMensagens(){
  var esp=(MSG&&MSG.esperando)||[], par=(MSG&&MSG.usinas_paradas)||[], env=(MSG&&MSG.enviadas)||[], lig=(MSG&&MSG.ligado)||{};
  var pend=esp.length+par.length;
  var aguard=(APROV||[]).filter(function(a){return a.situacao==='aguardando';}).length;
  var h='<div class="tools" style="margin-top:0">'
    +'<button class="chip '+(MABA==='aprovar'?'on':'')+'" onclick="setMaba(\'aprovar\')">Para aprovar <b>'+aguard+'</b></button>'
    +'<button class="chip '+(MABA==='pendentes'?'on':'')+'" onclick="setMaba(\'pendentes\')">Precisam de você <b>'+pend+'</b></button>'
    +'<button class="chip '+(MABA==='enviadas'?'on':'')+'" onclick="setMaba(\'enviadas\')">Já enviadas <b>'+env.length+'</b></button>'
    +'<button class="chip '+(MABA==='estado'?'on':'')+'" onclick="setMaba(\'estado\')">Automações</button>'
    +'</div>';

  if(MABA==='aprovar'){
    var lista=(APROV||[]);
    var esperando=lista.filter(function(a){return a.situacao==='aguardando';});
    var decididas=lista.filter(function(a){return a.situacao!=='aguardando';});
    if(!lista.length) return h+'<div class="vazio">Nenhuma mensagem gerada ainda.</div>';
    var bloco=function(a){
      var pode=(a.situacao==='aguardando');
      var alerta = a.motivo && a.motivo.indexOf('conferir numeros')===0;
      return '<div class="apv'+(pode?'':' fria')+'">'
        +'<div class="apvtop"><b>'+esc(a.cliente||'')+'</b>'
        +(a.contrato?'<span class="uctag">'+esc(a.contrato)+'</span>':'')
        +'<span class="apvsit apv-'+esc(a.situacao)+'">'+esc(a.situacao)+'</span></div>'
        +(a.motivo?'<div class="apvmot'+(alerta?' erro':'')+'">'+esc(a.motivo)+'</div>':'')
        +(pode
           ? '<textarea class="apvtxt" id="tx-'+a.id+'">'+esc(a.texto)+'</textarea>'
           : '<div class="apvfixo">'+esc(a.texto)+'</div>')
        +(a.saiu?'<div class="apvmot erro">este cliente pediu para sair das mensagens</div>':'')
        +(!a.tem_grupo?'<div class="apvmot erro">esta obra não tem grupo no WhatsApp</div>':'')
        +(pode
           ? '<div class="apvacts">'
             +'<button class="ubtn" onclick="decidir(\'' + a.id + '\',\'aprovar\')">Aprovar</button>'
             +'<button class="ubtn" onclick="decidir(\'' + a.id + '\',\'recusar\')">Recusar</button>'
             +'</div>'
           : '<div class="apvmot">'+(a.decidida_por?esc(a.decidida_por):'')
             +(a.decidida_em?' · '+quandoTxt(a.decidida_em):'')+'</div>')
        +'</div>';
    };
    var out='';
    if(esperando.length){ out+='<div class="mut" style="font-size:12.5px;margin:14px 0 8px">Esperando sua decisão</div>'
      + esperando.map(bloco).join(''); }
    if(decididas.length){ out+='<div class="mut" style="font-size:12.5px;margin:18px 0 8px">Já decididas</div>'
      + decididas.slice(0,10).map(bloco).join(''); }
    return h+out;
  }

  if(MABA==='estado'){
    var linha=function(nome,v,obs){
      var on = String(v)==='1';
      return '<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px">'
        +'<div><b style="font-size:14px">'+nome+'</b>'+(obs?'<div class="mut" style="font-size:12px;margin-top:3px">'+obs+'</div>':'')+'</div>'
        +'<span style="color:'+(on?'#7bbf7b':'#8fa6b8')+';font-size:12.5px;white-space:nowrap">'+(on?'● ligada':'○ desligada')+'</span></div>';
    };
    return h+'<div class="list">'
      + linha('Nota lida do WhatsApp', lig.nps, 'Registra, agradece e pede avaliação no Google')
      + linha('Cliente esperando resposta', lig.espera, 'Avisa quando a última mensagem do grupo é do cliente')

function renderBrindes(){

    return (x.cliente||'').toLowerCase().indexOf(b)>=0 || (x.voucher||'').toLowerCase().indexOf(b)>=0;});
  var pend=arr.filter(function(x){return !x.entregue_em;});

  var semG=arr.filter(function(x){return !x.avaliou_google_em;});

  var h='<div class="rgstat">'+
    bcard('',arr.length,'Brindes solicitados','')+
    bcard('pend',pend.length,'A entregar','var(--gold)')+
    bcard('ent',ent.length,'Entregues','var(--green-l)')+
    bcard('semg',semG.length,'Sem avaliação no Google','#e07070')+

/* ---------- ADICIONAR USINA A UM CLIENTE QUE JA EXISTE ----------
   O caso e o rural com propriedade nova, ou quem ampliou. Ate aqui usina so
   nascia do casamento com o SolarView.

   Quem grava e usina_adicionar() no banco, que decide sozinha se mexe no
   total da obra: em cliente de plano soma, em obra de venda NAO -- ali a
   potencia e o projeto vendido e alimenta ficha, relatorio e margem. */
/* ---------- AUTOLEITURA DENTRO DA FICHA ----------
   O relogio do cliente aparece na ficha dele, junto das usinas e do plano, em
   vez de so numa aba separada. Quem esta olhando o cliente ja avisa dali. */
async function flAvisar(leituraId){
  const u=((FICHA&&FICHA.autoleitura)||[]).find(function(x){return x.proxima_id===leituraId;});
  if(!u){ toast('Não encontrei essa leitura'); return; }
  if(!u.grupo){ toast('Este cliente não tem grupo cadastrado'); return; }
  if(!confirm('Enviar o aviso da leitura de '+dataBR(u.proxima)+' no grupo?')) return;
  try{
    const { data:sess } = await sb.auth.getSession();
    const r=await fetch(SB_URL+'/functions/v1/notificar-grupo',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+sess.session.access_token},
      body:JSON.stringify({grupo_id:u.grupo, message:u.texto})
    });
    const res=await r.json().catch(function(){return {};});
    if(!r.ok||res.error){ toast('Erro ao enviar: '+(res.error||r.status)); return; }
  }catch(e){ toast('Falha de conexão'); return; }
  // so marca depois que o envio deu certo
  const m=await sb.rpc('autoleitura_marcar',{p_leitura:leituraId, p_tipo:'vespera'});
  if(m.error){ toast('Enviado, mas não consegui marcar: '+m.error.message); return; }
  if(m.data && m.data.marcado===false && m.data.aviso) toast('📤 Enviado. '+m.data.aviso);
  else toast('📤 Aviso enviado');
  abrirFicha(FICHA.obra.id);
}

/* ---------- AS DATAS DA UNIDADE, UMA A UMA ----------
   Antes a ficha mostrava so a PROXIMA leitura, e nao havia como corrigir uma
   data digitada errada. Agora lista todas as futuras, cada uma clicavel. */
function listaDatas(u){
  const DS=(u.datas)||[];
  const podeAgir = !!(FICHA && FICHA.pode_agir);
  let h='<div class="dtlist">';
  if(!DS.length){
    h+='<div class="dtvazio">Nenhuma data cadastrada para esta unidade.</div>';
  }
  DS.forEach(function(d){
    const doCliente = d.responsavel==='cliente';
    h+='<div class="dtrow">'+
       '<span class="dtd">'+dataBR(d.data)+'</span>'+
       '<span class="dtq" style="color:'+(doCliente?'var(--gold)':'var(--muted)')+'">'+
         (doCliente?'📷 o cliente informa':'a distribuidora lê')+'</span>'+
       (d.avisado?'<span class="uext">já avisado</span>':'')+
       (podeAgir?'<button class="stb dtb" onclick="dtEditar(\''+d.id+'\',\''+u.uc_id+'\')">editar</button>':'')+
       '</div>'+
       '<div id="dt'+d.id+'"></div>';
  });
  if(podeAgir && DS.length && u.resumo && u.grupo){
    h+='<div class="dtfoot">'+
       '<button class="stb" onclick="dtAvisarCalendario(\''+u.uc_id+'\')">'+
       '📅 Enviar o calendário no grupo</button>'+
       '<span class="dthint">manda as '+DS.length+' data'+(DS.length>1?'s':'')+
       ' de uma vez e explica que ele será avisado na véspera e no dia</span></div>';
  }
  return h+'</div>';
}

     +'<label>'+(i===0?'&nbsp;':'&nbsp;')
       +(FLDATAS.length>1
          ? '<button class="stb" style="width:100%" onclick="flTiraLinha('+i+')">✕ tirar</button>'
          : '<span></span>')+'</label>'
     +'</div>';
  });
  box.innerHTML=h;
}
function flMaisLinha(){ FLDATAS.push({data:'',resp:'cliente'}); flDesenhaLinhas(); }
function flTiraLinha(i){ FLDATAS.splice(i,1); flDesenhaLinhas(); }

async function flSalvarUC(obraId){
  const v=function(x){ return (((document.getElementById(x)||{}).value)||'').trim(); };
  if(!v('fa_num')){ toast('Informe o número da unidade consumidora'); return; }
  const r=await sb.rpc('uc_salvar',{p:{
    obra_id:obraId, numero:v('fa_num'), apelido:v('fa_ap'), distribuidora:v('fa_dist'),
    autoleitura: !!(document.getElementById('fa_auto')||{}).checked }});
  if(r.error){ toast('Erro: '+r.error.message); return; }
  if(r.data && r.data.erro){ toast(r.data.erro); return; }
  toast('Unidade salva ✓');
  abrirFicha(obraId);
}

async function flSalvarDatas(obraId){
  const uc=(((document.getElementById('fa_uc')||{}).value)||'').trim();
  if(!uc){ toast('Escolha a unidade'); return; }
  const itens=FLDATAS.filter(function(l){ return (l.data||'').trim(); })
                     .map(function(l){ return {data:l.data, responsavel:l.resp||'cliente'}; });
  if(!itens.length){ toast('Preencha pelo menos uma data'); return; }
  const r=await sb.rpc('uc_leituras_salvar_lote',{p_uc:uc, p_itens:itens});
  if(r.error){ toast('Erro: '+r.error.message); return; }
  if(r.data && r.data.erro){ toast(r.data.erro); return; }
  const d=r.data||{};
  const erros=(d.erros||[]);
  let msg=n(d.novas)+' data(s) nova(s)';
  if(n(d.atualizadas)>0) msg+=' e '+n(d.atualizadas)+' atualizada(s)';
  if(erros.length) msg+=' · ⚠️ '+erros.length+' com problema: '+erros.join('; ');
  toast(msg);
  FLDATAS=[];
  abrirFicha(obraId);
}

   +'<div class="ncg2">'
   +'<label>Apelido<input id="nu_ap" placeholder="Sítio — Birigui"></label>'
   +'<label>Cidade<input id="nu_cid" placeholder="Birigui"></label>'
   +'</div>'
   +'<div class="ncg2">'
   +'<label>Potência (kWp)<input id="nu_kwp" type="number" step="0.01" inputmode="decimal"></label>'
   +'<label>Módulos<input id="nu_mod" type="number" inputmode="numeric"></label>'
   +'</div>'
   +'<label>Endereço<input id="nu_end" placeholder="onde o técnico vai na visita anual"></label>'
   +'<div class="ncg2">'
   +'<label>Instalada em<input id="nu_dti" type="date"></label>'
   +'<label class="ncck"><input type="checkbox" id="nu_est"> a data é estimada</label>'
   +'</div>'
   +'<label>Quem instalou esta usina<select id="nu_papel">'
     +'<option value="">— decidir pelo tipo de cliente —</option>'
     +'<option value="expansao">A Polaris — é uma ampliação</option>'
     +'<option value="herdada">Outra empresa — usina herdada</option>'
   +'</select></label>'
   +(US.length?'<label>Manda os créditos para<select id="nu_comp">'+comp+'</select></label>':'')
   +'<div class="plbtns" style="margin-top:11px">'
