<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="theme-color" content="#011D2E">
<title>Polaris — Pós-venda</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html{overflow-x:hidden;width:100%}
body{overflow-x:hidden;width:100%;max-width:100vw;position:relative}
img,video,table{max-width:100%}
.wrap,.toolbar,.stats,.dchips,.cchips,.tools{max-width:100%}
:root{--navy:#011D2E;--green:#3B8B3B;--green-l:#58B868;--gold:#F5A623;
--bg:#0a1622;--card:#0f2233;--card2:#13293c;--border:#1d3850;--txt:#eaf2f8;--muted:#8fa6b8}
html[data-theme="light"]{--gold:#B8790A;--green-l:#3B8B3B;--bg:#F0F2ED;--card:#FFF;--card2:#F4F6F3;
--border:#DCE4EA;--txt:#022C44;--muted:#5F7787}
body{font-family:'Manrope',system-ui,sans-serif;background:
radial-gradient(1100px 560px at 82% -12%, rgba(12,60,90,.32) 0%, transparent 62%),var(--bg);
color:var(--txt);min-height:100vh;transition:background .3s;-webkit-font-smoothing:antialiased}

/* ---- Topbar com abas ---- */
.topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;
background:rgba(1,29,46,.88);backdrop-filter:blur(10px);
position:sticky;top:0;z-index:40;border-bottom:1px solid var(--border)}
html[data-theme="light"] .topbar{background:rgba(255,255,255,.9)}
.topbar img{height:26px}
.tabs{display:flex;gap:4px;background:var(--card2);border-radius:12px;padding:3px}
.tab{background:none;border:none;color:var(--muted);border-radius:9px;padding:8px 14px;
font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;
display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:.18s}
.tab:hover{color:var(--txt)}
.tab.on{background:var(--card);color:var(--gold);box-shadow:0 1px 6px rgba(0,0,0,.18)}
.tbrow{display:flex;align-items:center;gap:10px;width:100%;flex-wrap:wrap}
.tbacts{margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:0}
.ver{font-size:9.5px;color:var(--muted);opacity:.55;font-weight:700;white-space:nowrap}
@media(max-width:640px){.ver{display:none}}
.who{font-size:11px;color:var(--muted);font-weight:600;max-width:150px;
overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-out{background:none;border:1px solid var(--border);color:var(--muted);border-radius:9px;
padding:6px 10px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-out:hover{border-color:var(--gold);color:var(--gold)}

.wrap{max-width:1240px;margin:0 auto;padding:18px 16px 60px}

/* ---- Hero: o que precisa de você ---- */
.hero{background:var(--card);border:1px solid var(--border);border-radius:18px;
padding:20px;margin-bottom:16px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
background:linear-gradient(180deg,var(--gold),var(--green))}
.hero .eyebrow{font-size:10.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;
color:var(--muted)}
.hero h1{font-size:20px;font-weight:800;margin-top:6px;line-height:1.25}
.hero .sub{font-size:13px;color:var(--muted);margin-top:6px;font-weight:600}
.pend{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}
.pcard{flex:1 1 160px;background:var(--card2);border:1px solid var(--border);border-radius:13px;
padding:13px;cursor:pointer;transition:.18s;text-align:left;font-family:inherit;color:var(--txt)}
.pcard:hover{border-color:var(--gold);transform:translateY(-2px)}
.pcard .n{font-size:26px;font-weight:800;line-height:1}
.pcard .l{font-size:11px;color:var(--muted);font-weight:700;margin-top:5px;line-height:1.35}
.pcard.alerta .n{color:var(--gold)}
.pcard.ok .n{color:var(--green-l)}

/* ---- Busca e lista ---- */
.tools{display:flex;gap:8px;margin:16px 0 12px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:var(--card);
border:1px solid var(--border);border-radius:11px;padding:0 12px}
.search input{flex:1;background:none;border:none;outline:none;color:var(--txt);
font-family:inherit;font-size:14px;padding:11px 0}
.chip{background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:20px;
padding:8px 13px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.chip:hover{border-color:var(--gold)}
.chip.on{border-color:var(--gold);color:var(--gold);background:var(--card2)}

.lista{display:grid;gap:9px}
@media(min-width:900px){.lista{grid-template-columns:1fr 1fr}}
.cli{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;
cursor:pointer;transition:.18s;text-align:left;font-family:inherit;color:var(--txt);width:100%;
display:block;position:relative}
.cli:hover{border-color:var(--gold);transform:translateY(-2px)}
.cli.pend{border-left:3px solid var(--gold)}
.cli .top{display:flex;align-items:flex-start;gap:9px}
.cli .nome{font-size:15px;font-weight:800;line-height:1.25;flex:1}
.cli .meta{font-size:11.5px;color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 10px;font-weight:600}
.nota{flex-shrink:0;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;
justify-content:center;font-size:14px;font-weight:800;background:var(--card2);border:1px solid var(--border)}
.nota.p{color:var(--green-l);border-color:var(--green-l)}
.nota.d{color:#e07070;border-color:#e07070}
.nota.vazio{color:var(--muted);font-size:16px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;
letter-spacing:.5px;text-transform:uppercase;border-radius:20px;padding:3px 8px;
background:var(--card2);border:1px solid var(--border);color:var(--muted)}
.tag.gold{border-color:var(--gold);color:var(--gold)}
.tag.green{border-color:var(--green-l);color:var(--green-l)}
.tag.red{border-color:#e07070;color:#e07070}

/* ---- Ficha (drawer) ---- */
.ov{position:fixed;inset:0;background:rgba(0,10,20,.72);backdrop-filter:blur(4px);
z-index:60;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.ficha{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:760px;
max-height:94vh;overflow-y:auto;border:1px solid var(--border);border-bottom:none}
@media(min-width:700px){.ov{align-items:center}.ficha{border-radius:20px;border-bottom:1px solid var(--border)}}
.fhead{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--border);
padding:18px 20px;z-index:2}
.fhead .nome{font-size:19px;font-weight:800;line-height:1.2;padding-right:36px}
.fhead .meta{font-size:12px;color:var(--muted);margin-top:6px;font-weight:600;
display:flex;flex-wrap:wrap;gap:4px 12px}
.fechar{position:absolute;top:16px;right:16px;background:var(--card2);border:1px solid var(--border);
color:var(--muted);width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:15px;font-family:inherit}
.fbody{padding:18px 20px 30px}
.sec{margin-bottom:22px}
.sec h3{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;
color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec h3::after{content:'';flex:1;height:1px;background:var(--border)}

.dados{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.dado{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px}
.dado .k{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.dado .v{font-size:15px;font-weight:800;margin-top:3px}
.dado .v small{font-size:11px;color:var(--muted);font-weight:700}

/* trilha — o elemento assinatura */
.trilha{position:relative;padding-left:26px}
.trilha::before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:2px;
background:linear-gradient(180deg,var(--gold),var(--green),var(--border))}
.ev{position:relative;padding-bottom:16px}
.ev::before{content:'';position:absolute;left:-22px;top:4px;width:10px;height:10px;
border-radius:50%;background:var(--card);border:2px solid var(--border)}
.ev.on::before{border-color:var(--gold);background:var(--gold)}
.ev.cli::before{border-color:var(--green-l);background:var(--green-l)}
.ev .quando{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.4px}
.ev .oque{font-size:13.5px;font-weight:700;margin-top:2px;line-height:1.4}
.ev .txt{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.5;
background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 11px;font-weight:600}
.ev .txt b{color:var(--txt)}

.vazio{color:var(--muted);text-align:center;padding:26px 14px;font-size:13px;
background:var(--card);border:1px dashed var(--border);border-radius:13px;line-height:1.6}
.reg{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:14px;margin-top:8px}
.reg .lin{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:9px}
.reg .cp{flex:1;min-width:96px}
.reg label{display:block;font-size:10px;color:var(--muted);font-weight:700;
text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.reg input,.reg select,.reg textarea{width:100%;background:var(--card2);border:1px solid var(--border);
color:var(--txt);border-radius:9px;padding:10px;font-family:inherit;font-size:14px;outline:none}
.reg input:focus,.reg select:focus,.reg textarea:focus{border-color:var(--gold)}
.reg .chk{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;cursor:pointer;
padding:8px 0}
.reg .chk input{width:19px;height:19px;accent-color:var(--green)}
.reg .salvar{width:100%;background:var(--green);border:none;color:#fff;border-radius:10px;
padding:12px;font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer;margin-top:4px}
.reg .salvar:active{transform:scale(.99)}
.reg .dica{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.45;font-weight:600}
.mini{background:none;border:1px dashed var(--border);color:var(--muted);border-radius:9px;
padding:8px 12px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;width:100%}
.mini:hover{border-color:var(--gold);color:var(--gold)}
.gtab{width:100%;font-size:12px;border-collapse:collapse;margin-top:8px}
.gtab th{text-align:left;font-size:9.5px;color:var(--muted);text-transform:uppercase;
letter-spacing:.5px;padding:6px 5px;border-bottom:1px solid var(--border);font-weight:800}
.gtab td{padding:7px 5px;border-bottom:1px solid var(--border);font-weight:600}
.gtab tr:last-child td{border-bottom:none}
.gtab .num{text-align:right}
.rgstat{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.rgstat .b{flex:1;min-width:110px;background:var(--card);border:1px solid var(--border);
border-radius:12px;padding:12px}
.rgstat .b .n{font-size:22px;font-weight:800;line-height:1}
.rgstat .b .l{font-size:10.5px;color:var(--muted);font-weight:700;margin-top:4px}
.switch{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--border);
border-radius:13px;padding:14px;margin-bottom:14px}
.switch .info{flex:1}
.switch .tt{font-size:14px;font-weight:800}
.switch .ds{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.sw{width:52px;height:29px;border-radius:20px;background:var(--border);border:none;cursor:pointer;
position:relative;flex-shrink:0;transition:.22s}
.sw.on{background:var(--green)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;
background:#fff;transition:.22s}
.sw.on::after{transform:translateX(23px)}
.rgrow{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--border);
border-radius:12px;padding:12px;margin-bottom:7px}
.rgrow.hoje{border-left:3px solid var(--gold)}
.rgrow.bloq{opacity:.6;border-left:3px solid #e07070}
.rgrow .ic{font-size:19px;flex-shrink:0}
.rgrow .cn{flex:1;min-width:0}
.rgrow .cn b{display:block;font-size:13.5px;line-height:1.3}
.rgrow .cn span{font-size:11px;color:var(--muted);font-weight:600}
.rgrow .qd{font-size:11px;font-weight:800;color:var(--muted);text-align:right;flex-shrink:0}
.mod{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:7px}
.mod .top{display:flex;align-items:center;gap:9px}
.mod .top b{flex:1;font-size:13.5px}
.mod .dia{background:var(--card2);border:1px solid var(--border);border-radius:20px;padding:3px 9px;
font-size:11px;font-weight:800;color:var(--gold)}
.mod .tx{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5;
white-space:pre-wrap;max-height:64px;overflow:hidden;position:relative}
.mod.aberto .tx{max-height:none}
/* ---- Calculadora ---- */
.fab{position:fixed;right:18px;bottom:18px;width:56px;height:56px;border-radius:50%;
background:var(--green);border:none;color:#fff;font-size:23px;cursor:pointer;z-index:50;
box-shadow:0 6px 22px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
.fab:active{transform:scale(.94)}
.calc .res{background:var(--card2);border:1px solid var(--border);border-radius:13px;
padding:15px;margin-top:13px}
.calc .big{font-size:30px;font-weight:800;color:var(--green-l);line-height:1}
.calc .big small{font-size:13px;color:var(--muted);font-weight:700;display:block;margin-top:3px}
.calc .brk{display:flex;justify-content:space-between;font-size:12.5px;padding:7px 0;
border-bottom:1px solid var(--border);font-weight:600}
.calc .brk:last-child{border-bottom:none}
.calc .brk span:last-child{font-weight:800}
.calc .brk.tot span{color:var(--gold)}
.calc .al{background:rgba(224,112,112,.12);border:1px solid #e07070;color:#e07070;
border-radius:9px;padding:10px;font-size:12px;font-weight:700;margin-top:11px;line-height:1.45}
.plano{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:14px;
margin-bottom:9px;cursor:pointer;transition:.16s}
.plano:hover{border-color:var(--gold)}
.plano.sel{border-color:var(--green-l);background:var(--card2)}
.plano .ph{display:flex;align-items:center;gap:9px}
.plano .pn{font-size:14.5px;font-weight:800;flex:1}
.plano .pp{font-size:19px;font-weight:800;color:var(--green-l)}
.plano .pp small{font-size:11px;color:var(--muted);font-weight:700}
.plano .pd{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.5;font-weight:600}

/* ---- Indicações ---- */
.funil{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none}
.funil::-webkit-scrollbar{display:none}
.fcol{flex:0 0 auto;background:var(--card);border:1px solid var(--border);border-radius:12px;
padding:11px 14px;min-width:96px;cursor:pointer;transition:.16s}
.fcol:hover{border-color:var(--gold)}
.fcol.on{border-color:var(--gold);background:var(--card2)}
.fcol .n{font-size:21px;font-weight:800;line-height:1}
.fcol .l{font-size:10px;color:var(--muted);font-weight:700;margin-top:4px;white-space:nowrap}
.icard{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:13px;
margin-bottom:9px;border-left:3px solid var(--gold)}
.icard.fech{border-left-color:var(--green-l)}
.icard.perd{border-left-color:#e07070;opacity:.72}
.icard .t1{display:flex;align-items:flex-start;gap:9px}
.icard .nm{font-size:15px;font-weight:800;flex:1;line-height:1.25}
.icard .cod{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.5px;
background:var(--card2);border:1px solid var(--border);border-radius:6px;padding:3px 7px;white-space:nowrap}
.icard .via{font-size:12px;color:var(--muted);margin-top:5px;font-weight:600}
.icard .via b{color:var(--txt)}
.icard .vl{font-size:17px;font-weight:800;color:var(--green-l);margin-top:7px}
.icard .vl small{font-size:11px;color:var(--muted);font-weight:700}
.icard .st{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.icard select{background:var(--card2);border:1px solid var(--border);color:var(--txt);
border-radius:8px;padding:7px 9px;font-family:inherit;font-size:12px;font-weight:700}
.icard .bt{background:var(--card2);border:1px solid var(--border);color:var(--muted);
border-radius:8px;padding:7px 11px;font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer}
.icard .bt:hover{border-color:var(--gold);color:var(--gold)}
.icard .bt.pg{border-color:var(--green);color:var(--green-l)}
.icard .bt.pago{background:rgba(88,184,104,.12);border-color:var(--green-l);color:var(--green-l);cursor:default}
.rank{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px;
margin-bottom:7px;display:flex;align-items:center;gap:11px}
.rank .pos{font-size:15px;font-weight:800;color:var(--muted);min-width:22px}
.rank .inf{flex:1}
.rank .nm{font-size:13.5px;font-weight:800;line-height:1.25}
.rank .sb{font-size:11px;color:var(--muted);margin-top:3px;font-weight:600}
.rank .vl{font-size:14px;font-weight:800;color:var(--green-l)}

/* ---- Régua ---- */
.fbar{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--gold);
border-radius:11px;padding:10px 13px;margin-bottom:12px;font-size:13px;flex-wrap:wrap}
.fbar .ic{font-size:15px}
.fbar b{font-weight:800;color:var(--txt)}
.fbar .qt{color:var(--muted);font-weight:700;font-size:12px}
.fbar button{margin-left:auto;background:var(--card2);border:1px solid var(--border);
color:var(--muted);border-radius:8px;padding:6px 11px;font-family:inherit;font-size:11.5px;
font-weight:800;cursor:pointer;white-space:nowrap}
.fbar button:hover{border-color:var(--gold);color:var(--gold)}
.plnav{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.plnav button{background:var(--card);border:1px solid var(--border);color:var(--muted);
border-radius:10px;padding:9px 14px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.plnav button.on{background:var(--card2);border-color:var(--gold);color:var(--txt)}
.plpot{background:linear-gradient(135deg,var(--card2),var(--card));border:1px solid var(--gold);
border-radius:14px;padding:18px;margin:12px 0}
.plpot .lb{font-size:10.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.plpot .big{font-size:30px;font-weight:800;color:var(--gold);margin-top:7px;line-height:1;letter-spacing:-1px}
.plpot .big small{font-size:14px;color:var(--muted);font-weight:700}
.plpot .sb{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.45}
.plpot .cen{display:flex;gap:9px;margin-top:14px}
.plpot .cen div{flex:1;background:rgba(0,0,0,.18);border-radius:10px;padding:10px;text-align:center}
.plpot .cen div.mid{border:1px solid var(--gold)}
.plpot .cen b{display:block;font-size:15px;font-weight:800}
.plpot .cen span{display:block;font-size:10.5px;color:var(--muted);margin-top:3px}
.ondag{display:flex;gap:7px;align-items:flex-end;margin-top:11px;min-height:130px}
.ob{flex:1;text-align:center;display:flex;flex-direction:column;justify-content:flex-end}
.ob .bar{background:linear-gradient(180deg,var(--gold),rgba(245,166,35,.35));border-radius:6px 6px 0 0;min-height:8px}
.ob .q{font-size:15px;font-weight:800;margin-top:6px}
.ob .m{font-size:10.5px;color:var(--muted);font-weight:700}
.ob .v{font-size:9.5px;color:var(--green-l);font-weight:700;margin-top:2px}
.pltbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:9px}
.pltbl th{text-align:left;color:var(--muted);font-size:10.5px;text-transform:uppercase;
letter-spacing:.8px;padding-bottom:6px;font-weight:800}
.pltbl th.num,.pltbl td.num{text-align:right}

  if(VISAO==='planos'){
    document.getElementById('app').innerHTML=h+'<div id="plbox"><div class="center"><div class="spin"></div>Carregando planos...</div></div>';
    carregarPlanos();

    document.getElementById('app').innerHTML=h+'<div id="brbox"><div class="center"><div class="spin"></div>Carregando brindes...</div></div>';
    carregarBrindes();
    return;
  }
  if(VISAO==='jornada'){
    h+=renderJornada();
    document.getElementById('app').innerHTML=h;
    setTimeout(ligaKb, 30);
    return;
  }
  let arr=cl.slice();
  if(FILTRO==='pendentes') arr=arr.filter(c=>c.pendentes>0);
  // NPS e aniversário só fazem sentido depois da ativação
  if(FILTRO==='sem_nps') arr=arr.filter(c=>c.ativo && c.nps==null);
  if(FILTRO==='sem_aniv') arr=arr.filter(c=>c.ativo && !c.nascimento_dia);
  if(FILTRO==='indicacao') arr=arr.filter(c=>c.pendentes>0);
  if(BUSCA){const b=BUSCA.toLowerCase();
    arr=arr.filter(c=>(c.cliente||'').toLowerCase().includes(b)||(c.contrato||'').includes(b));}

  h+=faixaFiltro(arr.length);

  if(!arr.length){
    h+=`<div class="vazio">Nenhum cliente com esse filtro.<br>Ajuste a busca ou escolha "Todos".</div>`;
  } else {
    h+='<div class="lista">'+arr.map(c=>{
      const n=c.nps;
      const cls=n==null?'vazio':(n>=9?'p':(n<=6?'d':''));

      if(c.cidade) bits.push('📍 '+esc(c.cidade));
      if(c.potencia_kwp) bits.push('⚡ '+String(c.potencia_kwp).replace('.',',')+' kWp');
      if(c.dias_ativo!=null) bits.push('☀️ '+c.dias_ativo+' dias ativo');
      if(c.vendedor) bits.push('👔 '+esc(c.vendedor));
      return `<button class="cli ${c.pendentes?'pend':''}" onclick="abrirFicha('${c.id}')">
        <div class="top">
          <div class="nome">${esc(c.cliente)}${c.contrato?` <span style="color:var(--muted);font-weight:600;font-size:12px">#${esc(c.contrato)}</span>`:''}</div>
          <div class="nota ${cls}">${n==null?'—':n}</div>
        </div>
        <div class="meta">${bits.join('<span style="opacity:.4">·</span>')}</div>
        <div style="margin-top:8px;display:flex;gap:5px;flex-wrap:wrap">
        ${c.pendentes?`<span class="tag gold">💬 ${c.pendentes} para tratar</span>`:''}
        ${(c.ativo && !c.nascimento_dia)?`<span class="tag">🎂 sem aniversário</span>`:''}
        ${!c.ativo?`<span class="tag" style="border-color:rgba(143,166,184,.4);color:var(--muted)">🏗️ em obra</span>`:''}
        </div>
      </button>`;
    }).join('')+'</div>';
  }
  document.getElementById('app').innerHTML=h;
}

/* ---------- PLANOS DE MANUTENÇÃO ---------- */
let PLN=null, PLSEL=null, PAI=null, PLABA='painel';

async function carregarPlanos(){
  const box=document.getElementById('plbox'); if(!box) return;
  const [r,pp]=await Promise.all([sb.rpc('get_planos_envio'), sb.rpc('get_painel_planos')]);
  PAI=pp&&pp.data?pp.data:null;
  if(r.error||!r.data){ box.innerHTML='<div class="vazio">Não foi possível carregar os planos.</div>'; return; }
  PLN=r.data;
  box.innerHTML=renderPlanos();
}

function planoCompletoPara(mods){
  const lista=(PLN.planos||[]).filter(p=>p.nivel===3);
  const m=Number(mods)||0;
  return lista.find(p=>m>=Number(p.mod_min||0) && m<=Number(p.mod_max||999)) || lista[lista.length-1];
}
function moedaBR(v){ return 'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2}); }

function rolaKb(dir){
  const el=document.getElementById('kbBox'); if(!el) return;
  el.scrollBy({left: dir*Math.round(el.clientWidth*0.8), behavior:'smooth'});
}
function ajustaSetasKb(){
  const el=document.getElementById('kbBox');
  const e=document.getElementById('kbEsq'), d=document.getElementById('kbDir');
  if(!el||!e||!d) return;
  const sobra = el.scrollWidth - el.clientWidth;
  if(sobra < 12){ e.classList.remove('on'); d.classList.remove('on'); return; }
  e.classList.toggle('on', el.scrollLeft > 8);
  d.classList.toggle('on', el.scrollLeft < sobra - 8);
}
function ligaKb(){
  const el=document.getElementById('kbBox'); if(!el) return;
  if(el.dataset.on) return;
  el.dataset.on='1';
  el.addEventListener('scroll', ajustaSetasKb, {passive:true});
  window.addEventListener('resize', ajustaSetasKb);
  ajustaSetasKb();
}
function setPlaba(v){ PLABA=v; document.getElementById('plbox').innerHTML=renderPlanos(); }

function renderPlanos(){
  const P=PLN.planos||[], C=PLN.clientes||[];
  let nav='<div class="plnav">'
    +'<button class="'+(PLABA==='painel'?'on':'')+'" onclick="setPlaba(\'painel\')">📊 Acompanhamento</button>'
    +'<button class="'+(PLABA==='envio'?'on':'')+'" onclick="setPlaba(\'envio\')">📤 Enviar proposta</button>'
    +'<button class="'+(PLABA==='fora'?'on':'')+'" onclick="setPlaba(\'fora\')">🏳️ Cliente de fora</button>'

   +'<div class="rgs"><div class="n">'+n(R.contratos)+'</div><div class="l">Contratos ativos</div></div>'
   +'<div class="rgs"><div class="n" style="color:var(--gold)">'+n(R.cortesias)+'</div><div class="l">Em cortesia</div></div>'
   +'<div class="rgs"><div class="n" style="color:var(--green-l)">'+n(R.pagos)+'</div><div class="l">Pagantes</div></div>'
   +'<div class="rgs"><div class="n">'+moedaBR(R.mrr)+'</div><div class="l">Receita mensal</div></div>'
   +'</div>';

  h+='<div class="plpot">'
   +'<div class="lb">Potencial da carteira</div>'
   +'<div class="big">'+moedaBR(PT.total_anual)+'<small>/ano</small></div>'
   +'<div class="sb">se os '+n(R.cortesias)+' clientes em cortesia assinarem o Completo do porte deles</div>'
   +'<div class="cen">'
   +'<div><b>'+moedaBR(PT.c20)+'</b><span>convertendo 20%</span></div>'
   +'<div class="mid"><b>'+moedaBR(PT.c30)+'</b><span>convertendo 30%</span></div>'
   +'<div><b>'+moedaBR(PT.c50)+'</b><span>convertendo 50%</span></div>'
   +'</div></div>';

  // a onda de vencimentos
  if(onda.length){
    const maxC=Math.max.apply(null,onda.map(function(x){return n(x.contratos);}));
    h+='<div class="sec"><h3>🌊 Onda de vencimentos</h3>'
     +'<div class="dica">Quando a cortesia de 1 ano termina. É a janela para converter.</div>'
     +'<div class="ondag">';
    onda.forEach(function(o){
      const alt=Math.round(n(o.contratos)/maxC*100);
      h+='<div class="ob"><div class="bar" style="height:'+Math.max(alt,8)+'%"></div>'
        +'<div class="q">'+n(o.contratos)+'</div>'
        +'<div class="m">'+esc(o.mes)+'</div>'
        +'<div class="v">'+moedaBR(o.potencial)+'</div></div>';
    });

  }

  // por porte
  if(portes.length){
    h+='<div class="sec"><h3>📐 Por porte do sistema</h3><table class="pltbl">'
     +'<tr><th>Porte</th><th class="num">Clientes</th><th class="num">Anual</th><th class="num">Potencial</th></tr>';
    portes.forEach(function(p){
      h+='<tr><td>'+esc(p.porte)+'</td><td class="num">'+n(p.clientes)+'</td>'
        +'<td class="num">'+moedaBR(p.anual)+'</td>'
        +'<td class="num"><b>'+moedaBR(p.potencial)+'</b></td></tr>';
    });
    h+='</table></div>';
  }

  // quem vence primeiro
  const prox=L.slice(0,12);
  h+='<div class="sec"><h3>⏳ Vencem primeiro</h3>';
  prox.forEach(function(c){
    const d=n(c.dias);
    const cor = d<0?'#e07070':(d<=60?'var(--gold)':'var(--muted)');
    h+='<div class="chkline" onclick="irEnviar(\''+c.obra_id+'\')">'
      +'<div class="cn"><b>'+esc(c.cliente)+'</b>'
      +'<span>'+(c.modulos||'?')+' módulos · vence '+dataBR(c.fim)
      +' · <span style="color:'+cor+'">'+(d<0?'venceu':'em '+d+' dias')+'</span></span></div>'
      +'<span style="font-size:12px;font-weight:800;color:var(--green-l)">'+moedaBR(c.completo_anual)+'</span>'
      +'<span style="color:var(--muted)">›</span></div>';
  });
  h+='</div>';
  return h;
}

function previaPlano(){

  let h='<div class="plprev">';

function copiarPlano(){
  const c=(PLN.clientes||[]).find(function(x){return x.id===PLSEL;});
  if(!c) return;
  const t=textoPlano(c.cliente,c.modulos);
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(function(){ toast('Mensagem copiada ✓'); });
  else toast('Selecione o texto e copie');
}

async function enviarPlano(){
  const c=(PLN.clientes||[]).find(function(x){return x.id===PLSEL;});
  if(!c||!c.grupo) return;
  if(!confirm('Enviar a proposta de planos no grupo de '+c.cliente+'?')) return;
  const t=textoPlano(c.cliente,c.modulos);
  try{
    const { data:sess } = await sb.auth.getSession();
    const r=await fetch(SUPABASE_URL+'/functions/v1/notificar-grupo',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+sess.session.access_token},
      body:JSON.stringify({grupo_id:c.grupo, message:t})
    });
    const res=await r.json().catch(function(){return {};});
    if(!r.ok||res.error){ toast('Erro ao enviar: '+(res.error||r.status)); return; }
    toast('📤 Proposta enviada para '+c.cliente);
  }catch(e){ toast('Falha de conexão'); }
}

async function carregarBrindes(){
  var box=document.getElementById('brbox'); if(!box) return;

function renderBrindes(){

  var b=(BUSCA||'').toLowerCase();

    return (x.cliente||'').toLowerCase().indexOf(b)>=0 || (x.voucher||'').toLowerCase().indexOf(b)>=0;});
  var pend=arr.filter(function(x){return !x.entregue_em;});
  var ent=arr.filter(function(x){return !!x.entregue_em;});
  var semG=arr.filter(function(x){return !x.avaliou_google_em;});

  var h='<div class="rgstat">'+
    bcard('',arr.length,'Brindes solicitados','')+
    bcard('pend',pend.length,'A entregar','var(--gold)')+
    bcard('ent',ent.length,'Entregues','var(--green-l)')+
    bcard('semg',semG.length,'Sem avaliação no Google','#e07070')+
  '</div>';
  if(BRF==='pend') arr=pend;
  else if(BRF==='ent') arr=ent;
  else if(BRF==='semg') arr=semG;

async function abrirFicha(id){
  const ov=document.getElementById('ov'), f=document.getElementById('ficha');
  f.innerHTML='<div class="center"><div class="spin"></div>Abrindo ficha...</div>';
  ov.classList.add('on');
  const r=await sb.rpc('get_ficha_cliente',{p_obra:id});
  if(r.error||!r.data||r.data.erro){
    f.innerHTML=`<div class="center"><span class="i">🔒</span>${(r.data&&r.data.erro)||'Não foi possível abrir.'}</div>`;

async function carregarRegua(){
  const r=await sb.rpc('get_regua_painel');

  }

let RGF='';
function setRgf(k){ RGF=(RGF===k?'':k); renderRegua(); }
function listaRgf(){
  const fila=RG.fila||[], ult=RG.ultimos||[];
  const hj=new Date().toISOString().slice(0,10);
  let arr=[], tit='';
  if(RGF==='hoje'){ arr=fila.filter(f=>f.quando<=hj && !f.bloqueio); tit='Para enviar hoje'; }
  else if(RGF==='prox'){
    const lim=new Date(Date.now()+7*864e5).toISOString().slice(0,10);
    arr=fila.filter(f=>f.quando>hj && f.quando<=lim); tit='Próximos 7 dias'; }
  else if(RGF==='bloq'){ arr=fila.filter(f=>!!f.bloqueio); tit='Bloqueados'; }
  else if(RGF==='env'){ arr=ult.slice(); tit='Enviados nos últimos 30 dias'; }
  else if(RGF==='todos'){ arr=fila.slice(); tit='Todos na régua'; }

  let h='<div class="sec" style="border-color:var(--gold)">'+
    '<h3 style="display:flex;align-items:center;gap:8px">'+esc(tit)+' — '+arr.length+
    '<button class="stb" style="margin-left:auto" onclick="setRgf(\''+RGF+'\')">✕ fechar</button></h3>';
  if(!arr.length) h+='<div class="vazio">Nenhum cliente aqui.</div>';
  for(let i=0;i<arr.length;i++){
    const f=arr[i];
    const quando = f.enviado_em ? dataBR(f.enviado_em)
                 : (f.quando<=hj ? 'hoje' : dataBR(f.quando));
    const clic = !!f.obra_id;
    h+='<div class="chkline"'+(clic?' onclick="abrirFicha(\''+f.obra_id+'\')"':' style="cursor:default"')+'>'+
      '<span style="font-size:19px;flex-shrink:0">'+(f.icone||'📨')+'</span>'+
      '<div class="cn"><b>'+esc(f.cliente)+'</b><span>'+esc(f.nome_modelo||f.modelo||'')+
      ' · '+esc(quando||'')+(f.bloqueio?' · ⚠️ '+esc(f.bloqueio):'')+'</span></div>'+
      (clic?'<span style="color:var(--muted);font-size:15px">›</span>':'')+'</div>';
  }
  if(RGF==='env') h+='<div class="dica">Mostra os 15 envios mais recentes.</div>';
  return h+'</div>';
}
function renderRegua(){
  const R=RG.resumo||{}, fila=RG.fila||[], ult=RG.ultimos||[];
  const hoje=fila.filter(f=>f.quando<=new Date().toISOString().slice(0,10));
  const prox=fila.filter(f=>f.quando>new Date().toISOString().slice(0,10));

  let h='';
  if(RG.pode_agir){
    h+=`<div class="liga">
      <div class="txt">
        <div class="tt">${RG.ativa?'✅ Régua ativa':'⏸️ Régua pausada'}</div>
        <div class="sb">${RG.ativa
          ? `Envia até ${RG.por_dia} contatos por dia útil, às 11h. Cada envio respeita 6 segundos de intervalo.`
          : 'Nenhum contato está sendo enviado automaticamente. Você ainda pode disparar manualmente abaixo.'}</div>
      </div>
      <label class="sw"><input type="checkbox" ${RG.ativa?'checked':''} onchange="ligarRegua(this.checked)"><span class="tr"></span></label>
    </div>`;
  }

  h+=`<div id="optbox"></div>`;
  h+=`<div class="rgstat">
    <button class="rgs ${R.hoje?'hot':''} ${RGF==='hoje'?'sel':''}" onclick="setRgf('hoje')"><div class="n">${R.hoje||0}</div><div class="l">Para enviar hoje</div></button>
    <button class="rgs ${RGF==='prox'?'sel':''}" onclick="setRgf('prox')"><div class="n">${R.proximos7||0}</div><div class="l">Próximos 7 dias</div></button>
    <button class="rgs ${R.bloqueados?'blk':''} ${RGF==='bloq'?'sel':''}" onclick="setRgf('bloq')"><div class="n">${R.bloqueados||0}</div><div class="l">Bloqueados</div></button>
    <button class="rgs ${RGF==='env'?'sel':''}" onclick="setRgf('env')"><div class="n">${R.enviados_30d||0}</div><div class="l">Enviados em 30 dias</div></button>
    <button class="rgs ${RGF==='todos'?'sel':''}" onclick="setRgf('todos')"><div class="n">${R.clientes_na_regua||0}</div><div class="l">Clientes na régua</div></button>
  </div>`;
  if(RGF) h+=listaRgf();

  if(hoje.length){
    h+=`<div class="sec"><h3>Para enviar hoje</h3>`+hoje.map(f=>linhaRegua(f,true)).join('')+`</div>`;
  } else {
    h+=`<div class="vazio">Nada para enviar hoje. 👏</div>`;
  }

  if(prox.length){
    h+=`<div class="sec"><h3>Próximos dias</h3>`+prox.slice(0,20).map(f=>linhaRegua(f,false)).join('')+`</div>`;
  }

  if(ult.length){
    h+=`<div class="sec"><h3>Últimos enviados</h3>`+ult.map(u=>{
      const d=new Date(u.enviado_em);
      return `<div class="rgrow"><div class="l1"><span class="ic">${u.icone||'📬'}</span>
        <span class="cl">${esc(u.cliente)}</span>
        <span class="qd">${d.toLocaleDateString('pt-BR')}</span></div>
        <div class="mo">${esc(u.nome_modelo)}</div></div>`;
    }).join('')+`</div>`;
  }

  document.getElementById('rgbox').innerHTML=h;
  carregarOptin();
}

function renderOptin(){

      ${o.recusados?`<span class="tag red">✕ ${o.recusados} recusaram</span>`:''}
    </div>
    ${(o.pode_agir && o.nunca_pedido)?`<div style="display:flex;gap:7px;flex-wrap:wrap">
      <button class="mini" style="flex:1" onclick="verTextoOptin()">👁️ ver o texto</button>
      <button class="mini" style="flex:1;border-style:solid;border-color:var(--green);color:var(--green-l)"

function verTextoOptin(){
  const el=document.getElementById('optxt');
  if(el.innerHTML){ el.innerHTML=''; return; }
  el.innerHTML=`<div class="prev">${esc((OPT.texto||'').replace(/\{nome\}/g,'Mario'))}</div>

}
async function dispararOptin(){
  const q=Math.min(OPT.por_dia, OPT.nunca_pedido);
  if(!confirm(`Enviar o pedido de autorização para ${q} cliente(s)?\n\nSão os que ainda não receberam. Cada envio tem 7 segundos de intervalo.`)) return;
  toast('Enviando pedidos...');
  const r=await sb.functions.invoke('campanha-optin',{body:{}});
  if(r.error||(r.data&&r.data.error)){ toast('Erro: '+((r.data&&r.data.error)||r.error.message)); return; }
  toast(`${r.data.enviados} pedido(s) enviado(s) ✓`);
  carregarOptin();
}
function linhaRegua(f, ehHoje){
  const q=f.quando.split('-');
  const lim=f.data_limite.split('-');
  return `<div class="rgrow ${f.bloqueio?'bloq':(ehHoje?'hoje':'')}" id="rg${f.id}">
    <div class="l1"><span class="ic">${f.icone||'📬'}</span>
      <span class="cl">${esc(f.cliente)}${f.contrato?` <span style="color:var(--muted);font-weight:600;font-size:11.5px">#${esc(f.contrato)}</span>`:''}</span>
      <span class="qd">${ehHoje?'hoje':q[2]+'/'+q[1]}</span></div>
    <div class="mo">${esc(f.nome_modelo)} · ${f.dias_ativo} dias de ativo · janela até ${lim[2]}/${lim[1]}</div>
    ${f.bloqueio?`<div class="bq">⚠️ ${esc(f.bloqueio)}</div>`:''}
    ${RG.pode_agir?`<div class="ac">
      <button onclick="previaRegua(${f.id})">👁️ ver texto</button>
      ${!f.bloqueio?`<button class="go" onclick="enviarRegua(${f.id},'${esc(f.cliente)}')">📤 enviar agora</button>`:''}
      <button onclick="adiarRegua(${f.id})">⏰ adiar 7 dias</button>
      <button onclick="cancelarRegua(${f.id})">✕ cancelar</button>
    </div>`:''}
    <div id="pv${f.id}"></div>
  </div>`;
}
async function ligarRegua(v){
  if(v && !confirm('Ativar a régua?\n\nA partir de agora o sistema envia automaticamente os contatos programados, todo dia útil às 11h.')){
    renderRegua(); return;
  }
  const r=await sb.from('config').update({valor:v?'1':'0'}).eq('chave','regua_ativa');
  if(r.error){ toast('Erro ao salvar'); return; }
  toast(v?'Régua ativada ✅':'Régua pausada');

}
async function previaRegua(id){
  const el=document.getElementById('pv'+id);

async function enviarRegua(id, cliente){
  if(!confirm('Enviar este contato para '+cliente+' agora?')) return;

async function adiarRegua(id){

  toast('Adiado por 7 dias');

async function cancelarRegua(id){
  if(!confirm('Cancelar este contato?\n\nEle não será enviado a este cliente.')) return;

}

    <div class="rgs ${R.a_pagar>0?'hot':''}"><div class="n">R$ ${Math.round(R.a_pagar||0)}</div><div class="l">A pagar</div></div>
    <div class="rgs"><div class="n">R$ ${Math.round(R.pago_total||0)}</div><div class="l">Já pago</div></div>
    <div class="rgs"><div class="n">${R.conversao!=null?R.conversao+'%':'—'}</div><div class="l">Taxa de conversão</div></div>
  </div>`;

  if(IND.pode_agir){
    h+=`<button class="mini" style="margin-bottom:12px" onclick="formIndic()">➕ Registrar indicação manualmente</button><div id="fin"></div>`;
  }

  let arr=L.slice();
  if(IFILTRO==='andamento') arr=arr.filter(i=>['contatada','visita_agendada','visita_feita','proposta'].includes(i.status));
  else if(IFILTRO) arr=arr.filter(i=>i.status===IFILTRO);

  if(!arr.length){
    h+=`<div class="vazio">Nenhuma indicação ${IFILTRO?'neste status':'registrada ainda'}.<br>
      <span style="font-size:11.5px;opacity:.8">Quando um cliente indicar alguém no grupo, ela aparece aqui automaticamente.</span></div>`;
  } else {
    h+='<div class="sec"><h3>Indicações</h3>'+arr.map(i=>cardIndic(i)).join('')+'</div>';
  }

  if(RK.length){
    h+='<div class="sec"><h3>🏆 Ranking de indicadores</h3>'+RK.map((r,ix)=>`
      <div class="rank"><div class="pos">${ix+1}º</div>
        <div class="inf"><div class="nm">${r.icone||''} ${esc(r.cliente)}</div>
        <div class="sb">${r.conversoes} fechada${r.conversoes!=1?'s':''} de ${r.total} · ${esc(r.nivel||'—')}</div></div>
        <div class="vl">R$ ${Math.round(r.ganhou||0)}</div>
      </div>`).join('')+'</div>';
  }

  document.getElementById('inbox').innerHTML=h;
}
function cardIndic(i){
  const s=ST[i.status]||{n:i.status,i:'•'};
  const cls=i.status==='fechada'?'fech':(i.status==='perdida'?'perd':'');
  const d=new Date(i.criado_em);
  let opts='';
  Object.keys(ST).forEach(k=>{ opts+=`<option value="${k}" ${k===i.status?'selected':''}>${ST[k].i} ${ST[k].n}</option>`; });
  return `<div class="icard ${cls}" id="ic${i.id}">
    <div class="t1"><span class="nm">${esc(i.nome_indicado)}</span><span class="cod">${esc(i.codigo)}</span></div>
    <div class="via">indicado por <b>${esc(i.indicador)}</b>${i.cidade?' · '+esc(i.cidade):''}</div>
    ${i.telefone_indicado?`<div class="via">📱 ${esc(i.telefone_indicado)}</div>`:''}
    ${i.vendedor?`<div class="via">👔 ${esc(i.vendedor)}</div>`:''}
    <div class="via" style="font-size:11px;opacity:.75">${d.toLocaleDateString('pt-BR')} · ${quando(i.criado_em)}${i.origem==='whatsapp'?' · detectada pela IA':''}</div>
    ${i.valor_previsto?`<div class="vl">R$ ${Number(i.valor_previsto).toFixed(2).replace('.',',')}
      ${i.bonus_clube_pct>0?`<small>(inclui +${i.bonus_clube_pct}% do Clube)</small>`:''}</div>`:''}
    ${i.motivo_perda?`<div class="via" style="color:#e07070">✕ ${esc(i.motivo_perda)}</div>`:''}
    ${IND.pode_agir?`<div class="st">
      <select onchange="mudarStatus(${i.id}, this.value)">${opts}</select>
      ${(i.telefone_indicado)?`<a class="bt" href="https://wa.me/55${String(i.telefone_indicado).replace(/\D/g,'')}" target="_blank" style="text-decoration:none">💬 WhatsApp</a>`:''}
      ${i.visita_em?`<button class="bt ${i.pago1?'pago':'pg'}" ${i.pago1?'':'onclick="pagarIndic('+i.id+',1)"'}>
        ${i.pago1?'✓ etapa 1 paga':'💰 pagar R$ 50'}</button>`:''}
      ${(i.status==='fechada'&&i.valor_etapa2)?`<button class="bt ${i.pago2?'pago':'pg'}" ${i.pago2?'':'onclick="pagarIndic('+i.id+',2)"'}>
        ${i.pago2?'✓ etapa 2 paga':'💰 pagar R$ '+Math.round(i.valor_etapa2)}</button>`:''}
    </div>`:''}
    <div id="fc${i.id}"></div>
  </div>`;
}
function setIF(f){ IFILTRO=(IFILTRO===f)?'':f; renderIndic(); }

async function mudarStatus(id, st){
  if(st==='fechada'){ formFechar(id); return; }
  if(st==='perdida'){
    const m=prompt('Por que a indicação foi perdida?\n(preço, escolheu outra empresa, desistiu...)');
    if(m===null) { renderIndic(); return; }
    const r=await sb.rpc('indicacao_status',{p_id:id,p_status:'perdida',p_motivo:m||null});
    if(r.error){ toast('Erro'); return; }
    toast('Registrado'); carregarIndic(); return;
  }
  const r=await sb.rpc('indicacao_status',{p_id:id,p_status:st});
  if(r.error||(r.data&&r.data.erro)){ toast('Erro ao atualizar'); return; }
  toast('Status atualizado ✓'); carregarIndic();
}
function formFechar(id){
  const el=document.getElementById('fc'+id);
  el.innerHTML=`<div class="reg">
    <div class="lin">
      <div class="cp"><label>Potência (kWp)</label><input type="number" id="fk${id}" step="0.01" placeholder="8.5"></div>
      <div class="cp"><label>Valor do contrato</label><input type="number" id="fv${id}" step="0.01" placeholder="18000"></div>
    </div>
    <button class="salvar" onclick="confirmarFechar(${id})">🎉 Confirmar fechamento</button>
    <div class="dica">A potência define a faixa da recompensa. O valor do contrato só é usado acima de 30 kWp (1,5%).</div>
  </div>`;
}
async function confirmarFechar(id){
  const k=document.getElementById('fk'+id).value;
  if(!k){ toast('Informe a potência'); return; }
  const v=document.getElementById('fv'+id).value;
  const r=await sb.rpc('indicacao_status',{p_id:id,p_status:'fechada',
    p_kwp:parseFloat(k), p_contrato:v?parseFloat(v):null});
  if(r.error||(r.data&&r.data.erro)){ toast('Erro'); return; }
  const c=r.data&&r.data.calculo;
  toast(c?`Fechada! Recompensa: R$ ${c.valor_total}`:'Fechada ✓');
  carregarIndic();
}
async function pagarIndic(id, etapa){
  if(!confirm('Confirmar que o PIX da etapa '+etapa+' foi enviado?')) return;
  const r=await sb.rpc('indicacao_pagar',{p_id:id,p_etapa:etapa});
  if(r.error){ toast('Erro'); return; }
  toast('Pagamento registrado ✓'); carregarIndic();
}
function formIndic(){
  const el=document.getElementById('fin');
  if(el.innerHTML){ el.innerHTML=''; return; }
  const cl=(DADOS&&DADOS.clientes)||[];
  const opts=cl.map(c=>`<option value="${c.id}">${esc(c.cliente)}</option>`).join('');
  el.innerHTML=`<div class="reg">
    <div class="cp" style="margin-bottom:9px"><label>Quem indicou</label>
      <select id="i_ind">${opts}</select></div>
    <div class="lin">
      <div class="cp"><label>Nome do indicado</label><input id="i_nome" placeholder="João da Silva"></div>
      <div class="cp"><label>Telefone</label><input id="i_fone" placeholder="18 99999-0000"></div>
    </div>
    <div class="cp" style="margin-bottom:9px"><label>Observação</label>
      <input id="i_obs" placeholder="vizinho, viu as placas..."></div>
    <button class="salvar" onclick="salvarIndic()">Registrar indicação</button>
  </div>`;
}
async function salvarIndic(){
  const ind=document.getElementById('i_ind').value;
  const nome=document.getElementById('i_nome').value.trim();
  if(!nome){ toast('Informe o nome do indicado'); return; }
  const r=await sb.rpc('registrar_indicacao',{
    p_indicador:ind, p_nome:nome,
    p_telefone:document.getElementById('i_fone').value.trim()||null,
    p_obs:document.getElementById('i_obs').value.trim()||null,
    p_origem:'manual'
  });
  if(r.error||(r.data&&r.data.erro)){ toast('Erro: '+((r.data&&r.data.erro)||r.error.message)); return; }
  toast('Indicação '+r.data.codigo+' registrada ✓');
  carregarIndic();
}


/* ===== CALCULADORA ===== */
let CALC_OBRA=null;
async function abrirCalc(obraId){
  CALC_OBRA=obraId||null;
  const ov=document.getElementById('ov'), f=document.getElementById('ficha');
  let pre={modulos:'',km:'',cliente:null};
  if(obraId){
    const d=await sb.rpc('dados_calculadora',{p_obra:obraId});
    if(d.data&&!d.data.erro) pre={modulos:d.data.modulos||'',km:d.data.km_estimado||'',
      cliente:d.data.cliente, assinatura:d.data.assinatura};
  }
  f.innerHTML=`<div class="fhead">
    <button class="fechar" onclick="fecharFicha()">✕</button>
    <div class="nome">🧮 Calculadora de serviços</div>
    <div class="meta">${pre.cliente?esc(pre.cliente):'Orçamento avulso'}</div>
  </div><div class="fbody calc">
    ${pre.assinatura?`<div class="dado" style="margin-bottom:14px;border-color:var(--green-l)">
      <div class="k">Plano ativo</div><div class="v" style="font-size:14px">${esc(pre.assinatura.nome)} · R$ ${pre.assinatura.valor}</div></div>`:''}
    <div class="reg" style="margin-top:0">
      <div class="lin">
        <div class="cp"><label>Módulos</label><input type="number" id="c_mod" value="${pre.modulos}" placeholder="15"></div>
        <div class="cp"><label>Distância (km)</label><input type="number" id="c_km" value="${pre.km}" placeholder="30"></div>
      </div>
      <div class="lin">
        <div class="cp"><label>Tipo</label><select id="c_tipo">
          <option value="preventiva">🔍 Preventiva (limpeza + inspeção)</option>
          <option value="corretiva">🔧 Corretiva (com problema)</option>
        </select></div>
        <div class="cp" style="max-width:110px"><label>Visitas na rota</label>
          <select id="c_rota"><option value="1">1</option><option value="2" selected>2</option>
          <option value="3">3</option><option value="4">4</option></select></div>
      </div>
      <button class="salvar" onclick="rodarCalc()">Calcular</button>
      <div class="dica">A rota divide o deslocamento. Agrupar visitas na mesma região aumenta bastante a margem.</div>
    </div>
    <div id="cres"></div>
    <div id="cplanos"></div>
  </div>`;
  ov.classList.add('on');
  if(pre.modulos) setTimeout(rodarCalc, 120);
}
async function rodarCalc(){
  const m=parseInt(document.getElementById('c_mod').value,10);
  if(!m){ toast('Informe a quantidade de módulos'); return; }
  const km=parseFloat(document.getElementById('c_km').value)||0;
  const tipo=document.getElementById('c_tipo').value;
  const rota=parseInt(document.getElementById('c_rota').value,10);

  const r=await sb.rpc('calcular_visita',{p_modulos:m,p_km:km,p_tipo:tipo,p_rota:rota});
  const el=document.getElementById('cres');
  if(r.error||!r.data){ el.innerHTML='<div class="vazio">Erro no cálculo.</div>'; return; }
  const d=r.data;
  if(d.sob_consulta){
    el.innerHTML=`<div class="res"><div class="big">Sob consulta<small>${d.modulos} módulos — acima da tabela</small></div>
      <div class="dica" style="margin-top:9px">Sistemas acima de 45 módulos exigem orçamento específico. Considere o custo de ${d.modulos} × R$ 15 = R$ ${d.modulos*15} de equipe, mais deslocamento.</div></div>`;
    return;
  }
  el.innerHTML=`<div class="res">
    <div class="big">R$ ${Number(d.preco_final).toFixed(2).replace('.',',')}<small>${esc(d.faixa_nome)} · ${d.tipo}</small></div>
    <div style="margin-top:14px">
      <div class="brk"><span>Equipe (${d.modulos} × R$ 15)</span><span>R$ ${Number(d.custo_equipe).toFixed(2)}</span></div>
      <div class="brk"><span>Deslocamento (${d.km} km ÷ ${d.rota} visitas)</span><span>R$ ${Number(d.custo_deslocamento).toFixed(2)}</span></div>
      <div class="brk"><span>Custo total</span><span>R$ ${Number(d.custo_total).toFixed(2)}</span></div>
      <div class="brk"><span>Preço de tabela</span><span>R$ ${Number(d.preco_tabela).toFixed(2)}</span></div>
      ${d.adicional_km>0?`<div class="brk"><span>Adicional de km</span><span>R$ ${Number(d.adicional_km).toFixed(2)}</span></div>`:''}
      <div class="brk tot"><span>Margem</span><span>R$ ${Number(d.margem).toFixed(2)} (${d.margem_pct}%)</span></div>
    </div>
    ${d.alerta?`<div class="al">⚠️ ${esc(d.alerta)}</div>`:''}
  </div>`;
  mostrarPlanos(m);
}
async function mostrarPlanos(mods){
  const r=await sb.rpc('planos_para',{p_modulos:mods});
  const el=document.getElementById('cplanos');
  if(r.error||!r.data||!r.data.length){ el.innerHTML=''; return; }
  el.innerHTML=`<div class="sec"><h3>Planos para este sistema</h3>`+r.data.map(p=>`
    <div class="plano" ${CALC_OBRA?`onclick="assinar('${p.codigo}','${esc(p.nome)}',${p.anual})"`:''}>
      <div class="ph"><span style="font-size:19px">${p.icone}</span>
        <span class="pn">${esc(p.nome)}</span>
        <span class="pp">${p.cortesia?'Cortesia':'R$ '+p.anual}<small>${p.cortesia?' 1º ano':'/ano'}</small></span></div>
      <div class="pd">${p.cortesia?'Solarz, relatório no app e alerta de falha — cortesia no primeiro ano.'
        :(p.visita?`Monitoramento ativo + <b>1 visita técnica anual com limpeza e laudo</b> · ${p.desconto}% de desconto em serviços · R$ ${p.mensal}/mês`
        :`Monitoramento por equipe, relatório mensal, suporte prioritário e auxílio com a concessionária · ${p.desconto}% de desconto · R$ ${p.mensal}/mês`)}</div>
    </div>`).join('')+
    (CALC_OBRA?'<div class="dica">Toque no plano para registrar a assinatura deste cliente.</div>':'')+
    `</div>`;
}
async function assinar(plano, nome, valor){
  if(!CALC_OBRA) return;
  const per=confirm(`Registrar o plano ${nome}?\n\nOK = anual (R$ ${valor})\nCancelar = escolher mensal`)?'anual':null;
  if(per===null){
    if(!confirm('Registrar como plano MENSAL?')) return;
  }
  const r=await sb.rpc('registrar_assinatura',{p_obra:CALC_OBRA,p_plano:plano,
    p_periodicidade:per||'mensal'});
  if(r.error||(r.data&&r.data.erro)){ toast('Erro: '+((r.data&&r.data.erro)||r.error.message)); return; }
  toast(`Plano registrado ✓ Vence em ${new Date(r.data.vencimento).toLocaleDateString('pt-BR')}`);
  fecharFicha();
}

boot();
</script>
</body>
</html>
