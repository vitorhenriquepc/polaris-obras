<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="theme-color" content="#011D2E">
<title>Polaris — Pós-venda</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;min-width:0}
html{overflow-x:hidden;width:100%}
body{overflow-x:hidden;width:100%;max-width:100vw;position:relative}
img,video,table{max-width:100%}
.wrap,.toolbar,.stats,.dchips,.cchips,.tools{max-width:100%}
:root{--navy:#011D2E;--green:#3B8B3B;--green-l:#58B868;--gold:#F5A623;
--bg:#0a1622;--card:#0f2233;--card2:#13293c;--border:#1d3850;--txt:#eaf2f8;--muted:#8fa6b8}
html[data-theme="light"]{--gold:#B8790A;--green-l:#3B8B3B;--bg:#F0F2ED;--card:#FFF;--card2:#F4F6F3;
--border:#DCE4EA;--txt:#022C44;--muted:#5F7787}
body{font-family:'Manrope',system-ui,sans-serif;background:
radial-gradient(1100px 560px at 82% -12%, rgba(12,60,90,.32) 0%, transparent 62%),var(--bg);
color:var(--txt);min-height:100vh;transition:background .3s;-webkit-font-smoothing:antialiased}

/* ---- Topbar com abas ---- */
.topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;
background:rgba(1,29,46,.88);backdrop-filter:blur(10px);
position:sticky;top:0;z-index:40;border-bottom:1px solid var(--border)}
html[data-theme="light"] .topbar{background:rgba(255,255,255,.9)}
.topbar img{height:26px}
.tabs{display:flex;gap:4px;background:var(--card2);border-radius:12px;padding:3px}
.tab{background:none;border:none;color:var(--muted);border-radius:9px;padding:8px 14px;
font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;
display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:.18s}
.tab:hover{color:var(--txt)}
.tab.on{background:var(--card);color:var(--gold);box-shadow:0 1px 6px rgba(0,0,0,.18)}
.tbrow{display:flex;align-items:center;gap:10px;width:100%;flex-wrap:wrap}
.tbacts{margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:0}
.ver{font-size:9.5px;color:var(--muted);opacity:.55;font-weight:700;white-space:nowrap}
@media(max-width:640px){.ver{display:none}}
.who{font-size:11px;color:var(--muted);font-weight:600;max-width:150px;
overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-out{background:none;border:1px solid var(--border);color:var(--muted);border-radius:9px;
padding:6px 10px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-out:hover{border-color:var(--gold);color:var(--gold)}

.wrap{max-width:1240px;margin:0 auto;padding:18px 16px 60px}

/* ---- Hero: o que precisa de você ---- */
.hero{background:var(--card);border:1px solid var(--border);border-radius:18px;
padding:20px;margin-bottom:16px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
background:linear-gradient(180deg,var(--gold),var(--green))}
.hero .eyebrow{font-size:10.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;
color:var(--muted)}
.hero h1{font-size:20px;font-weight:800;margin-top:6px;line-height:1.25}
.hero .sub{font-size:13px;color:var(--muted);margin-top:6px;font-weight:600}
.pend{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}
.pcard{flex:1 1 160px;background:var(--card2);border:1px solid var(--border);border-radius:13px;
padding:13px;cursor:pointer;transition:.18s;text-align:left;font-family:inherit;color:var(--txt)}
.pcard:hover{border-color:var(--gold);transform:translateY(-2px)}
.pcard .n{font-size:26px;font-weight:800;line-height:1}
.pcard .l{font-size:11px;color:var(--muted);font-weight:700;margin-top:5px;line-height:1.35}
.pcard.alerta .n{color:var(--gold)}
.pcard.ok .n{color:var(--green-l)}

/* ---- Busca e lista ---- */
.tools{display:flex;gap:8px;margin:16px 0 12px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:var(--card);
border:1px solid var(--border);border-radius:11px;padding:0 12px}
.search input{flex:1;background:none;border:none;outline:none;color:var(--txt);
font-family:inherit;font-size:14px;padding:11px 0}
.chip{background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:20px;
padding:8px 13px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.chip:hover{border-color:var(--gold)}
.chip.on{border-color:var(--gold);color:var(--gold);background:var(--card2)}

.lista{display:grid;gap:9px}
@media(min-width:900px){.lista{grid-template-columns:1fr 1fr}}
.cli{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;
cursor:pointer;transition:.18s;text-align:left;font-family:inherit;color:var(--txt);width:100%;
display:block;position:relative}
.cli:hover{border-color:var(--gold);transform:translateY(-2px)}
.cli.pend{border-left:3px solid var(--gold)}
.cli .top{display:flex;align-items:flex-start;gap:9px}
.cli .nome{font-size:15px;font-weight:800;line-height:1.25;flex:1}
.cli .meta{font-size:11.5px;color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 10px;font-weight:600}
.nota{flex-shrink:0;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;
justify-content:center;font-size:14px;font-weight:800;background:var(--card2);border:1px solid var(--border)}
.nota.p{color:var(--green-l);border-color:var(--green-l)}
.nota.d{color:#e07070;border-color:#e07070}
.nota.vazio{color:var(--muted);font-size:16px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;
letter-spacing:.5px;text-transform:uppercase;border-radius:20px;padding:3px 8px;
background:var(--card2);border:1px solid var(--border);color:var(--muted)}
.tag.gold{border-color:var(--gold);color:var(--gold)}
.tag.green{border-color:var(--green-l);color:var(--green-l)}
.tag.red{border-color:#e07070;color:#e07070}

/* ---- Ficha (drawer) ---- */
.ov{position:fixed;inset:0;background:rgba(0,10,20,.72);backdrop-filter:blur(4px);
z-index:60;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.ficha{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:760px;
max-height:94vh;overflow-y:auto;border:1px solid var(--border);border-bottom:none}
@media(min-width:700px){.ov{align-items:center}.ficha{border-radius:20px;border-bottom:1px solid var(--border)}}
.fhead{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--border);
padding:18px 20px;z-index:2}
.fhead .nome{font-size:19px;font-weight:800;line-height:1.2;padding-right:36px}
.fhead .meta{font-size:12px;color:var(--muted);margin-top:6px;font-weight:600;
display:flex;flex-wrap:wrap;gap:4px 12px}
.fechar{position:absolute;top:16px;right:16px;background:var(--card2);border:1px solid var(--border);
color:var(--muted);width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:15px;font-family:inherit}
.fbody{padding:18px 20px 30px}
.sec{margin-bottom:22px}
.sec h3{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;
color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec h3::after{content:'';flex:1;height:1px;background:var(--border)}

.dados{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.dado{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:11px}
.dado .k{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.dado .v{font-size:15px;font-weight:800;margin-top:3px}
.dado .v small{font-size:11px;color:var(--muted);font-weight:700}

/* trilha — o elemento assinatura */
.trilha{position:relative;padding-left:26px}
.trilha::before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:2px;
background:linear-gradient(180deg,var(--gold),var(--green),var(--border))}
.ev{position:relative;padding-bottom:16px}
.ev::before{content:'';position:absolute;left:-22px;top:4px;width:10px;height:10px;
border-radius:50%;background:var(--card);border:2px solid var(--border)}
.ev.on::before{border-color:var(--gold);background:var(--gold)}
.ev.cli::before{border-color:var(--green-l);background:var(--green-l)}
.ev .quando{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.4px}
.ev .oque{font-size:13.5px;font-weight:700;margin-top:2px;line-height:1.4}
.ev .txt{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.5;
background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 11px;font-weight:600}
.ev .txt b{color:var(--txt)}

.vazio{color:var(--muted);text-align:center;padding:26px 14px;font-size:13px;
background:var(--card);border:1px dashed var(--border);border-radius:13px;line-height:1.6}
.reg{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:14px;margin-top:8px}
.reg .lin{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:9px}
.reg .cp{flex:1;min-width:96px}
.reg label{display:block;font-size:10px;color:var(--muted);font-weight:700;
text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.reg input,.reg select,.reg textarea{width:100%;background:var(--card2);border:1px solid var(--border);
color:var(--txt);border-radius:9px;padding:10px;font-family:inherit;font-size:14px;outline:none}
.reg input:focus,.reg select:focus,.reg textarea:focus{border-color:var(--gold)}
.reg .chk{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;cursor:pointer;
padding:8px 0}
.reg .chk input{width:19px;height:19px;accent-color:var(--green)}
.reg .salvar{width:100%;background:var(--green);border:none;color:#fff;border-radius:10px;
padding:12px;font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer;margin-top:4px}
.reg .salvar:active{transform:scale(.99)}
.reg .dica{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.45;font-weight:600}
.mini{background:none;border:1px dashed var(--border);color:var(--muted);border-radius:9px;
padding:8px 12px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;width:100%}
.mini:hover{border-color:var(--gold);color:var(--gold)}
.gtab{width:100%;font-size:12px;border-collapse:collapse;margin-top:8px}
.gtab th{text-align:left;font-size:9.5px;color:var(--muted);text-transform:uppercase;
letter-spacing:.5px;padding:6px 5px;border-bottom:1px solid var(--border);font-weight:800}
.gtab td{padding:7px 5px;border-bottom:1px solid var(--border);font-weight:600}
.gtab tr:last-child td{border-bottom:none}
.gtab .num{text-align:right}
.rgstat{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.rgstat .b{flex:1;min-width:110px;background:var(--card);border:1px solid var(--border);
border-radius:12px;padding:12px}
.rgstat .b .n{font-size:22px;font-weight:800;line-height:1}
.rgstat .b .l{font-size:10.5px;color:var(--muted);font-weight:700;margin-top:4px}
.switch{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--border);
border-radius:13px;padding:14px;margin-bottom:14px}
.switch .info{flex:1}
.switch .tt{font-size:14px;font-weight:800}
.switch .ds{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.sw{width:52px;height:29px;border-radius:20px;background:var(--border);border:none;cursor:pointer;
position:relative;flex-shrink:0;transition:.22s}
.sw.on{background:var(--green)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;
background:#fff;transition:.22s}
.sw.on::after{transform:translateX(23px)}
.rgrow{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--border);
border-radius:12px;padding:12px;margin-bottom:7px}
.rgrow.hoje{border-left:3px solid var(--gold)}
.rgrow.bloq{opacity:.6;border-left:3px solid #e07070}
.rgrow .ic{font-size:19px;flex-shrink:0}
.rgrow .cn{flex:1;min-width:0}
.rgrow .cn b{display:block;font-size:13.5px;line-height:1.3}
.rgrow .cn span{font-size:11px;color:var(--muted);font-weight:600}
.rgrow .qd{font-size:11px;font-weight:800;color:var(--muted);text-align:right;flex-shrink:0}
.mod{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:7px}
.mod .top{display:flex;align-items:center;gap:9px}
.mod .top b{flex:1;font-size:13.5px}
.mod .dia{background:var(--card2);border:1px solid var(--border);border-radius:20px;padding:3px 9px;
font-size:11px;font-weight:800;color:var(--gold)}
.mod .tx{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5;
white-space:pre-wrap;max-height:64px;overflow:hidden;position:relative}
.mod.aberto .tx{max-height:none}
/* ---- Régua ---- */
.rgstat{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.rgs{flex:1 1 100px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px}
.rgs .n{font-size:22px;font-weight:800;line-height:1}
.rgs .l{font-size:10px;color:var(--muted);font-weight:700;margin-top:4px;line-height:1.3}
.rgs.hot{border-color:var(--gold)}.rgs.hot .n{color:var(--gold)}
.rgs.blk{border-color:#e07070}.rgs.blk .n{color:#e07070}
.liga{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--border);
border-radius:13px;padding:13px;margin-bottom:14px}
.liga .txt{flex:1}
.liga .tt{font-size:13.5px;font-weight:800}
.liga .sb{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.sw{position:relative;width:50px;height:28px;flex-shrink:0;cursor:pointer}
.sw input{opacity:0;width:0;height:0}
.sw .tr{position:absolute;inset:0;background:var(--border);border-radius:28px;transition:.25s}
.sw .tr:before{content:'';position:absolute;height:22px;width:22px;left:3px;bottom:3px;
background:var(--muted);border-radius:50%;transition:.25s}
.sw input:checked + .tr{background:rgba(88,184,104,.25)}
.sw input:checked + .tr:before{transform:translateX(22px);background:var(--green-l)}
.rgrow{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;
margin-bottom:8px;border-left:3px solid var(--border)}
.rgrow.hoje{border-left-color:var(--gold)}
.rgrow.bloq{border-left-color:#e07070;opacity:.82}
.rgrow .l1{display:flex;align-items:flex-start;gap:9px}
.rgrow .ic{font-size:17px;line-height:1.2}
.rgrow .cl{font-size:14px;font-weight:800;flex:1;line-height:1.3}
.rgrow .qd{font-size:10.5px;color:var(--muted);font-weight:700;white-space:nowrap}
.rgrow .mo{font-size:12px;color:var(--muted);font-weight:600;margin-top:4px;padding-left:26px}
.rgrow .bq{font-size:11.5px;color:#e07070;font-weight:700;margin-top:6px;padding-left:26px}
.rgrow .ac{display:flex;gap:6px;margin-top:9px;padding-left:26px;flex-wrap:wrap}
.rgrow .ac button{background:var(--card2);border:1px solid var(--border);color:var(--muted);
border-radius:8px;padding:6px 11px;font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer}
.rgrow .ac button:hover{border-color:var(--gold);color:var(--gold)}
.rgrow .ac button.go{border-color:var(--green);color:var(--green-l)}
.prev{background:var(--card2);border:1px solid var(--border);border-radius:11px;padding:12px;
margin-top:9px;font-size:12.5px;line-height:1.55;white-space:pre-wrap;color:var(--txt);font-weight:500}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ac{flex:1;min-width:130px;background:var(--card2);border:1px solid var(--border);color:var(--txt);
border-radius:11px;padding:11px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;
display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.ac:hover{border-color:var(--gold);color:var(--gold)}
.ac.pri{background:var(--green);border-color:var(--green);color:#fff}
.ac.pri:hover{color:#fff;opacity:.92}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(90px);
background:var(--card);border:1px solid var(--gold);color:var(--txt);padding:12px 18px;
border-radius:12px;font-size:13.5px;font-weight:700;z-index:90;transition:transform .28s;
box-shadow:0 12px 34px rgba(0,0,0,.4);max-width:88vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}
.center{text-align:center;padding:70px 20px;color:var(--muted)}
.center .i{font-size:42px;display:block;margin-bottom:14px}
.spin{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--gold);
border-radius:50%;animation:g .8s linear infinite;margin:0 auto 12px}
@keyframes g{to{transform:rotate(360deg)}}

@media(max-width:640px){
  .topbar{padding:9px 11px;gap:7px}
  .topbar img{height:22px}
  .tbrow{gap:7px}
  .who{display:none}
  .tabs{order:3;flex:1 1 100%;justify-content:center}
  .tab{flex:1;justify-content:center;padding:9px 8px;font-size:12.5px}
  .btn-out{padding:6px 9px;font-size:12px;min-height:32px}
  .vtabs{flex:1 1 100%}
  .vtab{flex:1;text-align:center}
  .tools{gap:7px}
  .wrap{padding:14px 11px 50px}
  .hero{padding:16px}
  .hero h1{font-size:17px}
  .pcard{flex:1 1 44%}
  .pcard .n{font-size:22px}
  .fhead{padding:15px 16px}
  .fbody{padding:15px 16px 26px}
  .dados{grid-template-columns:1fr 1fr}
  input{font-size:16px}
}

/* ---- Kanban da jornada ---- */
.vtabs{display:flex;gap:4px;background:var(--card2);border-radius:11px;padding:3px;flex-shrink:0}
.vtab{background:none;border:none;color:var(--muted);border-radius:8px;padding:8px 13px;
font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.vtab.on{background:var(--card);color:var(--gold)}
.kb{display:flex;gap:10px;overflow-x:auto;padding-bottom:14px;-webkit-overflow-scrolling:touch;
scroll-snap-type:x proximity}
.kb::-webkit-scrollbar{height:7px}
.kb::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.kcol{flex:0 0 250px;background:var(--card2);border:1px solid var(--border);border-radius:15px;
padding:11px;scroll-snap-align:start;min-height:110px}
.kcol.hot{border-color:var(--gold)}
.khead{display:flex;align-items:flex-start;gap:8px;margin-bottom:4px}
.khead .ic{font-size:17px;line-height:1.2}
.khead .nm{font-size:12.5px;font-weight:800;flex:1;line-height:1.3}
.khead .q{background:var(--card);border:1px solid var(--border);border-radius:20px;
padding:2px 8px;font-size:11px;font-weight:800;color:var(--muted)}
.kcol.hot .khead .q{border-color:var(--gold);color:var(--gold)}
.kfaixa{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.4px;
text-transform:uppercase;margin-bottom:10px}
.kcard{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px;
margin-bottom:7px;cursor:pointer;transition:.16s;text-align:left;width:100%;font-family:inherit;
color:var(--txt);display:block}
.kcard:hover{border-color:var(--gold);transform:translateY(-1px)}
.kcard.pend{border-left:3px solid var(--gold)}
.kcard .cn{font-size:13px;font-weight:800;line-height:1.25}
.kcard .cm{font-size:10.5px;color:var(--muted);margin-top:4px;font-weight:600;
display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.kvazio{font-size:11.5px;color:var(--muted);text-align:center;padding:14px 6px;font-weight:600;opacity:.6}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.dot.p{background:var(--green-l)}.dot.d{background:#e07070}.dot.n{background:var(--gold)}

@media(max-width:640px){
  .kcol{flex:0 0 78vw}
  .vtab{padding:7px 10px;font-size:12px}
}

<script>
const SB_URL='https://dakubhcgohiwzyqiegqf.supabase.co';
const SB_KEY='sb_publishable_hue0wC6DINtAaxTPlSIOIg_X1Tr0vJx';
const sb=supabase.createClient(SB_URL,SB_KEY);
const LOGO_D='https://obras.polarisenergiasolar.com/logo.png', LOGO_L='https://obras.polarisenergiasolar.com/logo-claro.png';
let DADOS=null, FILTRO='', BUSCA='';
let VISAO='jornada', KB=null;
try{VISAO=localStorage.getItem('polaris-pv-visao')||'jornada'}catch(e){}

function tema(t){document.documentElement.setAttribute('data-theme',t);
  document.getElementById('bTema').textContent=t==='dark'?'🌙':'☀️';
  const l=document.getElementById('logo'); if(l) l.src=(t==='light')?LOGO_L:LOGO_D;
  try{localStorage.setItem('polaris-tema',t)}catch(e){}}
document.getElementById('bTema').onclick=()=>tema(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
try{tema(localStorage.getItem('polaris-tema')||'dark')}catch(e){tema('dark')}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(window._t);window._t=setTimeout(()=>t.classList.remove('on'),3200);}
function dataBR(d){if(!d)return'—';const p=String(d).split('T')[0].split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function quando(iso){
  if(!iso) return '—';
  const d=new Date(iso), h=Math.floor((Date.now()-d)/3600000);
  if(h<1) return 'agora há pouco';
  if(h<24) return `há ${h}h`;
  const dias=Math.floor(h/24);
  if(dias<7) return `há ${dias} dia${dias>1?'s':''}`;
  return d.toLocaleDateString('pt-BR');
}
async function sair(){await sb.auth.signOut();location.href='login.html';}

const CTX={
  indicacao:{i:'🎁',n:'Indicação',c:'gold'},
  iptu:{i:'🏛️',n:'IPTU',c:''},
  tecnico:{i:'🔧',n:'Técnico',c:'red'},
  conta:{i:'📄',n:'Conta de luz',c:''},
  reclamacao:{i:'😠',n:'Reclamação',c:'red'},
  elogio:{i:'💚',n:'Elogio',c:'green'},
  sair:{i:'🚪',n:'Pediu para sair',c:'red'},
  agendamento:{i:'📅',n:'Agendamento',c:''},
  geral:{i:'💬',n:'Mensagem',c:''}
};

async function boot(){
  const t=document.getElementById('tabObras'); if(t) t.href='painel.html?v='+Date.now();
  const s=await sb.auth.getSession();
  if(!s.data.session){location.href='login.html';return;}
  document.getElementById('who').textContent=s.data.session.user.email;
  const r=await sb.rpc('get_posvenda_lista');
  if(r.error||!r.data){
    document.getElementById('app').innerHTML='<div class="center"><span class="i">🔒</span><b>Sem acesso ao pós-venda.</b><br>Peça ao administrador para liberar.</div>';
    return;
  }
  DADOS=r.data;
  const k=await sb.rpc('get_kanban_posvenda');
  KB=k.data||null;
  render();
}

function render(){
  const R=DADOS.resumo||{}, cl=DADOS.clientes||[];
  const hora=new Date().getHours();
  const saud=hora<12?'Bom dia':(hora<18?'Boa tarde':'Boa noite');
  const pend=(R.respostas_pendentes||0);

  let h=`<div class="hero">
    <div class="eyebrow">Pós-venda</div>
    <h1>${saud}. ${pend? `Você tem ${pend} ${pend>1?'mensagens':'mensagem'} para tratar.` : 'Nada pendente por aqui.'}</h1>
    <div class="sub">${pend? 'Clientes escreveram nos grupos e ainda não tiveram retorno.' : 'Todas as mensagens dos clientes foram tratadas. 👏'}</div>
    <div class="pend">
      <button class="pcard ${R.indicacoes_pendentes?'alerta':''}" onclick="setFiltro('indicacao')">
        <div class="n">${R.indicacoes_pendentes||0}</div><div class="l">Indicações aguardando</div></button>
      <button class="pcard ${pend?'alerta':''}" onclick="setFiltro('pendentes')">
        <div class="n">${pend}</div><div class="l">Respostas para tratar</div></button>
      <button class="pcard ok" onclick="setFiltro('')">
        <div class="n">${R.clientes_ativos||0}</div><div class="l">Clientes ativos</div></button>
      <button class="pcard" onclick="setFiltro('sem_nps')">
        <div class="n">${R.sem_nps||0}</div><div class="l">Sem pesquisa respondida</div></button>
      <button class="pcard ${R.sem_aniversario?'alerta':''}" onclick="setFiltro('sem_aniv')">
        <div class="n">${R.sem_aniversario||0}</div><div class="l">Sem data de aniversário</div></button>
    </div>
  </div>`;

  h+=`<div class="tools">
    <div class="vtabs">
      <button class="vtab ${VISAO==='jornada'?'on':''}" onclick="setVisao('jornada')">🗺️ Jornada</button>
      <button class="vtab ${VISAO==='lista'?'on':''}" onclick="setVisao('lista')">☰ Lista</button>
      <button class="vtab ${VISAO==='regua'?'on':''}" onclick="setVisao('regua')">📅 Régua</button>
    </div>
    <div class="search">🔍<input id="q" placeholder="Buscar cliente ou contrato..." value="${esc(BUSCA)}" oninput="setBusca(this.value)"></div>
    ${VISAO==='lista'?`
    <button class="chip ${FILTRO===''?'on':''}" onclick="setFiltro('')">Todos</button>
    <button class="chip ${FILTRO==='pendentes'?'on':''}" onclick="setFiltro('pendentes')">Com pendência</button>
    <button class="chip ${FILTRO==='sem_nps'?'on':''}" onclick="setFiltro('sem_nps')">Sem NPS</button>
    <button class="chip ${FILTRO==='sem_aniv'?'on':''}" onclick="setFiltro('sem_aniv')">🎂 Sem aniversário</button>`:''}
  </div>`;

  if(VISAO==='regua'){
    document.getElementById('app').innerHTML=h+'<div id="rgbox"><div class="center"><div class="spin"></div>Carregando a régua...</div></div>';
    carregarRegua();
    return;
  }
  if(VISAO==='jornada'){
    h+=renderJornada();
    document.getElementById('app').innerHTML=h;
    return;
  }
  if(VISAO==='regua'){
    h+='<div id="reguabox"><div class="center"><div class="spin"></div>Carregando régua...</div></div>';
    document.getElementById('app').innerHTML=h;
    carregarRegua();
    return;
  }

  let arr=cl.slice();
  if(FILTRO==='pendentes') arr=arr.filter(c=>c.pendentes>0);
  if(FILTRO==='sem_nps') arr=arr.filter(c=>c.nps==null);
  if(FILTRO==='sem_aniv') arr=arr.filter(c=>!c.nascimento_dia);
  if(FILTRO==='indicacao') arr=arr.filter(c=>c.pendentes>0);
  if(BUSCA){const b=BUSCA.toLowerCase();
    arr=arr.filter(c=>(c.cliente||'').toLowerCase().includes(b)||(c.contrato||'').includes(b));}

  if(!arr.length){
    h+=`<div class="vazio">Nenhum cliente com esse filtro.<br>Ajuste a busca ou escolha "Todos".</div>`;
  } else {
    h+='<div class="lista">'+arr.map(c=>{
      const n=c.nps;
      const cls=n==null?'vazio':(n>=9?'p':(n<=6?'d':''));
      const bits=[];
      if(c.cidade) bits.push('📍 '+esc(c.cidade));
      if(c.potencia_kwp) bits.push('⚡ '+String(c.potencia_kwp).replace('.',',')+' kWp');
      if(c.dias_ativo!=null) bits.push('☀️ '+c.dias_ativo+' dias ativo');
      if(c.vendedor) bits.push('👔 '+esc(c.vendedor));
      return `<button class="cli ${c.pendentes?'pend':''}" onclick="abrirFicha('${c.id}')">
        <div class="top">
          <div class="nome">${esc(c.cliente)}${c.contrato?` <span style="color:var(--muted);font-weight:600;font-size:12px">#${esc(c.contrato)}</span>`:''}</div>
          <div class="nota ${cls}">${n==null?'—':n}</div>
        </div>
        <div class="meta">${bits.join('<span style="opacity:.4">·</span>')}</div>
        <div style="margin-top:8px;display:flex;gap:5px;flex-wrap:wrap">
        ${c.pendentes?`<span class="tag gold">💬 ${c.pendentes} para tratar</span>`:''}
        ${!c.nascimento_dia?`<span class="tag">🎂 sem aniversário</span>`:''}
        </div>
      </button>`;
    }).join('')+'</div>';
  }
  document.getElementById('app').innerHTML=h;
}
function setVisao(v){VISAO=v;try{localStorage.setItem('polaris-pv-visao',v)}catch(e){}render();}
function renderJornada(){
  if(!KB) return '<div class="vazio">Não foi possível carregar a jornada.</div>';
  const mom=KB.momentos||[], cl=(KB.clientes||[]);
  const b=BUSCA.toLowerCase();
  const filtrados=b?cl.filter(c=>(c.cliente||'').toLowerCase().includes(b)||(c.contrato||'').includes(b)):cl;

  return '<div class="kb">'+mom.map(m=>{
    const dele=filtrados.filter(c=>c.momento===m.codigo);
    const temPend=dele.some(c=>c.pendentes>0);
    const faixa=m.dia_fim!=null?`${m.dia_inicio} a ${m.dia_fim} dias`:`${m.dia_inicio}+ dias`;
    return `<div class="kcol ${temPend?'hot':''}">
      <div class="khead"><span class="ic">${m.icone}</span>
        <span class="nm">${esc(m.nome)}</span>
        <span class="q">${dele.length}</span></div>
      <div class="kfaixa">${faixa}</div>
      ${dele.length?dele.map(c=>{
        const n=c.nps;
        const cls=n==null?'':(n>=9?'p':(n<=6?'d':'n'));
        return `<button class="kcard ${c.pendentes?'pend':''}" onclick="abrirFicha('${c.id}')">
          <div class="cn">${esc(c.cliente)}</div>
          <div class="cm">
            <span>${c.dias} dias</span>
            ${c.cidade?`<span>${esc(c.cidade)}</span>`:''}
            ${n!=null?`<span class="dot ${cls}"></span><span>${n}</span>`:''}
            ${c.pendentes?`<span style="color:var(--gold);font-weight:800">💬 ${c.pendentes}</span>`:''}
          </div>
        </button>`;
      }).join(''):'<div class="kvazio">nenhum cliente</div>'}
    </div>`;
  }).join('')+'</div>';
}
function setFiltro(f){FILTRO=(FILTRO===f)?'':f;render();}
function setBusca(v){BUSCA=v;const p=document.activeElement===document.getElementById('q');render();
  if(p){const q=document.getElementById('q');q.focus();q.setSelectionRange(q.value.length,q.value.length);}}

async function abrirFicha(id){
  const ov=document.getElementById('ov'), f=document.getElementById('ficha');
  f.innerHTML='<div class="center"><div class="spin"></div>Abrindo ficha...</div>';
  ov.classList.add('on');
  const r=await sb.rpc('get_ficha_cliente',{p_obra:id});
  if(r.error||!r.data||r.data.erro){
    f.innerHTML=`<div class="center"><span class="i">🔒</span>${(r.data&&r.data.erro)||'Não foi possível abrir.'}</div>`;
    return;
  }
  const g=await sb.rpc('get_geracao',{p_obra:id});
  r.data.geracao=g.data||null;
  renderFicha(r.data);
}
function fecharFicha(){document.getElementById('ov').classList.remove('on');}
document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov')fecharFicha();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')fecharFicha();});

function renderFicha(D){
  const o=D.obra, n=D.nps, msgs=D.mensagens||[];
  const bits=[];
  if(o.contrato) bits.push('#'+esc(o.contrato));
  if(o.cidade) bits.push('📍 '+esc(o.cidade));
  if(o.vendedor) bits.push('👔 '+esc(o.vendedor));
  if(o.dias_ativo!=null) bits.push('☀️ ativo há '+o.dias_ativo+' dias');

  let h=`<div class="fhead">
    <button class="fechar" onclick="fecharFicha()">✕</button>
    <div class="nome">${esc(o.cliente)}</div>
    <div class="meta">${bits.join('<span style="opacity:.4">·</span>')}</div>
    <div style="margin-top:9px">
      ${o.optout_em?'<span class="tag red">🚪 Pediu para sair</span>'
        :(o.optin_em?'<span class="tag green">✓ Autorizou comunicações</span>'
        :'<span class="tag">⚠️ Sem autorização</span>')}
      ${(D.pode_agir && !o.optin_em && !o.optout_em)?`<button class="tag gold" style="cursor:pointer;background:none" onclick="marcarOptin('${o.id}',true)">+ registrar autorização</button>`:''}
      ${(D.pode_agir && o.optin_em && !o.optout_em)?`<button class="tag" style="cursor:pointer;background:none" onclick="marcarOptin('${o.id}',false)">registrar saída</button>`:''}
    </div>
  </div><div class="fbody">`;

  /* Sistema */
  h+=`<div class="sec"><h3>O sistema</h3><div class="dados">
    <div class="dado"><div class="k">Potência</div><div class="v">${o.potencia_kwp?String(o.potencia_kwp).replace('.',','):'—'} <small>kWp</small></div></div>
    <div class="dado"><div class="k">Módulos</div><div class="v">${o.qtd_modulos||'—'}</div></div>
    <div class="dado"><div class="k">Ativado em</div><div class="v" style="font-size:13px">${dataBR(o.data_conclusao)}</div></div>
    <div class="dado"><div class="k">Registro</div><div class="v" style="font-size:13px">${D.fotos_total||0} fotos${D.videos_total?` · ${D.videos_total} vídeo${D.videos_total>1?'s':''}`:''}</div></div>
  </div></div>`;

  /* Aniversário */
  h+=`<div class="sec"><h3>Aniversário do cliente</h3>`;
  if(o.nascimento_dia){
    const mes=['','janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'][o.nascimento_mes];
    h+=`<div class="dado" style="display:flex;align-items:center;gap:12px">
      <div style="font-size:26px">🎂</div>
      <div style="flex:1"><div class="v" style="font-size:15px">${o.nascimento_dia} de ${mes}</div>
      <div style="font-size:11px;color:var(--muted);margin-top:2px">Parabéns automático às 9h no grupo</div></div>
      ${D.pode_agir?`<button class="chip" onclick="formAniversario('${o.id}',${o.nascimento_dia},${o.nascimento_mes})">alterar</button>`:''}
    </div>`;
  } else if(D.pode_agir){
    h+=`<button class="mini" onclick="formAniversario('${o.id}',null,null)">🎂 Adicionar data de aniversário</button>`;
  } else {
    h+=`<div class="vazio">Sem data cadastrada.</div>`;
  }
  h+=`<div id="fani"></div></div>`;

  /* Satisfação */
  h+=`<div class="sec"><h3>Satisfação</h3>`;
  if(n&&n.nota!=null){
    const cor=n.nota>=9?'var(--green-l)':(n.nota<=6?'#e07070':'var(--gold)');
    h+=`<div class="dado" style="padding:14px">
      <div style="display:flex;align-items:center;gap:14px">
        <div style="font-size:34px;font-weight:800;color:${cor};line-height:1">${n.nota}</div>
        <div style="flex:1">
          <div style="font-size:12.5px;font-weight:700">${n.nota>=9?'Promotor':(n.nota<=6?'Detrator':'Neutro')}</div>
          <div style="font-size:11.5px;color:var(--muted);margin-top:2px">respondeu ${quando(n.criado_em)}</div>
        </div>
      </div>
      ${n.comentario?`<div style="font-size:13px;margin-top:11px;line-height:1.55;font-style:italic;color:var(--muted)">"${esc(n.comentario)}"</div>`:''}
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:11px">
        ${n.brinde?`<span class="tag">${n.brinde==='copo'?'🥤 Copo térmico':'🎧 Fone'} · ${esc(n.voucher||'')}</span>`:''}
        ${n.entregue_em?'<span class="tag green">✓ brinde entregue</span>':(n.brinde?'<span class="tag gold">brinde pendente</span>':'')}
        ${n.avaliou_google_em?'<span class="tag green">✓ avaliou no Google</span>':(n.nota>=9?'<span class="tag gold">Google pendente</span>':'')}
      </div></div>`;
  } else {
    h+=`<div class="vazio">Ainda não respondeu a pesquisa.</div>`;
  }
  if(D.pode_agir){
    h+=`<button class="mini" style="margin-top:8px" onclick="formNPS('${o.id}',${n&&n.nota!=null?n.nota:'null'})">
      ${n&&n.nota!=null?'✏️ Corrigir registro':'➕ Registrar resposta que veio por fora'}</button>
      <div id="fnps"></div>`;
  }
  h+=`</div>`;

  /* Geração */
  const G=D.geracao;
  h+=`<div class="sec"><h3>Geração e desempenho</h3>`;
  if(G && (G.acumulado?.meses||0)>0){
    const a=G.acumulado;
    h+=`<div class="dados">
      <div class="dado"><div class="k">Acumulado</div><div class="v">${a.kwh||0} <small>kWh</small></div></div>
      <div class="dado"><div class="k">Economia</div><div class="v">R$ ${a.economia||0}</div></div>
      <div class="dado"><div class="k">Desempenho médio</div><div class="v" style="color:${(a.desempenho_medio>=90)?'var(--green-l)':((a.desempenho_medio>=75)?'var(--gold)':'#e07070')}">${a.desempenho_medio||'—'}<small>%</small></div></div>
      <div class="dado"><div class="k">Meses registrados</div><div class="v">${a.meses}</div></div>
    </div>`;
    h+=`<table class="gtab"><tr><th>Mês</th><th class="num">kWh</th><th class="num">Desemp.</th><th class="num">Economia</th></tr>`;
    (G.meses||[]).slice(0,6).forEach(m=>{
      const p=m.referencia.split('-');
      const cor=m.desempenho>=90?'var(--green-l)':(m.desempenho>=75?'var(--gold)':'#e07070');
      h+=`<tr><td>${p[1]}/${p[0]}</td><td class="num">${m.kwh||'—'}</td>
        <td class="num" style="color:${cor};font-weight:800">${m.desempenho!=null?m.desempenho+'%':'—'}</td>
        <td class="num">R$ ${m.economia||'—'}</td></tr>`;
    });
    h+=`</table>`;
  } else {
    h+=`<div class="vazio">Nenhum mês registrado.<br>
      <span style="font-size:11.5px;opacity:.8">Estimativa pela potência: <b>${G?G.estimativa_mensal:'—'} kWh/mês</b> · ~R$ ${G?G.estimativa_economia:'—'}</span></div>`;
  }
  if(D.pode_agir){
    h+=`<button class="mini" style="margin-top:8px" onclick="formGeracao('${o.id}')">➕ Registrar geração do mês</button>
      <div id="fger"></div>`;
  }
  h+=`</div>`;

  /* Trilha — o elemento assinatura */
  h+=`<div class="sec"><h3>A trilha do relacionamento</h3>`;
  const eventos=[];
  if(o.data_conclusao) eventos.push({d:o.data_conclusao,tipo:'sis',t:'☀️ Sistema ativado',x:null});
  if(o.relatorio_enviado_em) eventos.push({d:o.relatorio_enviado_em,tipo:'sis',t:'📄 Relatório enviado no grupo',x:null});
  if(o.aceite_em) eventos.push({d:o.aceite_em,tipo:'sis',t:'✍️ Termo assinado'+(o.aceite_nome?' por '+esc(o.aceite_nome):''),x:null});
  if(n&&n.criado_em) eventos.push({d:n.criado_em,tipo:'cli',t:`⭐ Respondeu a pesquisa — nota ${n.nota}`,x:n.comentario});
  if(n&&n.avaliou_google_em) eventos.push({d:n.avaliou_google_em,tipo:'cli',t:'💚 Avaliou a Polaris no Google',x:null});
  if(o.iptu_avisado_em) eventos.push({d:o.iptu_avisado_em,tipo:'sis',t:'🏛️ Avisado sobre o IPTU Sustentável',x:null});
  msgs.forEach(m=>{
    const c=CTX[m.contexto]||CTX.geral;
    eventos.push({d:m.recebida_em,tipo:'cli',
      t:`${c.i} ${c.n}${m.remetente_nome?' — '+esc(m.remetente_nome):''}`,
      x:m.texto, id:m.id, ctx:m.contexto, lida:m.lida_em,
      ind:m.nome_indicado, fone:m.telefone_indicado});
  });
  eventos.sort((a,b)=>new Date(b.d)-new Date(a.d));

  if(!eventos.length){
    h+=`<div class="vazio">Nada registrado ainda.<br>Os contatos aparecem aqui conforme acontecem.</div>`;
  } else {
    h+='<div class="trilha">'+eventos.map(e=>{
      let ex='';
      if(e.ind) ex+=`<div style="margin-top:7px"><span class="tag gold">🤝 ${esc(e.ind)}${e.fone?' · '+esc(e.fone):''}</span></div>`;
      return `<div class="ev ${e.tipo==='cli'?'cli':'on'}">
        <div class="quando">${quando(e.d)} · ${dataBR(e.d)}</div>
        <div class="oque">${e.t}</div>
        ${e.x?`<div class="txt">${esc(e.x)}</div>`:''}
        ${ex}
        ${(e.id&&!e.lida&&D.pode_agir)?`<div style="margin-top:7px"><button class="chip" onclick="tratar(${e.id},'${o.id}')">marcar tratada</button></div>`:''}
      </div>`;
    }).join('')+'</div>';
  }
  h+=`</div>`;

  /* Ações */
  h+=`<div class="sec"><h3>Atalhos</h3><div class="acoes">
    <a class="ac" href="relatorio.html?id=${encodeURIComponent(o.slug)}" target="_blank">📄 Relatório</a>
    <a class="ac" href="cliente.html?id=${encodeURIComponent(o.slug)}" target="_blank">📱 Acompanhamento</a>
    ${o.telefone?`<a class="ac" href="https://wa.me/55${String(o.telefone).replace(/\D/g,'')}" target="_blank">💬 WhatsApp</a>`:''}
  </div></div>`;

  h+='</div>';
  document.getElementById('ficha').innerHTML=h;
}

async function tratar(id,obraId){
  const r=await sb.rpc('marcar_resposta_lida',{p_id:id});
  if(r.error||(r.data&&r.data.erro)){toast('Não foi possível marcar');return;}
  toast('Marcada como tratada ✓');
  await abrirFicha(obraId);
  const nova=await sb.rpc('get_posvenda_lista');
  if(nova.data){DADOS=nova.data;}
}


/* ===== REGISTRO MANUAL ===== */
let OBRA_ABERTA=null;

function formAniversario(id, dia, mes){
  const el=document.getElementById('fani');
  if(el.innerHTML){ el.innerHTML=''; return; }
  let meses='';
  const nomes=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  nomes.forEach((n,i)=>{ meses+=`<option value="${i+1}" ${(i+1)===mes?'selected':''}>${n}</option>`; });
  let dias='';
  for(let d=1;d<=31;d++) dias+=`<option value="${d}" ${d===dia?'selected':''}>${d}</option>`;
  el.innerHTML=`<div class="reg">
    <div class="lin">
      <div class="cp" style="max-width:88px"><label>Dia</label><select id="a_dia">${dias}</select></div>
      <div class="cp"><label>Mês</label><select id="a_mes">${meses}</select></div>
    </div>
    <button class="salvar" onclick="salvarAniversario('${id}')">Salvar aniversário</button>
    ${dia?`<button class="mini" style="margin-top:7px" onclick="limparAniversario('${id}')">remover data</button>`:''}
    <div class="dica">Só dia e mês — não guardamos o ano. Às 9h do dia, o sistema manda os parabéns no grupo e avisa a equipe.</div>
  </div>`;
}
async function salvarAniversario(id){
  const d=parseInt(document.getElementById('a_dia').value,10);
  const m=parseInt(document.getElementById('a_mes').value,10);
  const r=await sb.rpc('definir_aniversario',{p_obra:id,p_dia:d,p_mes:m});
  if(r.error||(r.data&&r.data.erro)){ toast('Erro: '+((r.data&&r.data.erro)||r.error.message)); return; }
  toast('Aniversário salvo ✓');
  await abrirFicha(id);
}
async function limparAniversario(id){
  if(!confirm('Remover a data de aniversário deste cliente?')) return;
  const r=await sb.rpc('definir_aniversario',{p_obra:id,p_dia:null,p_mes:null});
  if(r.error){ toast('Erro'); return; }
  toast('Data removida');
  await abrirFicha(id);
}
function formNPS(id, notaAtual){
  OBRA_ABERTA=id;
  const el=document.getElementById('fnps');
  if(el.innerHTML){ el.innerHTML=''; return; }
  let notas='';
  for(let i=0;i<=10;i++) notas+=`<option value="${i}" ${i===notaAtual?'selected':''}>${i}</option>`;
  el.innerHTML=`<div class="reg">
    <div class="lin">
      <div class="cp" style="max-width:110px"><label>Nota (0-10)</label>
        <select id="n_nota">${notaAtual==null?'<option value="">—</option>':''}${notas}</select></div>
      <div class="cp"><label>Quando respondeu</label>
        <input type="date" id="n_data" value="${new Date().toISOString().slice(0,10)}"></div>
    </div>
    <div class="cp" style="margin-bottom:9px"><label>Comentário (opcional)</label>
      <textarea id="n_com" rows="2" placeholder="O que o cliente falou..."></textarea></div>
    <label class="chk"><input type="checkbox" id="n_google"> Já avaliou no Google</label>
    <div class="lin">
      <div class="cp"><label>Brinde escolhido</label>
        <select id="n_brinde">
          <option value="">— nenhum —</option>
          <option value="copo">🥤 Copo térmico</option>
          <option value="fone">🎧 Fone Bluetooth</option>
        </select></div>
    </div>
    <label class="chk"><input type="checkbox" id="n_entregue"> Brinde já entregue</label>
    <button class="salvar" onclick="salvarNPS('${id}')">Salvar registro</button>
    <div class="dica">Use quando o cliente respondeu por WhatsApp, ligação ou pessoalmente — e não pelo link da pesquisa.</div>
  </div>`;
}

async function salvarNPS(id){
  const nota=document.getElementById('n_nota').value;
  if(nota===''){ toast('Escolha a nota'); return; }
  const r=await sb.rpc('registrar_nps_manual',{
    p_obra:id, p_nota:parseInt(nota,10),
    p_comentario:document.getElementById('n_com').value.trim()||null,
    p_avaliou_google:document.getElementById('n_google').checked,
    p_brinde:document.getElementById('n_brinde').value||null,
    p_brinde_entregue:document.getElementById('n_entregue').checked,
    p_data:document.getElementById('n_data').value||null
  });
  if(r.error||(r.data&&r.data.erro)){ toast('Erro: '+((r.data&&r.data.erro)||r.error.message)); return; }
  toast('Registro salvo ✓');
  await abrirFicha(id);
  const nova=await sb.rpc('get_posvenda_lista'); if(nova.data) DADOS=nova.data;
  const k=await sb.rpc('get_kanban_posvenda'); if(k.data) KB=k.data;
}

function formGeracao(id){
  const el=document.getElementById('fger');
  if(el.innerHTML){ el.innerHTML=''; return; }
  const hoje=new Date();
  const mesAnterior=new Date(hoje.getFullYear(), hoje.getMonth()-1, 1);
  el.innerHTML=`<div class="reg">
    <div class="lin">
      <div class="cp"><label>Mês de referência</label>
        <input type="month" id="g_ref" value="${mesAnterior.toISOString().slice(0,7)}"></div>
      <div class="cp"><label>Gerado (kWh)</label>
        <input type="number" id="g_kwh" step="0.01" placeholder="450"></div>
    </div>
    <div class="lin">
      <div class="cp"><label>Previsto (opcional)</label>
        <input type="number" id="g_prev" step="0.01" placeholder="calcula sozinho"></div>
      <div class="cp"><label>Economia R$ (opcional)</label>
        <input type="number" id="g_econ" step="0.01" placeholder="calcula sozinho"></div>
    </div>
    <button class="salvar" onclick="salvarGeracao('${id}')">Salvar geração</button>
    <div class="dica">Pegue os números no relatório da Solarz. Se deixar "previsto" e "economia" em branco, o sistema calcula pela potência do sistema e pela tarifa da CPFL.</div>
  </div>`;
}

async function salvarGeracao(id){
  const ref=document.getElementById('g_ref').value;
  const kwh=document.getElementById('g_kwh').value;
  if(!ref||!kwh){ toast('Preencha o mês e o valor gerado'); return; }
  const prev=document.getElementById('g_prev').value;
  const econ=document.getElementById('g_econ').value;
  const r=await sb.rpc('registrar_geracao',{
    p_obra:id, p_referencia:ref+'-01', p_kwh:parseFloat(kwh),
    p_previsto:prev?parseFloat(prev):null,
    p_economia:econ?parseFloat(econ):null,
    p_origem:'manual'
  });
  if(r.error||(r.data&&r.data.erro)){ toast('Erro: '+((r.data&&r.data.erro)||r.error.message)); return; }
  toast(`Salvo ✓ Desempenho: ${r.data.desempenho}%`);
  await abrirFicha(id);
}

async function marcarOptin(id, valor){
  const fn = valor ? 'registrar_optin_manual' : 'registrar_optout_manual';
  const args = valor ? {p_obra:id, p_origem:'manual'} : {p_obra:id};
  if(!confirm(valor
    ? 'Confirmar que este cliente autorizou receber comunicações?\n\nRegistre apenas se ele realmente concordou.'
    : 'Marcar que este cliente NÃO quer mais receber comunicações?')) return;
  const r=await sb.rpc(fn,args);
  if(r.error||(r.data&&r.data.erro)){ toast('Erro'); return; }
  toast(valor?'Autorização registrada ✓':'Opt-out registrado');
  await abrirFicha(id);
}


/* ===== RÉGUA ===== */
let REGUA=null;
async function carregarRegua(){
  const r=await sb.rpc('get_regua_painel');
  REGUA=r.data||null;
  renderRegua();
}
function renderRegua(){
  const el=document.getElementById('reguabox'); if(!el) return;
  if(!REGUA){ el.innerHTML='<div class="vazio">Não foi possível carregar a régua.</div>'; return; }
  const R=REGUA.resumo||{}, hoje=REGUA.hoje||[], mods=REGUA.modelos||[];

  let h=`<div class="switch">
    <div class="info">
      <div class="tt">${REGUA.ativa?'✅ Régua ativa':'⏸️ Régua desativada'}</div>
      <div class="ds">${REGUA.ativa
        ? 'Os contatos saem automaticamente todo dia às 10h, no máximo 15 por dia.'
        : 'Nenhuma mensagem está sendo enviada. Ative quando quiser começar.'}</div>
    </div>
    <button class="sw ${REGUA.ativa?'on':''}" onclick="toggleRegua(${!REGUA.ativa})"></button>
  </div>`;

  h+=`<div class="rgstat">
    <div class="b"><div class="n" style="color:var(--gold)">${R.hoje||0}</div><div class="l">Para sair hoje</div></div>
    <div class="b"><div class="n">${R.pendentes||0}</div><div class="l">Programados</div></div>
    <div class="b"><div class="n" style="color:var(--green-l)">${R.enviados||0}</div><div class="l">Já enviados</div></div>
    <div class="b"><div class="n">${R.obras_na_regua||0}</div><div class="l">Clientes na régua</div></div>
  </div>`;

  h+=`<div class="sec"><h3>Próximos 7 dias</h3>`;
  if(!hoje.length){
    h+='<div class="vazio">Nenhum contato programado para os próximos dias.</div>';
  } else {
    hoje.forEach(c=>{
      const atrasado=c.atraso>0, hj=c.atraso===0;
      const quando=atrasado?`${c.atraso}d de atraso`:(hj?'hoje':dataBR(c.data_prevista));
      h+=`<div class="rgrow ${c.bloqueio?'bloq':(hj||atrasado?'hoje':'')}">
        <div class="ic">${c.icone||'📨'}</div>
        <div class="cn"><b>${esc(c.cliente)}</b>
          <span>${esc(c.nome_modelo)}${c.bloqueio?` · ⚠️ ${esc(c.bloqueio)}`:''}</span></div>
        <div class="qd">${quando}</div>
      </div>`;
    });
  }
  h+=`</div>`;

  h+=`<div class="sec"><h3>Os contatos da régua</h3>`;
  mods.forEach(m=>{
    const tipo=m.tipo==='pede'?'🙏 pede':(m.tipo==='oferece'?'💼 oferece':'🎁 entrega valor');
    h+=`<div class="mod" onclick="this.classList.toggle('aberto')">
      <div class="top"><span>${m.icone}</span><b>${esc(m.nome)}</b>
        <span class="dia">${m.dia>0?'D+'+m.dia:'sob demanda'}</span></div>
      <div style="font-size:10.5px;color:var(--muted);font-weight:700;margin-top:5px">${tipo}${m.condicao!=='sempre'?' · condição: '+m.condicao.replace('_',' '):''}</div>
      <div class="tx">${esc(m.texto)}</div>
    </div>`;
  });
  h+=`</div>`;

  el.innerHTML=h;
}
async function toggleRegua(ativar){
  if(ativar && !confirm('Ativar a régua de relacionamento?\n\nA partir de agora o sistema vai enviar os contatos programados automaticamente, no máximo 15 por dia.')) return;
  const r=await sb.rpc('regua_toggle',{p_ativa:ativar});
  if(r.error||(r.data&&r.data.erro)){ toast('Erro: '+((r.data&&r.data.erro)||r.error.message)); return; }
  toast(ativar?'Régua ativada ✅':'Régua desativada');
  await carregarRegua();
}

/* ===== RÉGUA ===== */
let RG=null;
async function carregarRegua(){
  const r=await sb.rpc('get_regua_painel');
  if(r.error||!r.data){
    document.getElementById('rgbox').innerHTML='<div class="vazio">Não foi possível carregar a régua.</div>';
    return;
  }
  RG=r.data; renderRegua();
}
function renderRegua(){
  const R=RG.resumo||{}, fila=RG.fila||[], ult=RG.ultimos||[];
  const hoje=fila.filter(f=>f.quando<=new Date().toISOString().slice(0,10));
  const prox=fila.filter(f=>f.quando>new Date().toISOString().slice(0,10));

  let h='';
  if(RG.pode_agir){
    h+=`<div class="liga">
      <div class="txt">
        <div class="tt">${RG.ativa?'✅ Régua ativa':'⏸️ Régua pausada'}</div>
        <div class="sb">${RG.ativa
          ? `Envia até ${RG.por_dia} contatos por dia útil, às 11h. Cada envio respeita 6 segundos de intervalo.`
          : 'Nenhum contato está sendo enviado automaticamente. Você ainda pode disparar manualmente abaixo.'}</div>
      </div>
      <label class="sw"><input type="checkbox" ${RG.ativa?'checked':''} onchange="ligarRegua(this.checked)"><span class="tr"></span></label>
    </div>`;
  }

  h+=`<div class="rgstat">
    <div class="rgs ${R.hoje?'hot':''}"><div class="n">${R.hoje||0}</div><div class="l">Para enviar hoje</div></div>
    <div class="rgs"><div class="n">${R.proximos7||0}</div><div class="l">Próximos 7 dias</div></div>
    <div class="rgs ${R.bloqueados?'blk':''}"><div class="n">${R.bloqueados||0}</div><div class="l">Bloqueados</div></div>
    <div class="rgs"><div class="n">${R.enviados_30d||0}</div><div class="l">Enviados em 30 dias</div></div>
    <div class="rgs"><div class="n">${R.clientes_na_regua||0}</div><div class="l">Clientes na régua</div></div>
  </div>`;

  if(hoje.length){
    h+=`<div class="sec"><h3>Para enviar hoje</h3>`+hoje.map(f=>linhaRegua(f,true)).join('')+`</div>`;
  } else {
    h+=`<div class="vazio">Nada para enviar hoje. 👏</div>`;
  }

  if(prox.length){
    h+=`<div class="sec"><h3>Próximos dias</h3>`+prox.slice(0,20).map(f=>linhaRegua(f,false)).join('')+`</div>`;
  }

  if(ult.length){
    h+=`<div class="sec"><h3>Últimos enviados</h3>`+ult.map(u=>{
      const d=new Date(u.enviado_em);
      return `<div class="rgrow"><div class="l1"><span class="ic">${u.icone||'📬'}</span>
        <span class="cl">${esc(u.cliente)}</span>
        <span class="qd">${d.toLocaleDateString('pt-BR')}</span></div>
        <div class="mo">${esc(u.nome_modelo)}</div></div>`;
    }).join('')+`</div>`;
  }

  document.getElementById('rgbox').innerHTML=h;
}
function linhaRegua(f, ehHoje){
  const q=f.quando.split('-');
  const lim=f.data_limite.split('-');
  return `<div class="rgrow ${f.bloqueio?'bloq':(ehHoje?'hoje':'')}" id="rg${f.id}">
    <div class="l1"><span class="ic">${f.icone||'📬'}</span>
      <span class="cl">${esc(f.cliente)}${f.contrato?` <span style="color:var(--muted);font-weight:600;font-size:11.5px">#${esc(f.contrato)}</span>`:''}</span>
      <span class="qd">${ehHoje?'hoje':q[2]+'/'+q[1]}</span></div>
    <div class="mo">${esc(f.nome_modelo)} · ${f.dias_ativo} dias de ativo · janela até ${lim[2]}/${lim[1]}</div>
    ${f.bloqueio?`<div class="bq">⚠️ ${esc(f.bloqueio)}</div>`:''}
    ${RG.pode_agir?`<div class="ac">
      <button onclick="previaRegua(${f.id})">👁️ ver texto</button>
      ${!f.bloqueio?`<button class="go" onclick="enviarRegua(${f.id},'${esc(f.cliente)}')">📤 enviar agora</button>`:''}
      <button onclick="adiarRegua(${f.id})">⏰ adiar 7 dias</button>
      <button onclick="cancelarRegua(${f.id})">✕ cancelar</button>
    </div>`:''}
    <div id="pv${f.id}"></div>
  </div>`;
}
async function ligarRegua(v){
  if(v && !confirm('Ativar a régua?\n\nA partir de agora o sistema envia automaticamente os contatos programados, todo dia útil às 11h.')){
    renderRegua(); return;
  }
  const r=await sb.from('config').update({valor:v?'1':'0'}).eq('chave','regua_ativa');
  if(r.error){ toast('Erro ao salvar'); return; }
  toast(v?'Régua ativada ✅':'Régua pausada');
  carregarRegua();
}
async function previaRegua(id){
  const el=document.getElementById('pv'+id);
  if(el.innerHTML){ el.innerHTML=''; return; }
  const r=await sb.rpc('regua_previa',{p_id:id});
  if(r.error||!r.data||r.data.erro){ toast('Não foi possível carregar'); return; }
  el.innerHTML=`<div class="prev">${esc(r.data.texto||'')}</div>`;
}
async function enviarRegua(id, cliente){
  if(!confirm('Enviar este contato para '+cliente+' agora?')) return;
  toast('Enviando...');
  const s=await sb.auth.getSession();
  const r=await sb.functions.invoke('regua-disparo',{body:{contato_id:id}});
  if(r.error||(r.data&&r.data.error)){ toast('Erro: '+((r.data&&r.data.error)||r.error.message)); return; }
  toast('Enviado ✓');
  carregarRegua();
}
async function adiarRegua(id){
  const r=await sb.rpc('regua_adiar',{p_id:id,p_dias:7});
  if(r.error||(r.data&&r.data.erro)){ toast((r.data&&r.data.erro)||'Erro ao adiar'); return; }
  toast('Adiado por 7 dias');
  carregarRegua();
}
async function cancelarRegua(id){
  if(!confirm('Cancelar este contato?\n\nEle não será enviado a este cliente.')) return;
  const r=await sb.rpc('regua_cancelar',{p_id:id});
  if(r.error){ toast('Erro'); return; }
  toast('Contato cancelado');
  carregarRegua();
}

boot();
</script>
