function nuColeta(obraId){
  const v=function(id){ return (((document.getElementById(id)||{}).value)||'').trim(); };
  return { obra_id: obraId, usina: {
    apelido:v('nu_ap'), cidade:v('nu_cid'),
    potencia_kwp:v('nu_kwp'), modulos:v('nu_mod'),
    endereco:v('nu_end'), data_instalacao:v('nu_dti'),
    data_estimada: !!(document.getElementById('nu_est')||{}).checked,
    papel:v('nu_papel'), compensa_em:v('nu_comp') } };
}

function nuErros(lista){
  const b=document.getElementById('nuBtn'); if(b) b.disabled=true;
  document.getElementById('nuPrev').innerHTML=
    '<div class="ncerro"><b>Falta corrigir:</b><ul>'
    +(lista||[]).map(function(e){ return '<li>'+esc(e)+'</li>'; }).join('')+'</ul></div>';
}

async function nuSimular(obraId){
  const r=await sb.rpc('usina_adicionar',{ p:nuColeta(obraId), p_simular:true });
  if(r.error){ toast('Erro: '+r.error.message); return; }
  const d=r.data||{};
  if(!d.ok){ nuErros(d.erros); return; }

  let h='<div class="ncok">'
   +'<b>'+esc(d.cliente||'')+'</b> passa de '+d.usinas_hoje
   +(d.usinas_hoje===1?' usina':' usinas')+' para '+(Number(d.usinas_hoje)+1)+'<br>';
  if(Number(d.enderecos_depois) > Number(d.enderecos_hoje)){
    h+='<span style="color:var(--gold)">Vira um endereço novo — '
      +d.enderecos_hoje+' → <b>'+d.enderecos_depois+'</b>. '
      +'O plano Completo cobra uma visita técnica anual em cada um.</span><br>';
  }
  if(d.papel){
    h+='Entra como <b>'+(d.papel==='herdada'?'herdada — instalada por outra empresa'
        :(d.papel==='expansao'?'expansão — a Polaris vendeu depois':esc(d.papel)))+'</b><br>';
  }
  if(d.externo){
    h+='O total da ficha passa a <b>'+Number(d.kwp_obra_depois||0).toFixed(2)+' kWp</b>'
      +(d.modulos_obra_depois?' · '+d.modulos_obra_depois+' módulos':'')+'<br>';
  }
  (d.avisos||[]).forEach(function(a){
    h+='<span style="color:var(--gold)">⚠️ '+esc(a)+'</span><br>';
  });
  h+='</div>';
  document.getElementById('nuPrev').innerHTML=h;
  document.getElementById('nuBtn').disabled=false;
}

async function nuGravar(obraId){
  const r=await sb.rpc('usina_adicionar',{ p:nuColeta(obraId), p_simular:false });
  if(r.error){ toast('Erro: '+r.error.message); return; }
  const d=r.data||{};
  if(!d.ok){ nuErros(d.erros); return; }
  toast('Usina adicionada ✓');
  abrirFicha(obraId);
}

function renderFicha(D){
  FICHA=D;
  const o=D.obra, n=D.nps, msgs=D.mensagens||[];
  const bits=[];
  if(o.contrato) bits.push('#'+esc(o.contrato));
  if(o.cidade) bits.push('📍 '+esc(o.cidade));
  if(o.vendedor) bits.push('👔 '+esc(o.vendedor));
  if(o.dias_ativo!=null) bits.push('☀️ ativo há '+o.dias_ativo+' dias');

  let h=`<div class="fhead">
    <button class="fechar" onclick="fecharFicha()">✕</button>
    <div class="nome">${esc(o.cliente)}</div>
    <div class="meta">${bits.join('<span style="opacity:.4">·</span>')}</div>
    <div style="margin-top:9px">
      ${o.optout_em?'<span class="tag red">🚪 Pediu para sair</span>'
        :(o.optin_em?'<span class="tag green">✓ Autorizou comunicações</span>'
        :'<span class="tag">⚠️ Sem autorização</span>')}
      ${(D.pode_agir && !o.optin_em && !o.optout_em)?`<button class="tag gold" style="cursor:pointer;background:none" onclick="marcarOptin('${o.id}',true)">+ registrar autorização</button>`:''}
      ${(D.pode_agir && o.optin_em && !o.optout_em)?`<button class="tag" style="cursor:pointer;background:none" onclick="marcarOptin('${o.id}',false)">registrar saída</button>`:''}
    </div>
  </div><div class="fbody">`;

  /* Sistema */
  h+=`<div class="sec"><h3>O sistema</h3><div class="dados">
    <div class="dado"><div class="k">Potência</div><div class="v">${o.potencia_kwp?String(o.potencia_kwp).replace('.',','):'—'} <small>kWp</small></div></div>
    <div class="dado"><div class="k">Módulos</div><div class="v">${o.qtd_modulos||'—'}</div></div>
    <div class="dado"><div class="k">Ativado em</div><div class="v" style="font-size:13px">${dataBR(o.data_conclusao)}</div></div>
    <div class="dado"><div class="k">Registro</div><div class="v" style="font-size:13px">${D.fotos_total||0} fotos${D.videos_total?` · ${D.videos_total} vídeo${D.videos_total>1?'s':''}`:''}</div></div>
  </div></div>`;

  /* Aniversário */
  h+=`<div class="sec"><h3>Aniversário do cliente</h3>`;
  if(o.nascimento_dia){
    const mes=['','janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'][o.nascimento_mes];
    h+=`<div class="dado" style="display:flex;align-items:center;gap:12px">
      <div style="font-size:26px">🎂</div>
      <div style="flex:1"><div class="v" style="font-size:15px">${o.nascimento_dia} de ${mes}</div>
      <div style="font-size:11px;color:var(--muted);margin-top:2px">Parabéns automático às 9h no grupo</div></div>
      ${D.pode_agir?`<button class="chip" onclick="formAniversario('${o.id}',${o.nascimento_dia},${o.nascimento_mes})">alterar</button>`:''}
    </div>`;
  } else if(D.pode_agir){
    h+=`<button class="mini" onclick="formAniversario('${o.id}',null,null)">🎂 Adicionar data de aniversário</button>`;
  } else {
    h+=`<div class="vazio">Sem data cadastrada.</div>`;
  }
  h+=`<div id="fani"></div></div>`;

  /* Satisfação */
  h+=`<div class="sec"><h3>Satisfação</h3>`;
  if(n&&n.nota!=null){
    const cor=n.nota>=9?'var(--green-l)':(n.nota<=6?'#e07070':'var(--gold)');
    h+=`<div class="dado" style="padding:14px">
      <div style="display:flex;align-items:center;gap:14px">
        <div style="font-size:34px;font-weight:800;color:${cor};line-height:1">${n.nota}</div>
        <div style="flex:1">
          <div style="font-size:12.5px;font-weight:700">${n.nota>=9?'Promotor':(n.nota<=6?'Detrator':'Neutro')}</div>
          <div style="font-size:11.5px;color:var(--muted);margin-top:2px">respondeu ${quando(n.criado_em)}</div>
        </div>
      </div>
      ${n.comentario?`<div style="font-size:13px;margin-top:11px;line-height:1.55;font-style:italic;color:var(--muted)">"${esc(n.comentario)}"</div>`:''}
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:11px">
        ${n.brinde?`<span class="tag">${n.brinde==='copo'?'🥤 Copo térmico':'🎧 Fone'} · ${esc(n.voucher||'')}</span>`:''}
        ${n.entregue_em?'<span class="tag green">✓ brinde entregue</span>':(n.brinde?'<span class="tag gold">brinde pendente</span>':'')}
        ${n.avaliou_google_em?'<span class="tag green">✓ avaliou no Google</span>':(n.nota>=9?'<span class="tag gold">Google pendente</span>':'')}
      </div></div>`;
  } else {
    h+=`<div class="vazio">Ainda não respondeu a pesquisa.</div>`;
  }
  if(D.pode_agir){
    h+=`<button class="mini" style="margin-top:8px" onclick="formNPS('${o.id}',${n&&n.nota!=null?n.nota:'null'})">
      ${n&&n.nota!=null?'✏️ Corrigir registro':'➕ Registrar resposta que veio por fora'}</button>
      <div id="fnps"></div>`;
  }
  h+=`</div>`;

  /* Usinas do cliente — quem tem mais de uma chega no detalhe de cada uma daqui */
  const US = D.usinas || [];
  if(US.length || D.pode_agir){
    h+=`<div class="sec"><h3>Usina${US.length===1?'':'s'}`
      + (US.length>1?` <span class="tag">${US.length} medidores</span>`:'')
      + `</h3>`;
    if(!US.length){
      h+=`<div class="vazio">Nenhuma usina ligada a este cliente ainda. Sem usina não há
          monitoramento — e é a usina que traz a geração para esta tela.</div>`;
    }
    h+=`<div class="ulist">`;
    US.forEach(function(u){
      var cor = (u.gravidade<=2) ? '#e07070' : ((u.gravidade==3) ? 'var(--gold)' : 'var(--green-l)');
      // papel vem de obra_usina e ja existia desde sempre; so nunca tinha sido
      // mostrado. 'propria' e o normal, entao nao ganha selo.
      var selo = u.papel==='herdada' ? ' <span class="uext">herdada</span>'
               : (u.papel==='expansao' ? ' <span class="tag">expansão</span>' : '');
      h+=`<button class="urow" onclick="abrirUsina('${u.id}')" title="${esc(u.motivo||'')}">
        <div>
          <div class="uname">${esc(u.apelido||'Usina')}${u.principal?' <span class="tag">principal</span>':''}${selo}</div>
          <div class="umeta">${u.kwp!=null?u.kwp+' kWp':'potência não informada'}${u.cidade?' · '+esc(u.cidade):''}</div>
          ${u.endereco?`<div class="umeta">📍 ${esc(u.endereco)}</div>`:''}
        </div>
        <div class="uright">
          <div class="ust" style="color:${cor}">${esc(u.estado||'—')}</div>
          <div class="umeta">${u.kwh_ultimo_mes!=null?u.kwh_ultimo_mes+' kWh no mês passado':'sem leitura ainda'}</div>
        </div>
      </button>`;
    });
    h+=`</div>`;
    if(D.pode_agir){
      h+=`<button class="mini" style="margin-top:9px" onclick="formUsina('${o.id}')">➕ Adicionar usina</button>
          <div id="fusina"></div>`;
    }
    h+=`</div>`;
  }

  /* Plano de manutenção — quem chega pela aba Planos precisa ver isto aqui */
  const PL = D.plano;
  if(PL){
    const esperando = PL.status==='aguardando_pagamento';
    const dias = PL.dias==null?null:Number(PL.dias);
    const corP = esperando ? 'var(--gold)'
               : (dias!=null && dias<0 ? '#e07070'
                 : (dias!=null && dias<=60 ? 'var(--gold)' : 'var(--green-l)'));
    h+=`<div class="sec"><h3>Plano de manutenção</h3>`;
    h+=`<div class="dados">
      <div class="dado"><div class="k">Plano</div>
        <div class="v" style="font-size:13.5px">${esc(PL.nome||'—')}</div></div>
      <div class="dado"><div class="k">${esperando?'Valor combinado':'Valor'}</div>
        <div class="v" style="font-size:15px">${moedaBR(PL.valor)}<small>/${PL.forma==='mensal'?'mês':'ano'}</small></div></div>
      <div class="dado"><div class="k">Situação</div>
        <div class="v" style="font-size:13.5px;color:${corP}">${
          esperando ? 'aguardando o 1º pagamento'
          : (dias==null ? 'ativo'
             : (dias<0 ? 'venceu há '+Math.abs(dias)+' dias' : 'vence em '+dias+' dias'))
        }</div></div>
    </div>`;
    if(!esperando && PL.inicio){
      h+=`<div class="umeta" style="margin-top:7px">Vigência ${dataBR(PL.inicio)} a ${dataBR(PL.fim)}</div>`;
    }
    if(PL.nota_documento){
      h+=`<div class="umeta">Nota no ${String(PL.nota_documento).replace(/\D/g,'').length===14?'CNPJ':'CPF'} ${esc(PL.nota_documento)}</div>`;
    }
    if(PL.observacao){
      h+=`<div class="umeta" style="margin-top:6px;line-height:1.6">${esc(PL.observacao)}</div>`;
    }

    const VV = PL.visitas||[];
    if(VV.length){
      h+=`<div class="umeta" style="margin-top:11px;font-weight:800;color:var(--txt)">Visitas</div><div class="ulist">`;
      VV.forEach(function(v){
        const feita = v.status==='realizada';
        const dv = Number(v.dias);
        const cv = feita ? 'var(--green-l)' : (dv<0?'#e07070':(dv<=60?'var(--gold)':'var(--muted)'));
        h+=`<div class="urow" style="cursor:default">
          <div>
            <div class="uname">${esc(v.endereco||'endereço não informado')}</div>
            <div class="umeta" style="color:${cv}">${
              feita ? 'feita em '+dataBR(v.realizada_em)+(v.laudo_url?'':' · sem laudo')
                    : 'prevista para '+dataBR(v.prevista_para)+(dv<0?' · atrasada':'')
            }</div>
          </div>
        </div>`;
      });
      h+=`</div>`;
    } else if(esperando){
      h+=`<div class="umeta" style="margin-top:9px">As visitas são marcadas quando o
          primeiro pagamento entrar — uma para cada endereço.</div>`;
    }
    h+=`</div>`;
  }

  /* Autoleitura — o relógio do cliente, aqui dentro em vez de numa aba só dele */
  const ALS = D.autoleitura||[];
  if(ALS.length || D.pode_agir){
    h+=`<div class="sec"><h3>Autoleitura${ALS.length>1?` <span class="tag">${ALS.length} unidades</span>`:''}</h3>`;
    if(!ALS.length){
      h+=`<div class="vazio">Nenhuma unidade consumidora cadastrada. Cadastre quando a
          distribuidora não ler o relógio no local e quem informa for o cliente.</div>`;
    } else {
      h+=`<div class="ulist">`;
      ALS.forEach(function(u){
        const doCliente = u.responsavel==='cliente' && u.autoleitura;
        const dd = u.dias==null?null:Number(u.dias);
        const cor = !doCliente ? 'var(--muted)'
                  : (u.ja_avisado ? 'var(--green-l)'
                    : (dd!=null && dd<=1 ? 'var(--gold)' : 'var(--muted)'));
        h+=`<div class="urow" style="cursor:default">
          <div>
            <div class="uname">${esc(u.apelido||u.numero)}${u.apelido?` <span class="umeta">nº ${esc(u.numero)}</span>`:''}</div>
            <div class="umeta">${esc(u.distribuidora||'distribuidora não informada')}${
              u.proxima ? ` · próxima leitura ${dataBR(u.proxima)}` : ' · sem data cadastrada'}</div>
            <div class="umeta" style="color:${cor}">${
              !u.proxima ? 'cadastre as datas que a conta mostra'
              : (!doCliente ? 'leitura da distribuidora — o cliente não faz nada'
                : (u.ja_avisado ? 'cliente já avisado'
                  : `quem informa é o cliente · avisar em ${dataBR(u.avisar_em)}`))
            }${u.origem==='projetada'?' · <span class="uext">data estimada</span>':''}</div>
          </div>
          <div class="uright">${
            doCliente && !u.ja_avisado && u.texto && u.grupo
              ? `<button class="stb" onclick="flAvisar('${u.proxima_id}')">📤 Avisar</button>`
              : ''
          }</div>
        </div>
        ${listaDatas(u)}`;
      });
      h+=`</div>`;
    }
    if(D.pode_agir){
      h+=`<button class="mini" style="margin-top:9px" onclick="flFormAuto('${o.id}')">📷 Cadastrar unidade ou datas</button>
          <div id="fauto"></div>`;
    }
    h+=`</div>`;
  }

  /* Geração */
  const G=D.geracao;
  h+=`<div class="sec"><h3>Geração e desempenho</h3>`;
  if(G && (G.acumulado?.meses||0)>0){
    const a=G.acumulado;
    h+=`<div class="dados">
      <div class="dado"><div class="k">Acumulado</div><div class="v">${a.kwh||0} <small>kWh</small></div></div>
      <div class="dado"><div class="k">Economia</div><div class="v">R$ ${a.economia||0}</div></div>
      <div class="dado"><div class="k">Desempenho médio</div><div class="v" style="color:${a.desempenho_medio==null?'var(--muted)':((a.desempenho_medio>=90)?'var(--green-l)':((a.desempenho_medio>=75)?'var(--gold)':'#e07070'))}">${a.desempenho_medio!=null?a.desempenho_medio:'—'}${a.desempenho_medio!=null?'<small>%</small>':''}</div></div>
      <div class="dado"><div class="k">Meses registrados</div><div class="v">${a.meses}</div></div>
    </div>`;
    h+=`<table class="gtab"><tr><th>Mês</th><th class="num">kWh</th><th class="num">Desemp.</th><th class="num">Economia</th></tr>`;
    (G.meses||[]).slice(0,6).forEach(m=>{
      const p=m.referencia.split('-');
      /* sem desempenho apurado nao pinta de vermelho: falta base de comparacao,
         nao e mau desempenho */
      const cor = m.desempenho==null ? 'var(--muted)'
                : (m.desempenho>=90?'var(--green-l)':(m.desempenho>=75?'var(--gold)':'#e07070'));
      const rot = m.desempenho!=null ? m.desempenho+'%'
                : (m.parcial ? 'mês em curso' : 'sem base');
      h+=`<tr><td>${p[1]}/${p[0]}${m.parcial?' <span class="tag">parcial</span>':''}</td>
        <td class="num">${m.kwh||'—'}</td>
        <td class="num" style="color:${cor};font-weight:${m.desempenho!=null?800:500};font-size:${m.desempenho!=null?'inherit':'11px'}">${rot}</td>
        <td class="num">R$ ${m.economia||'—'}</td></tr>`;
    });
    h+=`</table>`;
  } else {
    var mv = G && G.motivo_vazio;
    var txt = (mv==='sem_usina')
      ? 'Esta obra não tem usina vinculada ao monitoramento — por isso não há geração aqui.'
      : (mv==='usina_sem_dado')
        ? 'A usina está cadastrada, mas ainda não enviou nenhuma leitura.'
        : 'Ainda não há um mês fechado de geração.';
    h+=`<div class="vazio">${txt}</div>`;
  }
  if(D.pode_agir){
    h+=`<button class="mini" style="margin-top:8px" onclick="formGeracao('${o.id}')">➕ Registrar geração do mês</button>
      <div id="fger"></div>`;
  }
  h+=`</div>`;

  /* Trilha — o elemento assinatura */
  const naoLidas = msgs.filter(m=>!m.lida_em).length;
  h+=`<div class="sec"><h3>A trilha do relacionamento`
    + ((naoLidas>1 && D.pode_agir)
       ? ` <button class="chip" style="float:right;font-weight:700" onclick="marcarTodas('${o.id}')">marcar as ${naoLidas} como tratadas</button>`
       : '')
    + `</h3>`;
  const eventos=[];
  if(o.data_conclusao) eventos.push({d:o.data_conclusao,tipo:'sis',t:'☀️ Sistema ativado',x:null});
  if(o.relatorio_enviado_em) eventos.push({d:o.relatorio_enviado_em,tipo:'sis',t:'📄 Relatório enviado no grupo',x:null});
  if(o.aceite_em) eventos.push({d:o.aceite_em,tipo:'sis',t:'✍️ Termo assinado'+(o.aceite_nome?' por '+esc(o.aceite_nome):''),x:null});
  if(n&&n.criado_em) eventos.push({d:n.criado_em,tipo:'cli',t:`⭐ Respondeu a pesquisa — nota ${n.nota}`,x:n.comentario});
  if(n&&n.avaliou_google_em) eventos.push({d:n.avaliou_google_em,tipo:'cli',t:'💚 Avaliou a Polaris no Google',x:null});
  if(o.iptu_avisado_em) eventos.push({d:o.iptu_avisado_em,tipo:'sis',t:'🏛️ Avisado sobre o IPTU Sustentável',x:null});
  msgs.forEach(m=>{
    const c=CTX[m.contexto]||CTX.geral;
    eventos.push({d:m.recebida_em,tipo:'cli',
      t:`${c.i} ${c.n}${m.remetente_nome?' — '+esc(m.remetente_nome):''}`,
      x:m.texto, id:m.id, ctx:m.contexto, lida:m.lida_em,
      ind:m.nome_indicado, fone:m.telefone_indicado});
  });
  eventos.sort((a,b)=>new Date(b.d)-new Date(a.d));

  if(!eventos.length){
    h+=`<div class="vazio">Nada registrado ainda.<br>Os contatos aparecem aqui conforme acontecem.</div>`;
  } else {
    h+='<div class="trilha">'+eventos.map(e=>{
      let ex='';
      if(e.ind) ex+=`<div style="margin-top:7px"><span class="tag gold">🤝 ${esc(e.ind)}${e.fone?' · '+esc(e.fone):''}</span></div>`;
      return `<div class="ev ${e.tipo==='cli'?'cli':'on'}">
        <div class="quando">${quando(e.d)} · ${dataBR(e.d)}</div>
        <div class="oque">${e.t}</div>
        ${e.x?`<div class="txt">${esc(e.x)}</div>`:''}
        ${ex}
        ${(e.id&&!e.lida&&D.pode_agir)?`<div style="margin-top:7px"><button class="chip" onclick="tratar(${e.id},'${o.id}')">marcar tratada</button></div>`:''}
      </div>`;
    }).join('')+'</div>';
  }
  h+=`</div>`;

  /* Ações */
  h+=`<div class="sec"><h3>Atalhos</h3><div class="acoes">
    <a class="ac" href="relatorio.html?id=${encodeURIComponent(o.slug)}" target="_blank">📄 Relatório</a>
    <a class="ac" href="cliente.html?id=${encodeURIComponent(o.slug)}" target="_blank">📱 Acompanhamento</a>
    ${o.telefone?`<a class="ac" href="https://wa.me/55${String(o.telefone).replace(/\D/g,'')}" target="_blank">💬 WhatsApp</a>`:''}
    <button class="ac pri" onclick="abrirCalc('${o.id}')">🧮 Orçar serviço</button>
  </div></div>`;

  h+='</div>';
  document.getElementById('ficha').innerHTML=h;
}

async function marcarTodas(obraId){
  if(!confirm('Marcar todas as mensagens deste cliente como tratadas?')) return;
  const r=await sb.rpc('marcar_todas_lidas',{p_obra:obraId});
  if(r.error||(r.data&&r.data.erro)){toast('Não foi possível marcar');return;}
  toast((r.data&&r.data.marcadas?r.data.marcadas:0)+' marcadas ✓');

  await abrirFicha(obraId);

  toast('Marcada como tratada ✓');

  await abrirFicha(obraId);
}

/* ===== RÉGUA ===== */
var APROV=[];
async function carregarRegua(){
  const r=await sb.rpc('get_regua_painel');
  if(r.error||!r.data){
    document.getElementById('rgbox').innerHTML='<div class="vazio">Não foi possível carregar a régua.</div>';
    return;
  }
  RG=r.data;
  const q=await sb.rpc('get_regua_aprovacoes');
  APROV=(q.error?[]:(q.data||[]));
  renderRegua();
}

async function decidirRegua(id, acao){
  const el=document.getElementById('rg-'+id);
  const txt=el?el.value:null;
  if(acao==='recusar' && !confirm('Recusar esta mensagem? Ela não será enviada.')) return;
  const r=await sb.rpc('regua_decidir',{p_id:id, p_acao:acao, p_texto:txt});
  if(r.error||(r.data&&r.data.erro)){ toast((r.data&&r.data.erro)||'Não deu certo'); return; }
  toast(acao==='aprovar'?'Aprovada — entra na fila ✓':'Recusada');
  carregarRegua();
}

function blocoAprovacao(){
  if(!APROV.length) return '';
  var h='<div class="sec" style="border-color:var(--gold)">'
    +'<h3>Escritas pela IA — esperando você <span class="thead">'+APROV.length+'</span></h3>'
    +'<div class="dica">Estas foram geradas a partir do que aconteceu na usina. Leia, ajuste se quiser e aprove.</div>';
  APROV.forEach(function(a){
    var alerta = a.motivo && a.motivo.indexOf('conferir numeros')===0;
    h+='<div class="apv">'
      +'<div class="apvtop"><b>'+esc(a.cliente||'')+'</b>'
      +(a.contrato?'<span class="uctag">'+esc(a.contrato)+'</span>':'')
      +'<span class="apvsit">'+esc(a.nome_modelo||a.modelo)+'</span></div>'
      +(a.motivo?'<div class="apvmot'+(alerta?' erro':'')+'">'+esc(a.motivo)+'</div>':'')
      +'<textarea class="apvtxt" id="rg-'+a.id+'">'+esc(a.texto)+'</textarea>'
      +(a.bloqueio?'<div class="apvmot erro">'+esc(a.bloqueio)+'</div>':'')
      +'<div class="apvacts">'
      +'<button class="stb" onclick="decidirRegua('+a.id+',\'aprovar\')">Aprovar</button>'
      +'<button class="stb" onclick="decidirRegua('+a.id+',\'recusar\')">Recusar</button>'
      +'</div></div>';
  });
  return h+'</div>';
}
let RGF='';
function setRgf(k){ RGF=(RGF===k?'':k); renderRegua(); }
function listaRgf(){
  const fila=RG.fila||[], ult=RG.ultimos||[];
  const hj=new Date().toISOString().slice(0,10);
  let arr=[], tit='';
  if(RGF==='hoje'){ arr=fila.filter(f=>f.quando<=hj && !f.bloqueio); tit='Para enviar hoje'; }
  else if(RGF==='prox'){
    const lim=new Date(Date.now()+7*864e5).toISOString().slice(0,10);
    arr=fila.filter(f=>f.quando>hj && f.quando<=lim); tit='Próximos 7 dias'; }
  else if(RGF==='bloq'){ arr=fila.filter(f=>!!f.bloqueio); tit='Bloqueados'; }
  else if(RGF==='env'){ arr=ult.slice(); tit='Enviados nos últimos 30 dias'; }
  else if(RGF==='todos'){ arr=fila.slice(); tit='Todos na régua'; }

  let h='<div class="sec" style="border-color:var(--gold)">'+
    '<h3 style="display:flex;align-items:center;gap:8px">'+esc(tit)+' — '+arr.length+
    '<button class="stb" style="margin-left:auto" onclick="setRgf(\''+RGF+'\')">✕ fechar</button></h3>';
  if(!arr.length){
    var hojeStr=new Date().toISOString().slice(0,10);
    var enviadasHoje=(RG.ultimos||[]).filter(function(u){
      return u.enviado_em && String(u.enviado_em).slice(0,10)===hojeStr; }).length;
    var prox=(RG.fila||[]).filter(function(f){ return f.quando>hojeStr; });
    var msg='Nenhum cliente aqui.';
    if(RGF==='hoje'){
      msg = enviadasHoje
        ? '<b>'+enviadasHoje+' mensagem'+(enviadasHoje>1?'s':'')+' já enviada'+(enviadasHoje>1?'s':'')+' hoje.</b> Nada mais para agora.'
        : 'Nada programado para hoje.';
      if(prox.length){
        var d=prox.map(function(f){return f.quando;}).sort()[0];
        msg += ' Próxima em '+dataBR(d)+'.';
      }
    }
    h+='<div class="vazio">'+msg+'</div>';
  }
  for(let i=0;i<arr.length;i++){
    const f=arr[i];
    const quando = f.enviado_em ? dataBR(f.enviado_em)
                 : (f.quando<=hj ? 'hoje' : dataBR(f.quando));
    const clic = !!f.obra_id;
    h+='<div class="chkline"'+(clic?' onclick="abrirFicha(\''+f.obra_id+'\')"':' style="cursor:default"')+'>'+
      '<span style="font-size:19px;flex-shrink:0">'+(f.icone||'📨')+'</span>'+
      '<div class="cn"><b>'+esc(f.cliente)+'</b><span>'+esc(f.nome_modelo||f.modelo||'')+
      ' · '+esc(quando||'')+(f.bloqueio?' · ⚠️ '+esc(f.bloqueio):'')+'</span></div>'+
      (clic?'<span style="color:var(--muted);font-size:15px">›</span>':'')+'</div>';
  }
  if(RGF==='env') h+='<div class="dica">Mostra os 15 envios mais recentes.</div>';
  return h+'</div>';
}
function renderRegua(){
  const R=RG.resumo||{}, fila=RG.fila||[], ult=RG.ultimos||[];
  const _aprov = blocoAprovacao();
  const hoje=fila.filter(f=>f.quando<=new Date().toISOString().slice(0,10));
  const prox=fila.filter(f=>f.quando>new Date().toISOString().slice(0,10));

  let h=_aprov;
  if(RG.pode_agir){
    h+=`<div class="liga">
      <div class="txt">
        <div class="tt">${RG.ativa?'✅ Régua ativa':'⏸️ Régua pausada'}</div>
        <div class="sb">${RG.ativa
          ? `Envia até ${RG.por_dia} contatos por dia útil, às 11h. Cada envio respeita 6 segundos de intervalo.`
          : 'Nenhum contato está sendo enviado automaticamente. Você ainda pode disparar manualmente abaixo.'}</div>
      </div>
      <label class="sw"><input type="checkbox" ${RG.ativa?'checked':''} onchange="ligarRegua(this.checked)"><span class="tr"></span></label>
    </div>`;
  }

  h+=`<div id="optbox"></div>`;
  h+=`<div class="rgstat">
    <button class="rgs ${R.hoje?'hot':''} ${RGF==='hoje'?'sel':''}" onclick="setRgf('hoje')"><div class="n">${R.hoje||0}</div><div class="l">Para enviar hoje</div></button>
    <button class="rgs ${RGF==='prox'?'sel':''}" onclick="setRgf('prox')"><div class="n">${R.proximos7||0}</div><div class="l">Próximos 7 dias</div></button>
    <button class="rgs ${R.bloqueados?'blk':''} ${RGF==='bloq'?'sel':''}" onclick="setRgf('bloq')"><div class="n">${R.bloqueados||0}</div><div class="l">Bloqueados</div></button>
    <button class="rgs ${RGF==='env'?'sel':''}" onclick="setRgf('env')"><div class="n">${R.enviados_30d||0}</div><div class="l">Enviados em 30 dias</div></button>
    <button class="rgs ${RGF==='todos'?'sel':''}" onclick="setRgf('todos')"><div class="n">${R.clientes_na_regua||0}</div><div class="l">Clientes na régua</div></button>
  </div>`;
  if(RGF) h+=listaRgf();

  if(hoje.length){
    h+=`<div class="sec"><h3>Para enviar hoje</h3>`+hoje.map(f=>linhaRegua(f,true)).join('')+`</div>`;
  } else {
    h+=`<div class="vazio">Nada para enviar hoje. 👏</div>`;
  }

  if(prox.length){
    h+=`<div class="sec"><h3>Próximos dias</h3>`+prox.slice(0,20).map(f=>linhaRegua(f,false)).join('')+`</div>`;
  }

  if(ult.length){
    h+=`<div class="sec"><h3>Últimos enviados</h3>`+ult.map(u=>{
      const d=new Date(u.enviado_em);
      return `<div class="rgrow"><div class="l1"><span class="ic">${u.icone||'📬'}</span>
        <span class="cl">${esc(u.cliente)}</span>
        <span class="qd">${d.toLocaleDateString('pt-BR')}</span></div>
        <div class="mo">${esc(u.nome_modelo)}</div></div>`;
    }).join('')+`</div>`;
  }

  document.getElementById('rgbox').innerHTML=h;
  carregarOptin();
}

/* ===== CAMPANHA DE AUTORIZAÇÃO ===== */

    <div style="display:flex;align-items:center;gap:11px">
      <div class="txt">
        <div class="tt">🔓 Autorização para indicação</div>
        <div class="sb">${o.autorizados} de ${o.total_ativos} clientes autorizaram (${pct}%). Sem isso, os pedidos de indicação ficam bloqueados.</div>
      </div>
    </div>
    <div style="height:7px;background:var(--card2);border-radius:20px;overflow:hidden">
      <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--green),var(--green-l));transition:width .4s"></div>
    </div>
    <div style="display:flex;gap:7px;flex-wrap:wrap;font-size:11px">
      <span class="tag green">✓ ${o.autorizados} autorizaram</span>
      <span class="tag">⏳ ${o.pedido_enviado} aguardando resposta</span>
      <span class="tag">📭 ${o.nunca_pedido} sem pedido</span>
      ${o.recusados?`<span class="tag red">✕ ${o.recusados} recusaram</span>`:''}
    </div>
    ${(o.pode_agir && o.nunca_pedido)?`<div style="display:flex;gap:7px;flex-wrap:wrap">
      <button class="mini" style="flex:1" onclick="verTextoOptin()">👁️ ver o texto</button>
      <button class="mini" style="flex:1;border-style:solid;border-color:var(--green);color:var(--green-l)"
        onclick="dispararOptin()">📤 pedir para ${Math.min(o.por_dia,o.nunca_pedido)} clientes</button>
    </div>
    <div id="optxt"></div>`:''}
  </div>`;
}
function verTextoOptin(){
  const el=document.getElementById('optxt');
  if(el.innerHTML){ el.innerHTML=''; return; }
  el.innerHTML=`<div class="prev">${esc((OPT.texto||'').replace(/\{nome\}/g,'Mario'))}</div>
    <div class="dica" style="margin-top:7px">A mensagem só pede permissão — não oferece nada. Quem responder <b>SIM</b> é autorizado automaticamente; quem responder <b>NÃO</b> sai da lista. Sem resposta, o sistema não insiste.</div>`;
}
async function dispararOptin(){
  const q=Math.min(OPT.por_dia, OPT.nunca_pedido);
  if(!confirm(`Enviar o pedido de autorização para ${q} cliente(s)?\n\nSão os que ainda não receberam. Cada envio tem 7 segundos de intervalo.`)) return;
  toast('Enviando pedidos...');
  const r=await sb.functions.invoke('campanha-optin',{body:{}});
  if(r.error||(r.data&&r.data.error)){ toast('Erro: '+((r.data&&r.data.error)||r.error.message)); return; }
  toast(`${r.data.enviados} pedido(s) enviado(s) ✓`);
  carregarOptin();
}
function linhaRegua(f, ehHoje){
  const q=f.quando.split('-');
  const lim=f.data_limite.split('-');
  return `<div class="rgrow ${f.bloqueio?'bloq':(ehHoje?'hoje':'')}" id="rg${f.id}">
    <div class="l1"><span class="ic">${f.icone||'📬'}</span>
      <span class="cl">${esc(f.cliente)}${f.contrato?` <span style="color:var(--muted);font-weight:600;font-size:11.5px">#${esc(f.contrato)}</span>`:''}</span>
      <span class="qd">${ehHoje?'hoje':q[2]+'/'+q[1]}</span></div>
    <div class="mo">${esc(f.nome_modelo)} · ${f.dias_ativo} dias de ativo · janela até ${lim[2]}/${lim[1]}</div>
    ${f.bloqueio?`<div class="bq">⚠️ ${esc(f.bloqueio)}</div>`:''}
    ${RG.pode_agir?`<div class="ac">
      <button onclick="previaRegua(${f.id})">👁️ ver texto</button>
      ${!f.bloqueio?`<button class="go" onclick="enviarRegua(${f.id},'${esc(f.cliente)}')">📤 enviar agora</button>`:''}
      <button onclick="adiarRegua(${f.id})">⏰ adiar 7 dias</button>
      <button onclick="cancelarRegua(${f.id})">✕ cancelar</button>
    </div>`:''}
    <div id="pv${f.id}"></div>
  </div>`;
}
async function ligarRegua(v){
  if(v && !confirm('Ativar a régua?\n\nA partir de agora o sistema envia automaticamente os contatos programados, todo dia útil às 17h.')){
    renderRegua(); return;
  }
  /* Passa pela RPC, e nao por update direto na config: a tabela tem RLS
     ligada e nenhuma policy de escrita, entao o update nao altera nada e
     ainda assim devolve sucesso. ligar_automacao e security definer,
     confere is_autorizado() e grava de verdade. */
  const r=await sb.rpc('ligar_automacao',{p_chave:'regua_ativa', p_ligar:v});
  if(r.error||!r.data||r.data.erro){ toast((r.data&&r.data.erro)||'Não deu certo'); renderRegua(); return; }
  toast(v?'Régua ativada ✅':'Régua pausada');
  await recarregarTudo();
}
async function previaRegua(id){
  const el=document.getElementById('pv'+id);
  if(el.innerHTML){ el.innerHTML=''; return; }
  const r=await sb.rpc('regua_previa',{p_id:id});
  if(r.error||!r.data||r.data.erro){ toast('Não foi possível carregar'); return; }
  el.innerHTML=`<div class="prev">${esc(r.data.texto||'')}</div>`;
}
async function enviarRegua(id, cliente){
  if(!confirm('Enviar este contato para '+cliente+' agora?')) return;
  toast('Enviando...');
  const s=await sb.auth.getSession();
  const r=await sb.functions.invoke('regua-disparo',{body:{contato_id:id}});
  if(r.error||(r.data&&r.data.error)){ toast('Erro: '+((r.data&&r.data.error)||r.error.message)); return; }
  toast('Enviado ✓');
  await recarregarTudo();
}
async function adiarRegua(id){
  const r=await sb.rpc('regua_adiar',{p_id:id,p_dias:7});
  if(r.error||(r.data&&r.data.erro)){ toast((r.data&&r.data.erro)||'Erro ao adiar'); return; }
  toast('Adiado por 7 dias');
  await recarregarTudo();
}
async function cancelarRegua(id){
  if(!confirm('Cancelar este contato?\n\nEle não será enviado a este cliente.')) return;
  const r=await sb.rpc('regua_cancelar',{p_id:id});
  if(r.error){ toast('Erro'); return; }
  toast('Contato cancelado');
  await recarregarTudo();
}


/* ===== INDICAÇÕES ===== */
let IND=null, IFILTRO='';
const ST={
  nova:{n:'Nova',i:'🆕'}, contatada:{n:'Contatada',i:'📞'},
  visita_agendada:{n:'Visita agendada',i:'📅'}, visita_feita:{n:'Visita feita',i:'✅'},
  proposta:{n:'Proposta enviada',i:'📄'}, fechada:{n:'Fechada',i:'🎉'}, perdida:{n:'Perdida',i:'✕'}
};
async function carregarIndic(){
  const r=await sb.rpc('get_indicacoes');
  if(r.error||!r.data){
    document.getElementById('inbox').innerHTML='<div class="vazio">Não foi possível carregar.</div>';
    return;
  }
  IND=r.data; renderIndic();
}
function renderIndic(){
  const R=IND.resumo||{}, L=IND.lista||[], RK=IND.ranking||[];
  let h='';

  h+=`<div class="funil">
    <button class="fcol ${IFILTRO===''?'on':''}" onclick="setIF('')"><div class="n">${R.total||0}</div><div class="l">Todas</div></button>
    <button class="fcol ${IFILTRO==='nova'?'on':''}" onclick="setIF('nova')"><div class="n" style="color:var(--gold)">${R.novas||0}</div><div class="l">Novas</div></button>
    <button class="fcol ${IFILTRO==='andamento'?'on':''}" onclick="setIF('andamento')"><div class="n">${R.em_andamento||0}</div><div class="l">Em andamento</div></button>
    <button class="fcol ${IFILTRO==='fechada'?'on':''}" onclick="setIF('fechada')"><div class="n" style="color:var(--green-l)">${R.fechadas||0}</div><div class="l">Fechadas</div></button>
    <button class="fcol ${IFILTRO==='perdida'?'on':''}" onclick="setIF('perdida')"><div class="n" style="color:#e07070">${R.perdidas||0}</div><div class="l">Perdidas</div></button>
  </div>`;

  h+=`<div class="rgstat">
    <div class="rgs ${R.a_pagar>0?'hot':''}"><div class="n">R$ ${Math.round(R.a_pagar||0)}</div><div class="l">A pagar</div></div>
    <div class="rgs"><div class="n">R$ ${Math.round(R.pago_total||0)}</div><div class="l">Já pago</div></div>
    <div class="rgs"><div class="n">${R.conversao!=null?R.conversao+'%':'—'}</div><div class="l">Taxa de conversão</div></div>
  </div>`;

  if(IND.pode_agir){
    h+=`<button class="mini" style="margin-bottom:12px" onclick="formIndic()">➕ Registrar indicação manualmente</button><div id="fin"></div>`;
  }

  let arr=L.slice();
  if(IFILTRO==='andamento') arr=arr.filter(i=>['contatada','visita_agendada','visita_feita','proposta'].includes(i.status));
  else if(IFILTRO) arr=arr.filter(i=>i.status===IFILTRO);

  if(!arr.length){
    h+=`<div class="vazio">Nenhuma indicação ${IFILTRO?'neste status':'registrada ainda'}.<br>
      <span style="font-size:11.5px;opacity:.8">Quando um cliente indicar alguém no grupo, ela aparece aqui automaticamente.</span></div>`;
  } else {
    h+='<div class="sec"><h3>Indicações</h3>'+arr.map(i=>cardIndic(i)).join('')+'</div>';
  }

  if(RK.length){
    h+='<div class="sec"><h3>🏆 Ranking de indicadores</h3>'+RK.map((r,ix)=>`
      <div class="rank"><div class="pos">${ix+1}º</div>
        <div class="inf"><div class="nm">${r.icone||''} ${esc(r.cliente)}</div>
        <div class="sb">${r.conversoes} fechada${r.conversoes!=1?'s':''} de ${r.total} · ${esc(r.nivel||'—')}</div></div>
        <div class="vl">R$ ${Math.round(r.ganhou||0)}</div>
      </div>`).join('')+'</div>';
  }

  document.getElementById('inbox').innerHTML=h;
}
function cardIndic(i){
  const s=ST[i.status]||{n:i.status,i:'•'};
  const cls=i.status==='fechada'?'fech':(i.status==='perdida'?'perd':'');
  const d=new Date(i.criado_em);
  let opts='';
  Object.keys(ST).forEach(k=>{ opts+=`<option value="${k}" ${k===i.status?'selected':''}>${ST[k].i} ${ST[k].n}</option>`; });
  return `<div class="icard ${cls}" id="ic${i.id}">
    <div class="t1"><span class="nm">${esc(i.nome_indicado)}</span><span class="cod">${esc(i.codigo)}</span></div>
    <div class="via">indicado por <b>${esc(i.indicador)}</b>${i.cidade?' · '+esc(i.cidade):''}</div>
    ${i.telefone_indicado?`<div class="via">📱 ${esc(i.telefone_indicado)}</div>`:''}
    ${i.vendedor?`<div class="via">👔 ${esc(i.vendedor)}</div>`:''}
    <div class="via" style="font-size:11px;opacity:.75">${d.toLocaleDateString('pt-BR')} · ${quando(i.criado_em)}${i.origem==='whatsapp'?' · detectada pela IA':''}</div>
    ${i.valor_previsto?`<div class="vl">R$ ${Number(i.valor_previsto).toFixed(2).replace('.',',')}
      ${i.bonus_clube_pct>0?`<small>(inclui +${i.bonus_clube_pct}% do Clube)</small>`:''}</div>`:''}
    ${i.motivo_perda?`<div class="via" style="color:#e07070">✕ ${esc(i.motivo_perda)}</div>`:''}
    ${IND.pode_agir?`<div class="st">
      <select onchange="mudarStatus(${i.id}, this.value)">${opts}</select>
      ${(i.telefone_indicado)?`<a class="bt" href="https://wa.me/55${String(i.telefone_indicado).replace(/\D/g,'')}" target="_blank" style="text-decoration:none">💬 WhatsApp</a>`:''}
      ${i.visita_em?`<button class="bt ${i.pago1?'pago':'pg'}" ${i.pago1?'':'onclick="pagarIndic('+i.id+',1)"'}>
        ${i.pago1?'✓ etapa 1 paga':'💰 pagar R$ 50'}</button>`:''}
      ${(i.status==='fechada'&&i.valor_etapa2)?`<button class="bt ${i.pago2?'pago':'pg'}" ${i.pago2?'':'onclick="pagarIndic('+i.id+',2)"'}>
        ${i.pago2?'✓ etapa 2 paga':'💰 pagar R$ '+Math.round(i.valor_etapa2)}</button>`:''}
    </div>`:''}
    <div id="fc${i.id}"></div>
  </div>`;
}
function setIF(f){ IFILTRO=(IFILTRO===f)?'':f; renderIndic(); }

async function mudarStatus(id, st){
  if(st==='fechada'){ formFechar(id); return; }
  if(st==='perdida'){
    const m=prompt('Por que a indicação foi perdida?\n(preço, escolheu outra empresa, desistiu...)');
    if(m===null) { renderIndic(); return; }
    const r=await sb.rpc('indicacao_status',{p_id:id,p_status:'perdida',p_motivo:m||null});
    if(r.error){ toast('Erro'); return; }
    toast('Registrado'); carregarIndic(); return;
  }
  const r=await sb.rpc('indicacao_status',{p_id:id,p_status:st});
  if(r.error||(r.data&&r.data.erro)){ toast('Erro ao atualizar'); return; }
  toast('Status atualizado ✓'); carregarIndic();
}
function formFechar(id){
  const el=document.getElementById('fc'+id);
  el.innerHTML=`<div class="reg">
    <div class="lin">
      <div class="cp"><label>Potência (kWp)</label><input type="number" id="fk${id}" step="0.01" placeholder="8.5"></div>
      <div class="cp"><label>Valor do contrato</label><input type="number" id="fv${id}" step="0.01" placeholder="18000"></div>
    </div>
    <button class="salvar" onclick="confirmarFechar(${id})">🎉 Confirmar fechamento</button>
    <div class="dica">A potência define a faixa da recompensa. O valor do contrato só é usado acima de 30 kWp (1,5%).</div>
  </div>`;
}
async function confirmarFechar(id){
  const k=document.getElementById('fk'+id).value;
  if(!k){ toast('Informe a potência'); return; }
  const v=document.getElementById('fv'+id).value;
  const r=await sb.rpc('indicacao_status',{p_id:id,p_status:'fechada',
    p_kwp:parseFloat(k), p_contrato:v?parseFloat(v):null});
  if(r.error||(r.data&&r.data.erro)){ toast('Erro'); return; }
  const c=r.data&&r.data.calculo;
  toast(c?`Fechada! Recompensa: R$ ${c.valor_total}`:'Fechada ✓');
  carregarIndic();
}
async function pagarIndic(id, etapa){
  if(!confirm('Confirmar que o PIX da etapa '+etapa+' foi enviado?')) return;
  const r=await sb.rpc('indicacao_pagar',{p_id:id,p_etapa:etapa});
  if(r.error){ toast('Erro'); return; }
  toast('Pagamento registrado ✓'); carregarIndic();
}
function formIndic(){
  const el=document.getElementById('fin');
  if(el.innerHTML){ el.innerHTML=''; return; }
  const cl=(DADOS&&DADOS.clientes)||[];
  const opts=cl.map(c=>`<option value="${c.id}">${esc(c.cliente)}</option>`).join('');
  el.innerHTML=`<div class="reg">
    <div class="cp" style="margin-bottom:9px"><label>Quem indicou</label>
      <select id="i_ind">${opts}</select></div>
    <div class="lin">
      <div class="cp"><label>Nome do indicado</label><input id="i_nome" placeholder="João da Silva"></div>
      <div class="cp"><label>Telefone</label><input id="i_fone" placeholder="18 99999-0000"></div>
    </div>
    <div class="cp" style="margin-bottom:9px"><label>Observação</label>
      <input id="i_obs" placeholder="vizinho, viu as placas..."></div>
    <button class="salvar" onclick="salvarIndic()">Registrar indicação</button>
  </div>`;
}
async function salvarIndic(){
  const ind=document.getElementById('i_ind').value;
  const nome=document.getElementById('i_nome').value.trim();
  if(!nome){ toast('Informe o nome do indicado'); return; }
  const r=await sb.rpc('registrar_indicacao',{
    p_indicador:ind, p_nome:nome,
    p_telefone:document.getElementById('i_fone').value.trim()||null,
    p_obs:document.getElementById('i_obs').value.trim()||null,
    p_origem:'manual'
  });
  if(r.error||(r.data&&r.data.erro)){ toast('Erro: '+((r.data&&r.data.erro)||r.error.message)); return; }
  toast('Indicação '+r.data.codigo+' registrada ✓');
  carregarIndic();
}


/* ===== CALCULADORA ===== */
let CALC_OBRA=null;
async function abrirCalc(obraId){
  CALC_OBRA=obraId||null;
  const ov=document.getElementById('ov'), f=document.getElementById('ficha');
  let pre={modulos:'',km:'',cliente:null};
  if(obraId){
    const d=await sb.rpc('dados_calculadora',{p_obra:obraId});
    if(d.data&&!d.data.erro) pre={modulos:d.data.modulos||'',km:d.data.km_estimado||'',
      cliente:d.data.cliente, assinatura:d.data.assinatura};
  }
  f.innerHTML=`<div class="fhead">
    <button class="fechar" onclick="fecharFicha()">✕</button>
    <div class="nome">🧮 Calculadora de serviços</div>
    <div class="meta">${pre.cliente?esc(pre.cliente):'Orçamento avulso'}</div>
  </div><div class="fbody calc">
    ${pre.assinatura?`<div class="dado" style="margin-bottom:14px;border-color:var(--green-l)">
      <div class="k">Plano ativo</div><div class="v" style="font-size:14px">${esc(pre.assinatura.nome)} · R$ ${pre.assinatura.valor}</div></div>`:''}
    <div class="reg" style="margin-top:0">
      <div class="lin">
        <div class="cp"><label>Módulos</label><input type="number" id="c_mod" value="${pre.modulos}" placeholder="15"></div>
        <div class="cp"><label>Distância (km)</label><input type="number" id="c_km" value="${pre.km}" placeholder="30"></div>
      </div>
      <div class="lin">
        <div class="cp"><label>Tipo</label><select id="c_tipo">
          <option value="preventiva">🔍 Preventiva (limpeza + inspeção)</option>
          <option value="corretiva">🔧 Corretiva (com problema)</option>
        </select></div>
        <div class="cp" style="max-width:110px"><label>Visitas na rota</label>
          <select id="c_rota"><option value="1">1</option><option value="2" selected>2</option>
          <option value="3">3</option><option value="4">4</option></select></div>
      </div>
      <button class="salvar" onclick="rodarCalc()">Calcular</button>
      <div class="dica">A rota divide o deslocamento. Agrupar visitas na mesma região aumenta bastante a margem.</div>
    </div>
    <div id="cres"></div>
    <div id="cplanos"></div>
  </div>`;
  ov.classList.add('on');
  if(pre.modulos) setTimeout(rodarCalc, 120);
}
async function rodarCalc(){
  const m=parseInt(document.getElementById('c_mod').value,10);
  if(!m){ toast('Informe a quantidade de módulos'); return; }
  const km=parseFloat(document.getElementById('c_km').value)||0;
  const tipo=document.getElementById('c_tipo').value;
  const rota=parseInt(document.getElementById('c_rota').value,10);

  const r=await sb.rpc('calcular_visita',{p_modulos:m,p_km:km,p_tipo:tipo,p_rota:rota});
  const el=document.getElementById('cres');
  if(r.error||!r.data){ el.innerHTML='<div class="vazio">Erro no cálculo.</div>'; return; }
  const d=r.data;
  if(d.sob_consulta){
    el.innerHTML=`<div class="res"><div class="big">Sob consulta<small>${d.modulos} módulos — acima da tabela</small></div>
      <div class="dica" style="margin-top:9px">Sistemas acima de 45 módulos exigem orçamento específico. Considere o custo de ${d.modulos} × R$ 15 = R$ ${d.modulos*15} de equipe, mais deslocamento.</div></div>`;
    return;
  }
  el.innerHTML=`<div class="res">
    <div class="big">R$ ${Number(d.preco_final).toFixed(2).replace('.',',')}<small>${esc(d.faixa_nome)} · ${d.tipo}</small></div>
    <div style="margin-top:14px">
      <div class="brk"><span>Equipe (${d.modulos} × R$ 15)</span><span>R$ ${Number(d.custo_equipe).toFixed(2)}</span></div>
      <div class="brk"><span>Deslocamento (${d.km} km ÷ ${d.rota} visitas)</span><span>R$ ${Number(d.custo_deslocamento).toFixed(2)}</span></div>
      <div class="brk"><span>Custo total</span><span>R$ ${Number(d.custo_total).toFixed(2)}</span></div>
      <div class="brk"><span>Preço de tabela</span><span>R$ ${Number(d.preco_tabela).toFixed(2)}</span></div>
      ${d.adicional_km>0?`<div class="brk"><span>Adicional de km</span><span>R$ ${Number(d.adicional_km).toFixed(2)}</span></div>`:''}
      <div class="brk tot"><span>Margem</span><span>R$ ${Number(d.margem).toFixed(2)} (${d.margem_pct}%)</span></div>
    </div>
    ${d.alerta?`<div class="al">⚠️ ${esc(d.alerta)}</div>`:''}
  </div>`;
  mostrarPlanos(m);
}
async function mostrarPlanos(mods){
  const r=await sb.rpc('planos_para',{p_modulos:mods});
  const el=document.getElementById('cplanos');
  if(r.error||!r.data||!r.data.length){ el.innerHTML=''; return; }
  el.innerHTML=`<div class="sec"><h3>Planos para este sistema</h3>`+r.data.map(p=>`
    <div class="plano" ${CALC_OBRA?`onclick="assinar('${p.codigo}','${esc(p.nome)}',${p.anual})"`:''}>
      <div class="ph"><span style="font-size:19px">${p.icone}</span>
        <span class="pn">${esc(p.nome)}</span>
        <span class="pp">${p.cortesia?'Cortesia':'R$ '+p.anual}<small>${p.cortesia?' 1º ano':'/ano'}</small></span></div>
      <div class="pd">${p.cortesia?'Solarz, relatório no app e alerta de falha — cortesia no primeiro ano.'
        :(p.visita?`Monitoramento ativo + <b>1 visita técnica anual com limpeza e laudo</b> · ${p.desconto}% de desconto em serviços · R$ ${p.mensal}/mês`
        :`Monitoramento por equipe, relatório mensal, suporte prioritário e auxílio com a concessionária · ${p.desconto}% de desconto · R$ ${p.mensal}/mês`)}</div>
    </div>`).join('')+
    (CALC_OBRA?'<div class="dica">Toque no plano para registrar a assinatura deste cliente.</div>':'')+
    `</div>`;
}
async function assinar(plano, nome, valor){
  if(!CALC_OBRA) return;
  const per=confirm(`Registrar o plano ${nome}?\n\nOK = anual (R$ ${valor})\nCancelar = escolher mensal`)?'anual':null;
  if(per===null){
    if(!confirm('Registrar como plano MENSAL?')) return;
  }
  const r=await sb.rpc('registrar_assinatura',{p_obra:CALC_OBRA,p_plano:plano,
    p_periodicidade:per||'mensal'});
  if(r.error||(r.data&&r.data.erro)){ toast('Erro: '+((r.data&&r.data.erro)||r.error.message)); return; }
  toast(`Plano registrado ✓ Vence em ${new Date(r.data.vencimento).toLocaleDateString('pt-BR')}`);
  fecharFicha();
}

boot();
</script>
