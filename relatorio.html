<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#04141F">
<title>Relatório de Instalação — Polaris Energia Solar</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#04141F; --navy2:#0A2536; --ink:#0E2438;
  --gold:#D6A518; --gold-soft:rgba(214,165,24,.55);
  --green:#3B8B3B;
  --paper:#F4F4F1; --card:#FFFFFF; --line:#E4E4DE;
  --txt:#22323E; --mut:#7A8893;
}
html{scroll-behavior:smooth}
body{font-family:'Manrope',sans-serif;background:var(--paper);color:var(--txt);-webkit-font-smoothing:antialiased}
img{display:block}

/* ============ HERO ============ */
.hero{position:relative;min-height:92vh;background:var(--navy);color:#fff;
display:flex;flex-direction:column;overflow:hidden}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center;
filter:saturate(1.05)}
.hero .veil{position:absolute;inset:0;background:
linear-gradient(180deg,rgba(4,20,31,.35) 0%,rgba(4,20,31,.55) 45%,rgba(4,20,31,.94) 100%)}
.hero .in{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;
max-width:920px;width:100%;margin:0 auto;padding:34px 26px 46px}
.hero .top{display:flex;justify-content:center}
.hero .top img{height:44px;filter:drop-shadow(0 4px 18px rgba(0,0,0,.4))}
.hero .top .lgB{display:none}
@media print{.hero .top .lgW{display:none}.hero .top .lgB{display:block;filter:none}}
.hero .mid{margin:auto 0;text-align:center;padding:60px 0 30px}
.hero .kicker{font-size:11px;font-weight:700;letter-spacing:5px;color:var(--gold);text-transform:uppercase}
.hero h1{font-size:clamp(34px,7vw,58px);font-weight:800;line-height:1.06;margin:16px 0 0;letter-spacing:-.5px}
.hero .rule{width:64px;height:2px;background:var(--gold);margin:26px auto 0;opacity:.9}
.hero .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:2px;
margin-top:auto;border-top:1px solid rgba(255,255,255,.14);padding-top:22px}
.hero .meta .m{padding:6px 10px;text-align:center}
.hero .meta .k{font-size:9.5px;font-weight:700;letter-spacing:2.5px;color:rgba(255,255,255,.55);text-transform:uppercase}
.hero .meta .v{font-size:15px;font-weight:700;margin-top:6px}
.hero .meta .v.gold{color:var(--gold)}
.scroll{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:2;
color:rgba(255,255,255,.5);font-size:18px;animation:fl 2s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,7px)}}

/* ============ ESTRUTURA ============ */
.wrap{max-width:920px;margin:0 auto;padding:0 22px}
section{padding:64px 0}
.shead{margin-bottom:34px}
.shead .n{font-size:12px;font-weight:800;letter-spacing:4px;color:var(--gold);text-transform:uppercase}
.shead h2{font-size:clamp(22px,4vw,30px);font-weight:800;color:var(--ink);margin-top:8px;letter-spacing:-.3px}
.shead .hl{width:100%;height:1px;background:var(--line);margin-top:20px;position:relative}
.shead .hl::before{content:'';position:absolute;left:0;top:-1px;width:70px;height:3px;background:var(--gold);border-radius:2px}

/* stats */
.stats{background:var(--card);border:1px solid var(--line);border-radius:20px;
display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));overflow:hidden;
box-shadow:0 18px 50px rgba(14,36,56,.06)}
.stat{padding:26px 22px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat .k{font-size:10px;font-weight:800;letter-spacing:2.5px;color:var(--mut);text-transform:uppercase}
.stat .v{font-size:24px;font-weight:800;color:var(--ink);margin-top:9px;letter-spacing:-.5px}
.stat .v small{font-size:13px;font-weight:700;color:var(--mut)}
.stat .s{font-size:12px;color:var(--mut);margin-top:4px;font-weight:600}

/* ============ FOTOS ============ */
.iSec{margin-bottom:52px}
.iHead{display:flex;align-items:baseline;gap:16px;margin-bottom:6px}
.iHead .ix{font-size:26px;font-weight:300;color:var(--gold);letter-spacing:1px;min-width:44px}
.iHead h3{font-size:18px;font-weight:800;color:var(--ink)}
.iDesc{font-size:13px;color:var(--mut);margin:2px 0 18px 60px;max-width:560px;line-height:1.55}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid .ph{position:relative;border-radius:16px;overflow:hidden;background:#dfe2dd;
aspect-ratio:4/3;cursor:zoom-in;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.grid .ph:first-child{grid-column:span 2;grid-row:span 2;aspect-ratio:auto}
.grid .ph img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.grid .ph::after{content:'⤢';position:absolute;right:10px;bottom:8px;color:#fff;font-size:15px;
opacity:0;transition:.3s;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.grid .ph:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(14,36,56,.18)}
.grid .ph:hover img{transform:scale(1.04)}
.grid .ph:hover::after{opacity:1}
@media(max-width:640px){
  .grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .grid .ph{border-radius:12px}
  .iDesc{margin-left:0}
}
.pend{border:1px dashed var(--line);border-radius:16px;padding:34px;text-align:center;
color:var(--mut);font-size:13.5px;background:#fbfbf9}
/* Apontamentos */
.apSec{background:#FFFCF4;border:1px solid rgba(214,165,24,.4);border-radius:20px;padding:28px 24px;margin-top:8px}
.apSec .ah{display:flex;align-items:center;gap:12px}
.apSec .ah .ic{width:42px;height:42px;border-radius:12px;background:rgba(214,165,24,.16);
display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.apSec .ah h3{font-size:17px;font-weight:800;color:var(--ink)}
.apSec .nota{font-size:12.5px;color:#7a6a3d;line-height:1.6;margin-top:12px;font-weight:600}
.apCard{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);
border-radius:14px;padding:18px;margin-top:16px}
.apCard .tx{font-size:14px;font-weight:600;line-height:1.65;color:#3d4a55}
.apCard .dt{font-size:11px;font-weight:700;color:var(--mut);margin-top:9px;letter-spacing:.4px}
.apCard .grid{margin-top:14px;grid-template-columns:repeat(3,1fr)}
.apCard .grid .ph:first-child{grid-column:auto;grid-row:auto;aspect-ratio:4/3}
/* vídeo */
.ph.vid{cursor:pointer;background:#000}
.ph.vid video{width:100%;height:100%;object-fit:cover}
.ph .vbadge{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.7);color:#fff;font-size:9.5px;
font-weight:800;padding:3px 8px;border-radius:20px;letter-spacing:.8px;z-index:2}
.ph .vplay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
font-size:38px;color:rgba(255,255,255,.9);text-shadow:0 3px 14px rgba(0,0,0,.6);pointer-events:none}
@media print{.ph.vid video{display:none}.ph.vid::before{content:'Vídeo disponível na versão online';
display:flex;align-items:center;justify-content:center;height:100%;font-size:11px;color:#888;padding:10px;text-align:center}}

/* ============ TERMO ============ */
.certWrap{background:linear-gradient(180deg,#fff 0%,#FBFAF6 100%);border:1px solid var(--line);
border-radius:24px;padding:52px 34px;text-align:center;position:relative;
box-shadow:0 24px 70px rgba(14,36,56,.08)}
.certWrap::before{content:'';position:absolute;inset:10px;border:1px solid rgba(214,165,24,.35);border-radius:16px;pointer-events:none}
.selo{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;
border-radius:40px;padding:9px 20px;font-size:11px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase}
.selo .dot{color:var(--gold)}
.certWrap h3{font-size:21px;font-weight:800;color:var(--ink);margin:24px 0 6px}
.certWrap .tx{font-size:14px;line-height:1.9;color:#4c5c68;max-width:600px;margin:14px auto 0;font-weight:500}
.assin{margin-top:36px}
.assin img{max-height:96px;max-width:300px;margin:0 auto}
.assin .linha{width:280px;height:1px;background:var(--ink);margin:10px auto 14px;opacity:.5}
.assin .nm{font-size:15px;font-weight:800;color:var(--ink)}
.assin .dc{font-size:12.5px;color:var(--mut);font-weight:600;margin-top:4px}
.assin .dt{display:inline-block;margin-top:14px;font-size:11px;font-weight:700;letter-spacing:1.5px;
color:var(--gold);text-transform:uppercase;border-top:1px solid var(--line);padding-top:10px}
.certPend{color:var(--mut);font-size:13.5px;font-style:italic;margin-top:22px}

/* ============ FOOTER ============ */
footer{background:var(--navy);color:#fff;padding:64px 22px 40px;margin-top:30px}
footer .fin{max-width:920px;margin:0 auto;text-align:center}
footer img{height:42px;margin:0 auto 26px}
footer .c{font-size:14px;font-weight:600;color:rgba(255,255,255,.85);margin:5px 0}
footer .c b{color:var(--gold);font-weight:800}
footer .site{margin-top:22px;font-size:13px;letter-spacing:1.5px;color:rgba(255,255,255,.6)}
footer .site b{color:#fff}
footer .gen{margin-top:30px;padding-top:20px;border-top:1px solid rgba(255,255,255,.1);
font-size:10.5px;color:rgba(255,255,255,.35);letter-spacing:.5px}

/* ============ LIGHTBOX ============ */
.lb{position:fixed;inset:0;background:rgba(3,13,21,.96);z-index:100;display:none;
align-items:center;justify-content:center;flex-direction:column;backdrop-filter:blur(6px)}
.lb.on{display:flex}
.lb img{max-width:94vw;max-height:80vh;object-fit:contain;border-radius:8px;
box-shadow:0 30px 90px rgba(0,0,0,.6);animation:zin .25s ease}
@keyframes zin{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.lb .cap{color:rgba(255,255,255,.85);font-size:13.5px;font-weight:700;margin-top:16px;text-align:center;padding:0 20px}
.lb .cnt{color:rgba(255,255,255,.4);font-size:11px;font-weight:700;letter-spacing:2px;margin-top:6px}
.lb button{position:fixed;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
color:#fff;cursor:pointer;font-family:inherit;transition:.2s;display:flex;align-items:center;justify-content:center}
.lb button:hover{background:rgba(255,255,255,.18)}
.lb .x{top:18px;right:18px;width:44px;height:44px;border-radius:50%;font-size:17px}
.lb .nav{top:50%;transform:translateY(-50%);width:48px;height:64px;border-radius:14px;font-size:22px}
.lb .pv{left:12px}.lb .nx{right:12px}
.lb .orig{bottom:22px;right:18px;border-radius:30px;padding:10px 18px;font-size:12px;font-weight:800}
@media(max-width:640px){.lb .nav{width:40px;height:54px}.lb img{max-height:72vh}}

/* ============ AÇÕES ============ */
.acoes{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:9px;z-index:60}
.acoes button{border:none;border-radius:40px;padding:13px 20px;font-family:inherit;font-size:13px;
font-weight:800;cursor:pointer;display:flex;align-items:center;gap:8px;
box-shadow:0 14px 36px rgba(4,20,31,.35);transition:transform .2s}
.acoes button:hover{transform:translateY(-2px)}
.bPdf{background:var(--navy);color:#fff}
.bZap{background:var(--green);color:#fff;display:none}

/* reveal */
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}
.rv.on{opacity:1;transform:none}

.center{max-width:920px;margin:0 auto;text-align:center;padding:110px 30px;color:var(--mut)}

@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  .acoes,.scroll,.lb{display:none!important}
  body{background:#fff}

  /* capa em papel: fundo claro e texto escuro, para ler e para imprimir sem gastar tinta */
  .hero{min-height:auto;padding-bottom:0;background:#fff;color:var(--ink)}
  .hero .bg{display:none}
  .hero .veil{display:none}
  .hero .in{padding:18px 0 22px}
  .hero .top img{filter:none}
  .hero h1{color:var(--ink)}
  .hero .kicker{color:var(--gold)}
  .hero .meta{border-top:1px solid var(--line)}
  .hero .meta .k{color:var(--mut)}
  .hero .meta .v{color:var(--ink)}
  .hero .meta .v.gold{color:#B8860B}

  /* rodapé escuro também vira claro no papel */
  footer{background:#fff;color:var(--ink);border-top:1px solid var(--line);padding:30px 22px}
  footer .site b{color:var(--ink)}
  .selo{background:#fff;color:var(--ink);border:1.5px solid var(--navy)}

  section{padding:26px 0;page-break-inside:avoid}
  .grid .ph:hover{transform:none;box-shadow:none}
  .grid .ph{break-inside:avoid}
}
.avalia{margin-top:14px;padding:13px 15px;background:#fbfbf8;border:1px solid var(--line);
border-radius:12px;display:none}
.avalia.on{display:block}
.avalia .lb{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;
color:var(--mut);margin-bottom:8px}
.stars{display:flex;gap:4px;align-items:center}
.st{width:38px;height:38px;border:1.5px solid var(--line);background:#fff;border-radius:10px;
cursor:pointer;font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center;
padding:0;transition:.12s}
.st:hover{border-color:var(--gold)}
.st.on{background:#FFF8E6;border-color:var(--gold)}
.stars .nt{margin-left:10px;font-size:13px;font-weight:800;color:var(--ink)}
.stars .nt.baixa{color:#B04A4A}
.avalia textarea{width:100%;margin-top:9px;border:1.5px solid var(--line);border-radius:9px;
padding:9px 11px;font-family:inherit;font-size:13px;resize:vertical;min-height:52px;display:none}
.avalia textarea.on{display:block}
.avalia .ok{font-size:11.5px;color:var(--green);font-weight:700;margin-top:7px;display:none}
.avalia .ok.on{display:block}
.notaSelo{display:inline-flex;align-items:center;gap:7px;background:#FFF8E6;
border:1.5px solid var(--gold);border-radius:30px;padding:6px 15px;font-size:13px;
font-weight:800;color:#8a6400;margin-top:10px}
.ph.vid{position:relative;background:#0d1b26;cursor:pointer}
/* vídeo sem imagem dentro precisa de altura própria */
.grid .ph.vid{aspect-ratio:4/3!important;min-height:150px}
.grid .ph.vid:first-child{aspect-ratio:16/10!important;min-height:230px}
.grid .ph.vid::after{display:none}
.grid .ph.vid video{width:100%;height:100%;object-fit:cover;display:block}
.vcapa{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
justify-content:center;gap:9px;background:linear-gradient(135deg,#12283a,#0a1622)}
.vcapa .vplay{position:static;width:52px;height:52px;border-radius:50%;
background:rgba(245,166,35,.92);color:#0B2437;display:flex;align-items:center;
justify-content:center;font-size:21px;padding-left:3px}
.vcapa .vtxt{font-size:12px;font-weight:700;color:#9DB2C4;letter-spacing:.3px}
.ph.vid:hover .vcapa .vplay{transform:scale(1.06)}
.edbar{position:fixed;left:14px;bottom:14px;z-index:60;background:var(--navy);color:#fff;
border:none;border-radius:30px;padding:11px 18px;font-family:inherit;font-size:13px;
font-weight:800;cursor:pointer;box-shadow:0 6px 22px rgba(0,0,0,.28);display:none;gap:7px;align-items:center}
.edbar.on{display:inline-flex}
.edov{position:fixed;inset:0;background:rgba(8,20,30,.72);z-index:70;display:none;
align-items:flex-end;justify-content:center;padding:0}
.edov.on{display:flex}
.edbox{background:#fff;width:100%;max-width:660px;max-height:92vh;overflow-y:auto;
border-radius:18px 18px 0 0;padding:0 0 20px}
@media(min-width:700px){.edov{align-items:center}.edbox{border-radius:18px}}
.edhd{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);
padding:16px 20px;display:flex;align-items:center;gap:10px;z-index:2}
.edhd b{font-size:16px;font-weight:800;flex:1}
.edhd button{background:#eef3f7;border:none;border-radius:9px;width:32px;height:32px;
font-size:15px;cursor:pointer;font-family:inherit;color:#4a6076}
.edin{padding:14px 20px}
.edit{border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:10px;background:#fff}
.edit.off{opacity:.5;background:#fafafa}
.edit .l1{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.edit .num{font-size:11px;font-weight:800;color:var(--mut);min-width:20px}
.edit .arq{font-size:10.5px;font-weight:700;color:var(--mut);background:#eef3f7;
border-radius:20px;padding:2px 8px;white-space:nowrap}
.edit .mv{margin-left:auto;display:flex;gap:4px}
.edit .mv button,.edit .tg{background:#eef3f7;border:none;border-radius:7px;width:28px;height:28px;
font-size:12px;cursor:pointer;font-family:inherit;color:#4a6076}
.edit .tg.on{background:#dff0e2;color:#2d7a3f}
.edit input{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:8px 11px;
font-family:inherit;font-size:13.5px;margin-bottom:6px;color:var(--ink)}
.edit input.d{font-size:12px;color:#4a6076}
.edit input::placeholder{color:#a8b6c2}
.edsv{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);
padding:13px 20px;display:flex;gap:9px}
.edsv button{flex:1;border:none;border-radius:11px;padding:13px;font-family:inherit;
font-size:14px;font-weight:800;cursor:pointer}
.edsv .ok{background:var(--navy);color:#fff}
.edsv .no{background:#eef3f7;color:#4a6076;flex:0 0 110px}
</style>
</head>
<body>
<div id="root"><div class="center">⏳ Preparando seu relatório...</div></div>
<button class="edbar" id="edBtn" onclick="abrirEditor()">✏️ Editar seções</button>
<div class="edov" id="edOv"><div class="edbox" id="edBox"></div></div>

<script>
var SUPABASE_URL='https://dakubhcgohiwzyqiegqf.supabase.co';
var SUPABASE_KEY='sb_publishable_hue0wC6DINtAaxTPlSIOIg_X1Tr0vJx';
var sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
var SLUG=new URLSearchParams(location.search).get('id');
var OBRA_ID=null;
var LOGO_BRANCA='https://obras.polarisenergiasolar.com/logo.png';
var LOGO_ESCURA='https://obras.polarisenergiasolar.com/logo-escura.png';
var D=null, GAL=[], gi=0;

function tituloRel(o){
  if(o.trilha==='manutencao'){
    var t=(o.tipo_manutencao==='corretiva')?'Relatório de Manutenção Corretiva'
        :(o.tipo_manutencao==='diagnostico')?'Laudo de Avaliação Técnica'
        :'Relatório de Manutenção Preventiva';
    return t;
  }
  return (o.trilha==='eletroposto')?'Relatório de Implantação':'Relatório de Instalação';
}
function servicoNome(o){
  return (o.tipo_manutencao==='corretiva')?'Manutenção corretiva'
       :(o.tipo_manutencao==='diagnostico')?'Avaliação técnica'
       :'Manutenção preventiva';
}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function dataBR(s){if(!s)return null;var d=new Date(s.length<=10?s+'T12:00:00':s);return isNaN(d)?null:d.toLocaleDateString('pt-BR');}

async function boot(){
  if(!SLUG){document.getElementById('root').innerHTML='<div class="center">🔗 Link incompleto.</div>';return;}
  var r=await sb.rpc('get_relatorio_publico',{p_slug:SLUG});
  if(r.error||!r.data){document.getElementById('root').innerHTML='<div class="center">🔒 Relatório não encontrado.</div>';return;}
  D=r.data;
  OBRA_ID=(D.obra&&D.obra.id)||null;
  try{
    var sess=await sb.auth.getSession();
    if(sess.data.session && OBRA_ID){
      var av=await sb.rpc('get_avaliacoes',{p_obra:OBRA_ID});
      if(av.data){
        AVAL.pode=!!av.data.pode_avaliar; AVAL.itens=av.data.itens||{};
        if(AVAL.pode){ var eb=document.getElementById('edBtn'); if(eb) eb.classList.add('on'); }
      }
    }
  }catch(e){}
  render();
  atualizaSelo();
  try{var s=await sb.auth.getSession();if(s.data.session){var b=document.getElementById('bZap');if(b)b.style.display='flex';}}catch(e){}
}

function render(){
  var o=D.obra, fotos=D.fotos||[], itens=D.itens||[];
  // capa: prioriza foto dos módulos instalados (3), depois geral (9), depois a primeira
  var imgs=fotos.filter(function(f){return f.tipo!=='video'});
  var capa=(imgs.find(function(f){return f.item_id===3})||imgs.find(function(f){return f.item_id===9})||imgs[0]||{}).url||'';

  }

  /* FOOTER */
  h+='<footer><div class="fin">'

var AVAL={pode:false,itens:{}}, VID=0, SEC=[];

async function abrirEditor(){
  var box=document.getElementById('edBox');
  document.getElementById('edOv').classList.add('on');
  box.innerHTML='<div class="edin"><div class="center">Carregando...</div></div>';
  var r=await sb.rpc('get_secoes_relatorio',{p_obra:OBRA_ID});
  if(r.error||!r.data){ box.innerHTML='<div class="edin">Não foi possível carregar.</div>'; return; }
  SEC=r.data.map(function(x,i){ return {
    id:x.id, padrao:x.titulo_padrao, dpadrao:x.descricao_padrao,
    titulo:x.titulo||'', descricao:x.descricao||'',
    oculto:!!x.oculto, arquivos:Number(x.arquivos||0)
  };});
  desenhaEditor();
}
function fecharEditor(){ document.getElementById('edOv').classList.remove('on'); }

function desenhaEditor(){
  var h='<div class="edhd"><b>Seções do relatório</b>'
    +'<button onclick="fecharEditor()">✕</button></div><div class="edin">';
  var pos=0;
  SEC.forEach(function(x,i){
    if(!x.oculto) pos++;
    h+='<div class="edit'+(x.oculto?' off':'')+'">'
      +'<div class="l1">'
      +'<span class="num">'+(x.oculto?'—':String(pos).padStart(2,'0'))+'</span>'
      +'<button class="tg'+(x.oculto?'':' on')+'" onclick="alternar('+i+')" '
      +'title="'+(x.oculto?'Mostrar':'Ocultar')+'">'+(x.oculto?'🚫':'👁')+'</button>'
      +'<span class="arq">'+(x.arquivos?x.arquivos+(x.arquivos>1?' arquivos':' arquivo'):'vazia')+'</span>'
      +'<span class="mv">'
      +'<button onclick="mover('+i+',-1)" '+(i===0?'disabled':'')+'>↑</button>'
      +'<button onclick="mover('+i+',1)" '+(i===SEC.length-1?'disabled':'')+'>↓</button>'
      +'</span></div>'
      +'<input value="'+esc(x.titulo)+'" placeholder="'+esc(x.padrao)+'" '
      +'oninput="SEC['+i+'].titulo=this.value">'
      +'<input class="d" value="'+esc(x.descricao)+'" placeholder="'+esc(x.dpadrao||'')+'" '
      +'oninput="SEC['+i+'].descricao=this.value">'
      +'</div>';
  });
  h+='<div style="font-size:12px;color:var(--mut);line-height:1.5;margin-top:4px">'
    +'Deixe em branco para usar o texto padrão. Seções ocultas não aparecem para o cliente, '
    +'mas as fotos continuam salvas.</div></div>'
    +'<div class="edsv"><button class="no" onclick="fecharEditor()">Cancelar</button>'
    +'<button class="ok" id="edOk" onclick="salvarSecoes()">Salvar</button></div>';
  document.getElementById('edBox').innerHTML=h;
}
function alternar(i){ SEC[i].oculto=!SEC[i].oculto; desenhaEditor(); }
function mover(i,d){
  var j=i+d; if(j<0||j>=SEC.length) return;
  var t=SEC[i]; SEC[i]=SEC[j]; SEC[j]=t; desenhaEditor();
}
async function salvarSecoes(){
  var b=document.getElementById('edOk'); b.disabled=true; b.textContent='Salvando...';
  var payload=SEC.map(function(x,i){ return {
    item_id:x.id, titulo:x.titulo||null, descricao:x.descricao||null,
    oculto:!!x.oculto, ordem:i+1 }; });
  var r=await sb.rpc('salvar_secoes_relatorio',{p_obra:OBRA_ID, p_itens:payload});
  if(r.error||(r.data&&r.data.erro)){
    alert('Erro: '+((r.data&&r.data.erro)||r.error.message));
    b.disabled=false; b.textContent='Salvar'; return;
  }
  location.reload();
}
function tocarVideo(box,url){
  if(box.dataset.on) return;
  box.dataset.on='1';
  box.innerHTML='<video id="vp'+box.id+'" src="'+url+'" controls autoplay playsinline preload="auto" '
    +'style="width:100%;height:100%;object-fit:cover;background:#000"></video>';
  var v=box.querySelector('video');
  // Alguns celulares gravam em HEVC: o áudio toca, a imagem fica preta.
  // Se o vídeo não reportar largura, oferece abrir no player do aparelho.
  function semImagem(){
    if(box.dataset.aviso) return;
    box.dataset.aviso='1';
    try{ v.pause(); }catch(e){}
    box.innerHTML='<div class="vcapa" style="padding:16px;text-align:center">'
      +'<div style="font-size:26px">📼</div>'
      +'<div style="font-size:12.5px;font-weight:800;color:#e8c07a;line-height:1.45">'
      +'Este navegador não consegue exibir<br>a imagem deste vídeo</div>'
      +'<a href="'+url+'" target="_blank" rel="noopener" '
      +'style="background:var(--gold);color:#0B2437;text-decoration:none;font-weight:800;'
      +'font-size:12.5px;border-radius:9px;padding:9px 16px;margin-top:4px">Abrir no aparelho</a>'
      +'<div style="font-size:10.5px;color:#8fa6b8">O arquivo está salvo e íntegro</div></div>';
  }
  v.addEventListener('loadeddata', function(){
    if(!v.videoWidth || !v.videoHeight) semImagem();
  });
  v.addEventListener('error', semImagem);
  setTimeout(function(){
    if(v.readyState>=2 && (!v.videoWidth || !v.videoHeight)) semImagem();
  }, 3500);
}
function blocoAvalia(it){
  if(!AVAL.pode) return '';
  var a=AVAL.itens[it.id]||{}, e=Number(a.estrelas||0);
  var h='<div class="avalia on" id="av'+it.id+'"><div class="lb">Como ficou esta etapa?</div><div class="stars">';
  for(var k=1;k<=5;k++)
    h+='<button type="button" class="st'+(k<=e?' on':'')+'" data-k="'+k+'" '+
       'onclick="setNota('+it.id+','+k+')">★</button>';
  h+='<span class="nt'+(e&&e<=3?' baixa':'')+'" id="nt'+it.id+'">'+(e?(e*2)+'/10':'')+'</span></div>'+
    '<textarea id="ob'+it.id+'" class="'+(e&&e<=3?'on':'')+'" placeholder="O que faltou nesta etapa? (aparece no seu painel)" '+
    'onblur="salvaNota('+it.id+')">'+esc(a.obs||'')+'</textarea>'+
    '<div class="ok" id="ok'+it.id+'">✓ salvo</div></div>';
  return h;
}
function setNota(itemId,k){
  var box=document.getElementById('av'+itemId); if(!box) return;
  box.querySelectorAll('.st').forEach(function(b){
    b.classList.toggle('on', Number(b.dataset.k)<=k);
  });
  var nt=document.getElementById('nt'+itemId);
  nt.textContent=(k*2)+'/10';
  nt.classList.toggle('baixa', k<=3);
  var ta=document.getElementById('ob'+itemId);
  if(k<=3){ ta.classList.add('on'); ta.focus(); } else { ta.classList.remove('on'); }
  AVAL.itens[itemId]=AVAL.itens[itemId]||{};
  AVAL.itens[itemId].estrelas=k;
  salvaNota(itemId);
}
async function salvaNota(itemId){
  var a=AVAL.itens[itemId]; if(!a||!a.estrelas) return;
  var ta=document.getElementById('ob'+itemId);
  var obs=ta?ta.value:'';
  a.obs=obs;
  var r=await sb.rpc('avaliar_item',{p_obra:OBRA_ID,p_item:itemId,
    p_estrelas:a.estrelas,p_obs:obs||null});
  if(r.error||(r.data&&r.data.erro)) return;
  var ok=document.getElementById('ok'+itemId);
  if(ok){ ok.classList.add('on'); setTimeout(function(){ok.classList.remove('on');},1600); }
  atualizaSelo();
}
function atualizaSelo(){
  var vals=Object.values(AVAL.itens).map(function(x){return Number(x.estrelas||0);}).filter(Boolean);
  var el=document.getElementById('seloNota'); if(!el) return;
  if(!vals.length){ el.style.display='none'; return; }
  var media=vals.reduce(function(a,b){return a+b;},0)/vals.length*2;
  el.style.display='inline-flex';
  el.innerHTML='⭐ <b>'+media.toFixed(1)+'</b> · '+vals.length+' etapa'+(vals.length>1?'s':'')+' avaliada'+(vals.length>1?'s':'');
}
function midiaHtml(f,cap){
  if(f.tipo==='video'){
    // vídeo de obra costuma ter dezenas de MB: não pré-carrega, abre sob demanda
    return '<div class="ph vid" id="v'+(++VID)+'" onclick="tocarVideo(this,\''+esc(f.url)+'\')">'
      +'<span class="vbadge">VÍDEO</span>'
      +'<div class="vcapa"><div class="vplay">▶</div>'
      +'<div class="vtxt">Toque para assistir</div></div></div>';
  }
  var idx=GAL.length; GAL.push({url:f.url,cap:cap||''});
  return '<div class="ph" onclick="abrirLb('+idx+')"><img src="'+esc(f.url)+'" loading="lazy" alt="'+esc(cap||'')+'"></div>';
}
/* Lightbox */
function abrirLb(i){gi=i;updLb();document.getElementById('lb').classList.add('on');document.body.style.overflow='hidden';}
function fecharLb(){document.getElementById('lb').classList.remove('on');document.body.style.overflow='';}
function navLb(d){gi=(gi+d+GAL.length)%GAL.length;updLb();}
function updLb(){var g=GAL[gi];document.getElementById('lbImg').src=g.url;
document.getElementById('lbCap').textContent=g.cap;
document.getElementById('lbCnt').textContent=(gi+1)+' / '+GAL.length;}
document.addEventListener('keydown',function(e){
  if(!document.getElementById('lb')||!document.getElementById('lb').classList.contains('on'))return;
  if(e.key==='Escape')fecharLb();
  if(e.key==='ArrowLeft')navLb(-1);
  if(e.key==='ArrowRight')navLb(1);
});
// swipe no lightbox
var tx=null;
document.addEventListener('touchstart',function(e){var lb=document.getElementById('lb');if(lb&&lb.classList.contains('on'))tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',function(e){if(tx===null)return;var dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)navLb(dx>0?-1:1);tx=null;},{passive:true});

async function enviarNoGrupo(){
  if(!confirm('Enviar o link deste relatório no grupo do cliente?'))return;
  var s=await sb.auth.getSession();
  if(!s.data.session){alert('Faça login no painel primeiro.');return;}
  var q=await sb.from('obras').select('whatsapp_grupo_id').eq('slug',SLUG).single();
  if(q.error||!q.data||!q.data.whatsapp_grupo_id){alert('Esta obra não tem grupo de WhatsApp.');return;}
  var link=location.origin+'/relatorio.html?id='+encodeURIComponent(SLUG);
  var msg='📄 *Relatório oficial da instalação — Polaris Energia Solar*\n\nSeu relatório completo está disponível, com todas as fotos em alta qualidade, os dados técnicos da usina e o termo de conclusão:\n\n🔗 '+link+'\n\nToque nas fotos para vê-las em tela cheia. 📱\n\n*Equipe Polaris Energia Solar* ☀️';
  var r=await sb.functions.invoke('notificar-grupo',{body:{grupo_id:q.data.whatsapp_grupo_id,message:msg}});
  if(r.error||(r.data&&r.data.error)){alert('Erro: '+((r.data&&r.data.error)||r.error.message));return;}
  alert('✅ Relatório enviado no grupo!');
}
